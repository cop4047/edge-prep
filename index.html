<script type="text/plain" id="cards">
@deck prob | Probability & EV | prob
Q: Expected value of a fair six-sided die? Derive it, don't recall it.
A: Faces pair up 1+6, 2+5, 3+4 = 7 each, so the mean is **7/2 = 3.5**. For an n-sided die: (n+1)/2.

Q: Variance of a fair die roll?
A: E[X²] = 91/6, E[X]² = 49/4. Var = 91/6 − 49/4 = **35/12 ≈ 2.92**.

Q: Expected value of the larger of two fair dice?
A: P(max = k) = (2k−1)/36. E = (1·1+2·3+3·5+4·7+5·9+6·11)/36 = **161/36 ≈ 4.47**.
Sanity check: must be above 3.5.

Q: Roll a die; you may take the face value in £ or reroll once and take the second result. Fair value with optimal play?
A: Reroll if the first roll is below the value of rerolling (3.5): reroll 1–3, keep 4–6.
E = ½·5 + ½·3.5 = **4.25**.

Q: Same game but you may reroll up to twice (three rolls max). Value?
A: With one reroll left the value is 4.25, so on the first roll keep only 5 or 6.
E = (5+6)/6 + (4/6)·4.25 = 11/6 + 17/6 = **14/3 ≈ 4.67**.

Q: Expected number of fair coin flips to get the first head?
A: E = 1 + ½E ⇒ **E = 2**. In general a geometric trial with success p takes 1/p tries.

Q: Expected rolls of a die until the first 6?
A: E = 1 + (5/6)E ⇒ **E = 6** (= 1/p). Use the probability of *failing* in the recursion.

Q: Expected flips until two heads in a row (HH)?
A: States: start S, just saw H.
S = 1 + ½H + ½S; H = 1 + ½·0 + ½S ⇒ **S = 6**.

Q: Expected flips until the pattern HT?
A: Once you have an H, you just wait for a T (2 flips). Waiting for the first H takes 2. **Total 4**. (Compare HH = 6: patterns that overlap themselves take longer.)

Q: A disease has 1% prevalence. The test is positive 90% of the time if sick and 9% if healthy. P(sick | positive)?
A: Natural frequencies, 10,000 people: 100 sick → 90 positive; 9,900 healthy → 891 positive.
P = 90/981 ≈ **9.2%**.

Q: Draw 2 cards without replacement. P(both aces)?
A: (4/52)(3/51) = 12/2652 = **1/221 ≈ 0.45%**.

Q: Expected number of rolls to see all six faces of a die?
A: Coupon collector: 6(1 + 1/2 + … + 1/6) = 6 · 49/20 = **14.7**.

Q: Smallest group where P(shared birthday) > 50%?
A: **23 people**. Compute P(all distinct) = ∏(1 − k/365); the number of pairs, C(23,2) = 253, is why it's small.

Q: Break a stick at two uniform random points. P(the three pieces form a triangle)?
A: Need every piece < ½. **1/4**.

Q: E|U₁ − U₂| for two independent Uniform(0,1)?
A: **1/3**.

Q: Expected maximum of n independent Uniform(0,1)?
A: P(max ≤ x) = xⁿ, so density nxⁿ⁻¹ and E = **n/(n+1)**. Minimum: 1/(n+1).

Q: Fair ±£1 coin game, you start with £k and stop at £0 or £N. P(you reach N)?
A: Fair game ⇒ wealth is a martingale: **k/N**.

Q: Monty Hall: you pick a door, host opens a goat door. Switch?
A: Yes. Switching wins **2/3**: it wins whenever your first pick was wrong.

Q: Three cards: red/red, white/white, red/white. One is drawn and placed, red face up. P(the other side is red)?
A: Count red faces: 3 equally likely, 2 belong to the red/red card. **2/3**.

Q: P(at least one 6 in four rolls)?
A: 1 − (5/6)⁴ = 1 − 625/1296 = **671/1296 ≈ 51.8%**.

Q: Expected number of fixed points in a random permutation of n items?
A: Linearity: each item is fixed with probability 1/n, so **1**, for any n.

Q: Shuffle a deck and turn cards until the first ace. Expected number of cards turned (including the ace)?
A: The 4 aces split the 48 others into 5 gaps of expected size 48/5 = 9.6. So **9.6 + 1 = 10.6** (= 53/5).

Q: You roll a die and are paid the square of the result. Fair price?
A: E[X²] = (1+4+9+16+25+36)/6 = **91/6 ≈ 15.17**. Note E[X²] ≠ E[X]² = 12.25.

Q: A family has two children, at least one is a boy. P(both boys)?
A: Outcomes BB, BG, GB equally likely ⇒ **1/3**. (If you know the *older* one is a boy: 1/2.)

Q: Three ants on the corners of a triangle each walk along a random edge. P(no collision)?
A: Only all-clockwise or all-anticlockwise works: 2/8 = **1/4**.

Q: Most likely sum of two dice, and its probability?
A: **7**, with 6/36 = **1/6**. In general P(sum = s) = (6 − |s − 7|)/36.

Q: Kelly fraction for an even-money bet you win with probability p = 0.6?
A: f* = p − q/b = 0.6 − 0.4/1 = **0.2** of bankroll. Betting more raises variance and lowers long-run growth.

Q: Linearity of expectation: what is it, and why do interviewers love it?
A: E[X+Y] = E[X] + E[Y] **even when X and Y are dependent**. Break a count into indicator variables and sum their probabilities (fixed points, matches, runs).

Q: Expected number of pairs sharing a birthday among n people?
A: Indicators per pair: **C(n,2)/365**. With 28 people: 378/365 ≈ 1.04.

Q: Expected number of runs in 10 fair coin flips (e.g. HHTHT = 4 runs)?
A: 1 + (number of changes). Each of 9 adjacent pairs differs with p = ½. **1 + 9/2 = 5.5**.

@deck mm | Market making & trading | mm
Q: Define bid, ask, spread, mid.
A: **Bid**: highest price someone will buy at. **Ask/offer**: lowest price someone will sell at. **Spread** = ask − bid. **Mid** = (bid + ask)/2.

Q: Your bid gets hit. Are you now long or short?
A: Someone sold to you at your bid ⇒ you **bought** ⇒ **long**. "Lifted" means someone bought at your offer ⇒ you're short.

Q: "Make me a market on the sum of two dice." What's a good answer?
A: Fair value 7. Quote around it, e.g. **6.5 bid – 7.5 offer**, and say why: the spread pays for uncertainty (sd ≈ 2.4) and the risk the counterparty knows something. Be ready to update if they trade.

Q: What is adverse selection, and how does a market maker respond?
A: The people who choose to trade with you are disproportionately the ones who know more. If you keep getting hit or lifted on one side, your fair value is probably wrong: **move your quotes and/or widen**.

Q: You're long a lot of inventory. How do you adjust your quotes?
A: **Skew down**: lower both bid and offer, so you're more likely to sell and less likely to buy more. Quotes reflect both fair value and position risk.

Q: Market order vs limit order?
A: Market: execute now at the best available price (pays the spread, certain fill). Limit: execute only at your price or better (may not fill, earns the spread if it rests).

Q: Why does speed matter so much for a market maker?
A: Quotes rest in the book. When news moves fair value, a slow maker's **stale quotes get picked off** by faster traders. Low latency means cancelling or updating before that happens.

Q: Sharpe ratio?
A: (mean return − risk-free rate) / standard deviation of returns. Annualise daily Sharpe by multiplying by √252.

Q: Put–call parity (European options, no dividends)?
A: **C − P = S − K·e^(−rT)**. Long call + short put = synthetic long forward.

Q: What is delta?
A: Sensitivity of an option's price to the underlying: ∂V/∂S. Call delta is between 0 and 1; an at-the-money call has delta ≈ 0.5.

Q: Positive-EV bet: why not bet your whole bankroll?
A: Variance and ruin. One loss ends the game. Long-run growth is maximised by betting a fraction (Kelly), and practitioners often bet less (half-Kelly).

Q: How should you approach a Fermi estimate in an interview ("how many piano tuners in London")?
A: State assumptions out loud, break into factors, round to easy numbers, give a range, then sanity-check against something you know. Process is graded more than the number.

Q: Someone offers a bet you're unsure is fair. What questions do you ask?
A: Why are they offering it (adverse selection)? What's the max loss? Can you size it small? Can you get information first? Is it repeated?

Q: What is the microprice?
A: Mid weighted by queue sizes: (bid·askSize + ask·bidSize)/(bidSize + askSize). A big bid queue pushes the fair price toward the ask.

Q: Tick-to-trade?
A: Time from the market-data packet arriving at the system to the resulting order leaving it. The core latency metric for HFT systems.

@deck mental | Mental maths | arith
Q: Fast way to multiply by 25?
A: ×100 then ÷4. 36 × 25 = 3600/4 = **900**.

Q: Multiply a two-digit number by 11?
A: Put the digit sum in the middle (carry if ≥ 10). 72 × 11 = 7|9|2 = **792**; 87 × 11 = 8|15|7 → **957**.

Q: Square a number ending in 5, e.g. 65²?
A: n(n+1) then append 25: 6 × 7 = 42 → **4225**.

Q: 47 × 53 quickly?
A: Difference of squares: 50² − 3² = 2500 − 9 = **2491**.

Q: 98 × 97 quickly?
A: (100 − 2)(100 − 3) = 10000 − 500 + 6 = **9506**.

Q: 8% of 25?
A: Swap: x% of y = y% of x ⇒ 25% of 8 = **2**.

Q: Decimal values of 1/6, 1/7, 1/8, 1/9, 1/12, 1/16?
A: 0.1667, **0.142857** (repeating), 0.125, 0.111…, 0.0833, 0.0625.

Q: Powers of 2 to know cold?
A: 2¹⁰ = 1024 ≈ 10³, 2¹⁶ = **65,536**, 2²⁰ ≈ 10⁶, 2³² ≈ 4.29 × 10⁹.

Q: Constants worth knowing?
A: √2 ≈ 1.414, √3 ≈ 1.732, e ≈ 2.718, ln 2 ≈ 0.693, ln 10 ≈ 2.303, π ≈ 3.1416.

Q: Rule of 72?
A: Doubling time ≈ 72 / (rate in %). At 8% a year, ~9 years. (Exact uses ln 2 ≈ 0.693.)

Q: Divisibility tests for 3, 9, 11?
A: 3 and 9: digit sum divisible. 11: alternating digit sum divisible (918082: 9−1+8−0+8−2 = 22 ✓).

Q: Multiply by 9 quickly?
A: ×10 − self. 9 × 74 = 740 − 74 = **666**.

Q: Divide by 5 quickly?
A: ×2 then ÷10. 345/5 = 690/10 = **69**.

Q: Squares from 11² to 20²?
A: 121, 144, 169, 196, 225, 256, 289, 324, 361, 400.

@deck vlog | Verilog fundamentals | verilog
Q: Blocking (=) vs nonblocking (<=)?
A: `=` updates immediately, in order. `<=` samples all right-hand sides first, then updates together at the end of the time step.
Rule: **`<=` in clocked blocks, `=` in combinational blocks.**

Q: What is wrong with this shift register?
```
always @(posedge clk) begin
  b = a;
  c = b;
end
```
A: Blocking assignments: `c` gets the **new** `b` (= `a`) in the same edge, so the two stages collapse into one. Use `<=` for both.

Q: When does a combinational always block infer a latch?
A: When some path through the block **doesn't assign** an output (missing `else`, case without `default`). The signal must hold its old value ⇒ latch. Fix: default assignments at the top of the block.

Q: `wire` vs `reg` (Verilog-2001)?
A: `reg` for anything assigned inside `always`/`initial`; `wire` for `assign` and port connections. `reg` does **not** mean a flip-flop. SystemVerilog `logic` works for both.

Q: `|v` vs `a | b` vs `a || b`?
A: `|v` is a **reduction** OR (1 bit, OR of all bits). `a | b` is bitwise (same width). `a || b` is **logical** (1 bit: is either nonzero).

Q: Replicate a bit 24 times inside a concatenation?
A: `{{24{in[7]}}, in}`. The replication needs its own braces.

Q: Sign-extend an 8-bit value to 32 bits?
A: Replicate the MSB: `{{24{in[7]}}, in}`. The MSB is the sign bit in two's complement.

Q: For `input [7:0] in`, which bit is the MSB?
A: `in[7]`. The **left index of the declaration** is the MSB. Part-selects must match direction: `in[7:4]`, not `in[4:7]`.

Q: Reverse the bits of an 8-bit bus in Verilog-2001?
A: `assign out = {in[0],in[1],in[2],in[3],in[4],in[5],in[6],in[7]};` or a `generate` loop with `out[i] = in[W-1-i]`. (SystemVerilog: `{<<{in}}`.)

Q: Synchronous active-high reset flop, 8 bits?
A:
```
always @(posedge clk)
  if (reset) q <= 8'd0;
  else       q <= d;
```

Q: Asynchronous active-high reset flop?
A:
```
always @(posedge clk or posedge areset)
  if (areset) q <= 8'd0;
  else        q <= d;
```
The only difference is the sensitivity list.

Q: D latch in Verilog?
A:
```
always @(*)
  if (ena) q = d;   // no else: holds
```
Intentional missing `else`. Avoid latches in FPGA designs unless required.

Q: `==` vs `===`?
A: `==` returns X if either side has X/Z. `===` compares X and Z literally and always returns 0/1. `===` is **simulation-only** (testbenches).

Q: Signed and unsigned mixed in one expression: what happens?
A: If **any** operand is unsigned, the whole expression is evaluated unsigned. Use `$signed()` on all operands, or declare them `signed`.

Q: You add two 8-bit values into an 8-bit result. What happens to the carry?
A: It's dropped. Expression width follows the context; make the LHS 9 bits (or concatenate `{cout, sum} = a + b`).

Q: Named vs positional port connections?
A: Positional: `m u0 (a, b, y);` follows declaration order. Named: `m u0 (.in1(a), .in2(b), .out(y));`. **Prefer named**: positional connections silently mis-wire if ports are reordered.

Q: Can you assign to an `input` port inside a module?
A: **No.** Inputs are driven from outside. Reset clears the register (`q`), not the input (`d`).

Q: Can an instantiation appear on the right of `assign`?
A: No. Instantiate the module on its own line; the output port connection drives the wire:
```
wire a;
my_dff u1 (.clk(clk), .d(d), .q(a));
```

Q: What does `generate for` produce?
A: Repeated **hardware** (instances or assigns) elaborated at compile time, using a `genvar`. It is not a runtime loop.

Q: Is an `initial` block synthesisable?
A: On FPGAs, often yes for **register/RAM initial values** (the bitstream loads them). On ASICs, no. Don't rely on it for reset behaviour.

Q: `casez` vs `casex`?
A: `casez` treats `?`/Z as don't-care (good for priority decoders). `casex` also treats X as don't-care, which can hide simulation bugs. Prefer `casez` or SV `case inside`.

Q: Multiple `always` blocks assign the same reg. Problem?
A: **Multiple drivers.** Synthesis errors or unpredictable hardware. Each signal is driven from exactly one block.

Q: Parameterise a module's width?
A:
```
module m #(parameter W = 8) (input [W-1:0] a, output [W-1:0] y);
m #(.W(16)) u0 (.a(x), .y(z));
```

@deck bug | Spot the bug | verilog
Q: Find the bugs:
```
wire x = {5{a,b,c,d,e}};
assign out = ~{x^y}
```
A: `x` is declared **1-bit**, so the 25-bit value is truncated (needs `wire [24:0]`). Missing semicolon after `assign`.

Q: Find the bug:
```
always @(*) begin
  if (negedge areset) q <= 0;
  else q <= d;
end
```
A: Edge keywords only belong in the sensitivity list. `@(*)` makes it combinational (latch). Needs `always @(posedge clk or posedge areset)` and `if (areset)`.

Q: Find the bug:
```
output [7:0] q;
always @(posedge clk) q <= d;
```
A: `q` is assigned in an `always` block, so it must be `output reg [7:0] q`.

Q: Find the bug:
```
always @(*) begin
  case (sel)
    2'd0: y = a;
    2'd1: y = b;
    2'd2: y = c;
  endcase
end
```
A: `sel = 3` assigns nothing ⇒ **latch**. Add `default: y = d;` or a default assignment before the case.

Q: Find the bug:
```
if (sel = 2'd1) q = a;
```
A: `=` is assignment, `==` is comparison. In Verilog this is a syntax error; in C it would silently assign.

Q: Find the bug:
```
always @(posedge clk) begin
  in  <= in ^ out;
  out <= in;
end
```
A: Assigning to an input. Intended: `out <= in ^ out;` (one flop with XOR feedback).

Q: Find the bug:
```
assign out_or_logical = a | b;   // a, b are [2:0]
```
A: Bitwise OR gives 3 bits truncated to 1. Logical OR is `a || b`.

Q: Find the bug:
```
always @(a) y = a & b;
```
A: Incomplete sensitivity list: `b` changes don't update `y` in simulation, while synthesis ignores the list ⇒ **sim/synth mismatch**. Use `always @(*)` / `always_comb`.

Q: Find the bug (crossing clock domains):
```
always @(posedge clk_b) cnt_b <= cnt_a;   // cnt_a: 8-bit counter in clk_a
```
A: A multi-bit binary value sampled directly: bits change at different times, so `cnt_b` can capture a value that never existed, plus metastability. Use a **Gray-coded** pointer with a 2-flop synchroniser, a handshake, or an async FIFO.

Q: Find the bug:
```
assign out = (a + b) >> 1;   // a, b, out: [7:0]
```
A: `a + b` may be evaluated at 8 bits, losing the carry before the shift. Widen the expression: `({1'b0,a} + {1'b0,b}) >> 1`.

Q: Find the bug:
```
always @(posedge clk) if (en) q <= d;
always @(posedge clk) if (rst) q <= 0;
```
A: `q` driven from two blocks (multiple drivers). Merge into one block with reset first.

@deck seq | Sequential design & FSMs | verilog
Q: Mealy vs Moore machine?
A: **Moore**: outputs depend on state only (glitch-free, one cycle later). **Mealy**: outputs depend on state + inputs (react in the same cycle, but combinational path from input to output).

Q: One-hot vs binary state encoding on an FPGA?
A: One-hot: one flop per state, very shallow next-state logic ⇒ fast; FPGAs have plenty of flops. Binary: fewer flops, deeper decoding. Tools often re-encode automatically.

Q: Standard FSM coding style?
A: A clocked block for `state <= next;` with reset, plus a combinational block computing `next` (and outputs) with **defaults at the top** to avoid latches.

Q: Rising-edge detector for a signal `x` in the clock domain?
A:
```
always @(posedge clk) x_d <= x;
assign rise = x & ~x_d;
```

Q: What is an LFSR used for?
A: Pseudo-random sequences, test patterns, CRC-like scrambling. Shift register with XOR feedback taps; maximal length 2ⁿ − 1 (never all-zero for XOR form).

Q: Valid/ready (AXI-Stream) handshake: when does a transfer happen?
A: On a clock edge where **both valid and ready are high**. A source must not wait for ready before asserting valid, and must hold data stable until the transfer.

Q: What problem does a skid buffer solve?
A: Registering `ready` breaks the combinational path but means the upstream may send one more beat after you deassert ready. The skid buffer holds that extra beat so nothing is lost.

Q: Pipelining: what does it trade?
A: Adds registers to cut long combinational paths ⇒ **higher clock / throughput**, at the cost of more cycles of **latency** and more flops.

Q: Latency vs throughput, in one line each?
A: **Latency**: time for one item from input to output. **Throughput**: items completed per unit time. A pipeline can have high throughput and long latency.

Q: Clock gating on an FPGA: why avoid it?
A: Logic-driven clocks cause skew and glitches and bypass the global clock network. Use a **clock enable** on the flops instead.

Q: Counting modulo 10 with a 4-bit counter?
A:
```
always @(posedge clk)
  if (reset || q == 4'd9) q <= 0;
  else q <= q + 1'b1;
```

Q: Synchronous FIFO: how to get full and empty with pointers?
A: Use (N+1)-bit read/write pointers for depth 2ᴺ. **Empty**: pointers equal. **Full**: low N bits equal, MSBs differ.

@deck timing | Timing & CDC | timing
Q: Define setup time and hold time.
A: **Setup**: data must be stable a minimum time **before** the clock edge. **Hold**: data must stay stable a minimum time **after** the edge.

Q: What sets the maximum clock frequency?
A: The worst register-to-register path: T ≥ t_clk→q + t_logic + t_route + t_setup − clock skew. f_max = 1/T.

Q: Slack, WNS, TNS?
A: **Slack** = required time − arrival time (negative = failing). **WNS**: worst negative slack across paths. **TNS**: sum of negative slack over all failing endpoints.

Q: How do you fix a setup violation?
A: Pipeline (add a register stage), reduce logic levels, retime, cut fanout (replicate the driver), use dedicated resources (carry chain, DSP, BRAM output register), or lower the clock.

Q: What causes hold violations, and who usually fixes them?
A: Very short paths plus clock skew. The router normally fixes them by adding delay. They're frequency-independent: a hold failure fails at every clock speed.

Q: What is metastability?
A: A flop samples an input changing near the edge and its output hovers between 0 and 1 for an unbounded time. Unavoidable when sampling asynchronous signals; the probability of it lasting decays exponentially with time.

Q: Two-flop synchroniser: what and why?
A: Pass a **single-bit** asynchronous signal through two flops in the destination clock. The first may go metastable; the extra cycle gives it time to resolve before logic uses it. MTBF grows exponentially with resolution time.

Q: Why can't you pass a multi-bit bus through 2-flop synchronisers?
A: Each bit resolves independently, so the destination can see a mix of old and new bits: a value that never existed. Use Gray code (one bit changes per step), a handshake with stable data, or an async FIFO.

Q: Binary to Gray and Gray to binary?
A: g = b ^ (b >> 1). Back: b[MSB] = g[MSB], then b[i] = b[i+1] ^ g[i] (prefix XOR from the top).

Q: Async FIFO full/empty in Gray code with (N+1)-bit pointers?
A: **Empty** (read side): read Gray pointer == synchronised write Gray pointer. **Full** (write side): top **two** bits inverted, the rest equal to the synchronised read Gray pointer.

Q: Passing a one-cycle pulse from a fast to a slow clock?
A: A pulse can be missed. Convert to a **toggle** in the source domain, synchronise the toggle, then edge-detect it in the destination (or use a request/acknowledge handshake).

Q: Reset synchroniser?
A: Assert asynchronously, **deassert synchronously** (through two flops in the destination clock), so all flops leave reset on the same edge and none sees reset release near the edge.

Q: False path vs multicycle path?
A: **False path**: timing doesn't matter (e.g. a properly synchronised crossing, static config). **Multicycle**: data is allowed N cycles to arrive. Both relax timing analysis; misuse hides real bugs.

Q: Why does high fanout hurt timing?
A: One driver feeding many loads ⇒ long routing and big load. Replicate the register (or let the tool do it with max_fanout) so each copy drives fewer loads.

Q: What is clock skew vs jitter?
A: **Skew**: spatial difference in the clock's arrival time at different flops. **Jitter**: temporal variation of edges around the ideal period.

@deck arch | FPGA architecture | arch
Q: What's in a Xilinx 7-series slice?
A: **4 six-input LUTs, 8 flip-flops, a CARRY4 chain**, and wide-function muxes. SLICEM slices can also act as distributed RAM or SRL shift registers.

Q: Why count "logic levels"?
A: Each LUT on a path adds delay (~a few hundred ps plus routing). Fewer LUT levels between registers ⇒ faster path. A 6-input LUT implements any function of 6 inputs in one level.

Q: Block RAM vs distributed (LUT) RAM?
A: **BRAM**: dedicated 36 Kb (or 2 × 18 Kb), **synchronous (registered) read**, dual-port, good for big memories. **LUTRAM**: built from LUTs, asynchronous read, good for small, shallow memories; large ones create deep read muxes.

Q: What is a DSP48E1?
A: The 7-series hard multiply-accumulate block: 25 × 18 multiplier, pre-adder, 48-bit accumulator, optional pipeline registers. Use its internal registers to hit high clocks.

Q: What is an SRL16/SRL32?
A: A LUT configured as a shift register (up to 16/32 deep per LUT). Cheap delay lines; no reset on the internal stages.

Q: Why can't an Artix-7 do 10 GbE?
A: Its **GTP** transceivers top out around 6.6 Gb/s. 10GBASE-R needs 10.3125 Gb/s, e.g. Kintex-7 GTX (up to 12.5 Gb/s).

Q: MMCM / PLL?
A: Clock management tiles: synthesise new frequencies and phases from an input clock, de-skew, and drive global clock buffers (BUFG).

Q: Synthesis vs implementation?
A: **Synthesis**: RTL → netlist of LUTs, flops, RAMs, DSPs. **Implementation**: place and route onto the physical device, then timing analysis on real routing delays.

Q: Out-of-context (OOC) synthesis: what does it hide?
A: The module is built without its real I/O and clock environment: no I/O constraints, no real clock source, so clock skew and I/O timing aren't realistic.

Q: Why is BRAM read latency a design constraint?
A: Data appears **one cycle after** the address (two with the output register). Pipelines must schedule around it; a write and read to the same address in one cycle returns old or new data depending on mode (read-first/write-first).

@deck net | Networking & market data | net
Q: Ethernet frame layout?
A: Preamble + SFD (8) | dst MAC (6) | src MAC (6) | EtherType (2) | payload (46–1500) | FCS (4). Minimum frame **64 bytes** (excluding preamble); inter-packet gap 12 bytes.

Q: IPv4 and UDP header sizes?
A: IPv4: **20 bytes** without options (IHL = 5). UDP: **8 bytes** (src port, dst port, length, checksum). IP protocol number for UDP: **17**.

Q: Why is market data sent over UDP multicast?
A: One packet reaches many subscribers, with no per-receiver connection state or retransmission delays. Loss is handled by sequence numbers, A/B redundant feeds and retransmission servers.

Q: 10 GbE at the FPGA fabric: typical data path?
A: **64 bits at 156.25 MHz** = 10 Gb/s. On the wire: 64b/66b encoding at 10.3125 Gbaud.

Q: MoldUDP64 header?
A: Session (10 bytes) | Sequence number (8) | Message count (2) = **20 bytes**. Count 0 = heartbeat; 0xFFFF = end of session. Each message is prefixed with a 2-byte length.

Q: Key Nasdaq ITCH 5.0 order messages?
A: **A** Add, **F** Add with MPID, **E** Executed, **C** Executed with price, **X** Cancel (partial), **D** Delete, **U** Replace. Also S system event, R stock directory, P trade.

Q: Byte order on the network?
A: **Big-endian** (network order): most significant byte first. x86 hosts are little-endian.

Q: Sequence gap detected on a feed. Options?
A: Request retransmission (slow), take the packet from the redundant **B feed** (line arbitration), or mark the book stale until a snapshot recovers it. Never trade on a book you know is wrong.

Q: Cut-through vs store-and-forward?
A: **Store-and-forward**: receive the whole frame (check FCS) before acting. **Cut-through**: start processing as bytes arrive. Low-latency designs act before the frame ends.

Q: Kernel bypass (software side)?
A: The NIC delivers packets directly to user space (e.g. Onload, DPDK), avoiding system calls and kernel network-stack overhead. Typical software tick-to-trade is microseconds; FPGAs reach tens to hundreds of ns.

Q: Order book data structure basics?
A: Per side, price levels with aggregate size; orders keyed by reference number for modify/cancel. Best bid = highest bid level, best ask = lowest ask level.

@deck cpp | Low-latency C++ & systems | cs
Q: Cache line size on x86, and why it matters?
A: **64 bytes**. Data touched together should share lines; data written by different threads should not (false sharing).

Q: What is false sharing?
A: Two threads write different variables on the same cache line, so the line ping-pongs between cores. Fix: pad or `alignas(64)`.

Q: Why avoid heap allocation on the hot path?
A: `malloc`/`new` can lock, page fault or take unpredictable time. Preallocate pools or ring buffers at startup.

Q: SPSC lock-free queue, the core idea?
A: Ring buffer with a head index written only by the producer and a tail written only by the consumer, using acquire/release atomics. No locks, no CAS needed.

Q: Branch misprediction cost and mitigation?
A: Roughly 15–20 cycles on modern x86. Make the hot path predictable, use branchless arithmetic where it's simpler, and `[[likely]]`/`[[unlikely]]` hints.

Q: `memory_order_acquire` / `release` in one line?
A: A release store makes earlier writes visible to a thread that does an acquire load of the same atomic and sees that value.

Q: Why pin threads to cores?
A: Avoids migration and cold caches, and with isolated cores (isolcpus) avoids scheduler interruptions ⇒ lower, steadier latency.

@deck timing | Timing & CDC | timing
Q: What does `set_clock_groups -asynchronous` tell the timing tool?
A: Don't time paths between these clocks. It's correct only if every crossing between them goes through a proper synchroniser, FIFO or handshake. Otherwise it hides real failures.

Q: Two clocks from the same MMCM at 100 and 200 MHz. Do crossings need synchronisers?
A: No: they're **related (synchronous) clocks**, and the tool times the paths between them using their known phase relationship. Synchronisers are for unrelated/asynchronous clocks.

Q: Requirements for a two-flop synchroniser to work well?
A: Source signal launched from a **flop** (no combinational glitches), destination flops placed close together (`ASYNC_REG` attribute in Xilinx), and the signal held long enough for the destination clock to sample it.

Q: What is MTBF for a synchroniser, roughly?
A: MTBF = e^(t_r/τ) / (T₀ · f_clk · f_data). t_r is the resolution time (about one clock period per extra stage). Exponential in t_r, so a third flop multiplies MTBF enormously.

Q: Req/ack handshake for multi-bit data across clocks: the steps?
A: Source puts data on a bus and holds it, toggles/raises `req`. Destination synchronises `req`, captures the (now stable) data, raises `ack`. Source synchronises `ack`, drops `req`. Slow but safe for infrequent data.

Q: Why must a signal crossing domains come straight from a flop?
A: Combinational logic can glitch. The destination clock may sample a glitch that the source domain would never see. Register in the source domain first.

Q: Reconvergence problem in CDC?
A: Two separately synchronised signals derived from related source state can arrive one cycle apart in the destination, so their combination briefly shows an impossible state. Synchronise one encoded value (Gray/one-hot) or use a FIFO/handshake.

Q: Fast clock 200 MHz, slow 50 MHz. Minimum pulse width in the fast domain to be reliably caught by a 2-flop synchroniser in the slow domain?
A: It must be held longer than one slow period plus margin: rule of thumb **≥ 1.5 slow-clock periods** (here > 30 ns ≈ 6 fast cycles). Or use a toggle synchroniser instead.

Q: What is clock domain crossing *metastability* not fixing?
A: Synchronisers fix metastability, not **data coherence**. Multi-bit coherence needs Gray coding, handshake or FIFO.

Q: Async FIFO: why can full/empty be conservative but never wrong?
A: Each side sees the *other* side's pointer a few cycles late. That only makes the FIFO look fuller (writer side) or emptier (reader side) than it is, which is safe.

Q: What is a "setup slack" of −0.2 ns at 250 MHz telling you?
A: The worst path needs 4.2 ns but you have 4.0 ns. Options: cut ~0.2 ns of logic/routing on that path, pipeline it, or run at about 1/4.2 ns ≈ 238 MHz.

Q: Input/output delay constraints: what do they model?
A: `set_input_delay`/`set_output_delay` describe the external device's timing so the tool can check the I/O paths. Without them, I/O paths are unconstrained (common with out-of-context builds).

Q: What does placement "noise" in timing results mean?
A: Small RTL or seed changes move placement, which shifts WNS by a few hundred ps. A result inside that noise band (e.g. +0.02 ns) isn't a robust pass.

@deck vlog | Verilog fundamentals | verilog
Q: `always_ff`, `always_comb`, `always_latch` (SystemVerilog): why use them?
A: They state **intent**: tools warn if an `always_comb` infers a latch or an `always_ff` doesn't produce flops, and they enforce a single driver. `always_comb` also evaluates once at time 0.

Q: What does `` `default_nettype none `` protect against?
A: Typos in port connections silently create **implicit 1-bit wires**. With `none`, an undeclared name is an error.

Q: `logic` vs `wire` in SystemVerilog?
A: `logic` is a 4-state variable usable in `always` and in `assign` (single driver). Use `wire` when a net has **multiple drivers** (e.g. tri-state/inout).

Q: Packed vs unpacked arrays?
A: Packed `logic [7:0][3:0] x;` is one contiguous bit vector (arithmetic works on it). Unpacked `logic [7:0] mem [0:255];` is an array of elements, typically a memory.

Q: What's the difference between `parameter` and `localparam`?
A: A `parameter` can be overridden at instantiation (`#(.W(16))`). A `localparam` is a derived constant and can't be overridden.

Q: `for` loop inside an `always_comb`: what hardware?
A: The loop is **unrolled** into parallel logic at synthesis. A loop over N bits creates N copies, not a sequential process.

Q: What is `$clog2(N)` for, and is it synthesisable?
A: Ceiling of log₂(N): address width for a depth-N memory. Yes, it's evaluated at elaboration time.

Q: Why use `unique case` / `priority case`?
A: `unique`: cases are mutually exclusive (allows a parallel mux, warns on overlap or no match). `priority`: first match wins, warns on no match. Both express intent to synthesis and simulation.

Q: Interface/struct use in SystemVerilog RTL?
A: `struct packed` groups fields into one vector (e.g. an order record). `interface` bundles a protocol's signals (e.g. AXI-Stream) with modports, cutting port-list errors.

Q: Testbench delays like `#10`: synthesisable?
A: **No.** Delays are ignored by synthesis. Use them only in testbenches.

Q: Arithmetic vs logical right shift in Verilog?
A: `>>` fills with zeros. `>>>` fills with the sign bit **only if the operand is signed**; on an unsigned value it behaves like `>>`.

Q: What does `x[7 -: 4]` mean?
A: Indexed part-select: 4 bits counting down from 7 = `x[7:4]`. `x[i +: 8]` = 8 bits starting at i upward. The width must be constant; the base can be variable.

Q: How do you write a parameterised register file read in one line?
A: `assign rdata = regs[raddr];` with `logic [W-1:0] regs [0:DEPTH-1];`. A variable index on an unpacked array is a mux (or RAM read).

@deck arch | FPGA architecture | arch
Q: How is a 4:1 mux built in a 7-series FPGA?
A: In **one LUT6**: 4 data inputs + 2 select inputs = 6 inputs. An 8:1 mux uses two LUT6s plus the slice's **F7 mux**; a 16:1 uses four LUT6s plus F7 and F8 muxes (one slice).

Q: What does a LUT actually store?
A: A truth table: a LUT6 is a 64×1 memory addressed by its 6 inputs. Any function of up to 6 inputs costs the same delay.

Q: Why does a wide comparator or adder use CARRY4?
A: The dedicated carry chain propagates carries much faster than LUT-to-LUT routing. A 32-bit add uses 8 CARRY4s in a column.

Q: Why register BRAM outputs (DOA_REG)?
A: The internal output register removes the slow clock-to-out of the RAM array from the next path, at the cost of one extra cycle of latency.

Q: Why does a large LUTRAM hurt timing?
A: Each LUTRAM stores 64 bits; a 1024-deep memory needs many and a big **read mux tree** plus high fanout on the address. Block RAM avoids both.

Q: What does `ram_style = "block"` do and when might it be ignored?
A: Asks synthesis to map an array to BRAM. It can be ignored if the coding style doesn't match a BRAM template (e.g. an asynchronous read or too many write ports).

Q: Global clock buffer (BUFG): why use it?
A: It drives the low-skew global clock network. Clocks routed on general fabric get large skew and poor timing.

Q: What does Vivado's "logic levels" in a timing report count?
A: The number of LUT/carry cells on the path between the launching and capturing registers. Each level adds cell delay plus routing.

Q: What's in the FPGA bitstream besides the logic config?
A: LUT contents, routing switch settings, BRAM initial contents, flip-flop initial values and I/O standards.

@deck mm | Market making & trading | mm
Q: Fair value of the sum of 3 dice after one die shows 5?
A: 5 + 2 × 3.5 = **12**. Unrevealed parts contribute their expectation.

Q: How should your spread change as more information is revealed?
A: **Tighten it**: less uncertainty remains about the settlement, so less risk per trade.

Q: A counterparty trades 10 lots with you instantly after news. What do you assume?
A: They're likely informed. Update fair value in their direction and widen until you understand the move.

Q: What is "edge" on a trade?
A: The difference between your trade price and fair value, in your favour: buying 1 below fair value = +1 edge per unit.

Q: Why do traders care about expected value *and* variance?
A: EV says whether a trade is good on average; variance says how much risk (and capital) it takes. Sizing depends on both.

Q: A call option's price as volatility rises?
A: **Increases**. More volatility means more chance to finish deep in the money, while the downside is capped at the premium. Same for puts.

Q: What's theta?
A: Time decay: change in option value as time passes, all else equal. Long options usually have negative theta.

Q: What is a straddle?
A: Long a call and a put at the same strike and expiry: profits from a large move in either direction (long volatility).

Q: Arbitrage, in one line?
A: A riskless profit with no net investment, e.g. buying and selling the same thing at different prices at the same time.

Q: Why might you quote a narrower market than your uncertainty suggests?
A: Competition: if others quote tighter, you never trade. The spread balances fill rate against adverse selection.

@deck prob | Probability & EV | prob
Q: Expected number of distinct faces in 6 rolls of a die?
A: Indicator per face: 6 × (1 − (5/6)⁶) ≈ **3.99**.

Q: P(exactly 2 heads in 4 flips)?
A: C(4,2)/2⁴ = **6/16 = 3/8**.

Q: Expected flips until 3 heads in a row?
A: 2^(k+1) − 2 = **14**.

Q: Two dice, at least one is a 6. P(both are 6)?
A: 11 outcomes contain a 6; only one is (6,6): **1/11**.

Q: Uniform X, Y on (0,1). P(X + Y < 1)?
A: Triangle under the line: **1/2**. P(X + Y < a) = a²/2 for a ≤ 1.

Q: Var of the sum of n independent fair dice?
A: n × 35/12 (variances add for independent variables).

Q: Key technique for any optimal-stopping question (e.g. the reroll game)?
A: **Backward induction**: compute the value at the last decision first, then work back: at each step compare "stop now" to the expected value of continuing.

Q: Conditional expectation trick: E[X] = ?
A: Law of total expectation: E[X] = Σ E[X | case] · P(case). Split on the first step (first flip, first roll) and solve the recursion.

Q: How many ways to arrange the letters of BANANA?
A: 6!/(3!·2!) = **60**.

Q: Probability a random 5-card hand is a flush (including straight flushes)?
A: 4·C(13,5)/C(52,5) = 5148/2,598,960 ≈ **0.198%**.

@deck logic | Boolean & digital logic | logic
Q: De Morgan's laws?
A: ~(A & B) = ~A | ~B, and ~(A | B) = ~A & ~B.

Q: Simplify A + A·B.
A: **A** (absorption). Also A·(A + B) = A.

Q: Simplify A + ~A·B.
A: **A + B**.

Q: XOR identities worth knowing?
A: A ⊕ 0 = A, A ⊕ 1 = ~A, A ⊕ A = 0, associative and commutative. A ⊕ B ⊕ B = A (used in swaps and parity).

Q: Full adder equations?
A: Sum = A ⊕ B ⊕ Cin. Cout = A·B + Cin·(A ⊕ B) = majority(A, B, Cin).

Q: Why are NAND and NOR called universal?
A: Any Boolean function can be built from NAND alone (or NOR alone): NOT = NAND(A,A), AND = NOT(NAND), OR via De Morgan.

Q: How many distinct Boolean functions of n inputs?
A: 2^(2ⁿ). Two inputs: 16; three inputs: 256.

Q: 2:1 mux as a Boolean expression?
A: Y = ~S·A + S·B.

Q: Karnaugh map: what's it for?
A: Visually grouping adjacent 1s (Gray-ordered) to find a minimal sum-of-products. On FPGAs, LUTs make manual minimisation rarely necessary, but OAs still test it.

Q: What does a carry-lookahead adder improve?
A: Computes carries in parallel from generate (A·B) and propagate (A ⊕ B) signals instead of rippling: O(log n) depth instead of O(n).

Q: Detect overflow when adding two signed numbers?
A: Overflow if both operands have the same sign and the result's sign differs. Equivalently, carry into the MSB ≠ carry out of the MSB.

Q: Test if an unsigned x is a power of two?
A: `x != 0 && (x & (x - 1)) == 0`.

Q: What does `x & -x` give?
A: The lowest set bit of x (two's complement): 0b10100 → 0b00100.

@deck cpp | Low-latency C++ & systems | cs
Q: sizeof of char, short, int, long, pointer on x86-64 Linux?
A: 1, 2, 4, **8**, 8 (LP64 model). On 64-bit Windows `long` is 4.

Q: `struct { char a; int b; char c; }` size on x86-64?
A: **12**: a at 0, 3 padding, b at 4, c at 8, then pad to a multiple of 4. Reordering to int, char, char gives 8.

Q: Signed integer overflow in C/C++?
A: **Undefined behaviour**. Unsigned overflow wraps modulo 2ⁿ.

Q: What does `volatile` do (and not do)?
A: Forces every access to actually read/write memory (for MMIO registers). It does **not** make operations atomic or provide thread synchronisation.

Q: Little-endian: 0x12345678 stored at address A. Byte at A?
A: **0x78** (least significant byte at the lowest address).

Q: Stack vs heap?
A: Stack: automatic locals, fast LIFO allocation, limited size. Heap: dynamic (`new`/`malloc`), flexible lifetime, slower and can fragment.

Q: Virtual function call cost?
A: An indirect call through the vtable pointer: an extra load and a harder-to-predict branch, and it blocks inlining.

Q: `std::vector::push_back` complexity?
A: **Amortised O(1)**: capacity grows geometrically, so occasional O(n) reallocations average out. `reserve()` avoids them on the hot path.

Q: Approximate memory latencies?
A: L1 ~1 ns, L2 ~4 ns, L3 ~10–20 ns, DRAM ~80–100 ns, NVMe SSD ~10–100 µs.

Q: Why does `std::map` lose to a flat array for small lookups?
A: Pointer-chasing tree nodes scattered in memory: cache misses dominate. Contiguous data is prefetch-friendly.

Q: What is a memory barrier/fence?
A: An instruction that prevents certain reorderings of loads/stores across it, so other threads observe writes in the intended order.

Q: Process vs thread?
A: Processes have separate address spaces; threads share their process's memory (and need synchronisation).

Q: Big-O of binary search, hash lookup, sorting?
A: O(log n); O(1) average (O(n) worst); O(n log n) for comparison sorts.

<script type="text/plain" id="primers">
@p linearity | Linearity of expectation
E[X + Y] = E[X] + E[Y], always, even when X and Y are dependent. That makes it the most useful tool in interview probability.

**Method: indicators.** To find the expected *count* of something, write it as a sum of indicator variables (1 if an event happens, 0 if not). The expectation of each indicator is just its probability.

- Expected distinct faces in k rolls of an n-sided die: each face appears with probability 1 − ((n−1)/n)^k, so the answer is n·(1 − ((n−1)/n)^k).
- Expected fixed points of a random permutation: each item is fixed with probability 1/n, n items, total **1**.
- Expected total of k dice: k × (n+1)/2.

**Common mistake:** trying to compute the full distribution first. You almost never need it.

**Interview extension:** "Now what's the variance?" Variance does *not* add for dependent variables. You need covariances.

@p geometric | Waiting times (geometric distribution)
If each trial succeeds independently with probability p, the expected number of trials up to and including the first success is **1/p**.

**Derive it fast (first-step analysis):** E = 1 + (1 − p)·E. You always spend one trial; with probability (1 − p) you're back where you started. Solve: E = 1/p.

- First 6 on a die: 1/(1/6) = 6.
- First value ≥ t on an n-sided die: p = (n − t + 1)/n, so E = n/(n − t + 1).

**Common mistake:** writing E = 1 + p·E (using the success probability in the recursion). The recursion uses the probability of *failing*, because that's when you continue.

**Patterns:** for "k heads in a row" use states (0, 1, …, k−1 heads so far). The answer is 2^(k+1) − 2: HH = 6, HHH = 14.

@p coupon | Coupon collector
Expected draws to see all n equally likely types = n·(1 + 1/2 + … + 1/n) = n·Hₙ.

**Why:** split the wait into stages. When you already have i types, a new one appears with probability (n − i)/n, so that stage takes n/(n − i) draws on average (geometric). Sum over i = 0 … n−1.

- n = 6 (die faces): 6 × 2.45 = **14.7**.
- n = 4: 4 × (25/12) = 25/3 ≈ 8.33.

**Memorise:** H₄ = 25/12, H₅ = 137/60, H₆ = 49/20. Hₙ ≈ ln n + 0.577 for large n.

**Extension:** "Expected draws to see k of the n types?" Sum only the first k stages.

@p bayes | Bayes' rule and conditional probability
P(A | B) = P(B | A)·P(A) / P(B). In interviews, **natural frequencies** are faster and safer than the formula.

**Method:** imagine 10,000 people.
- Prevalence 1% → 100 have it, 9,900 don't.
- Sensitivity 90% → 90 true positives.
- False-positive rate 9% → 891 false positives.
- P(has it | positive) = 90 / (90 + 891) ≈ 9.2%.

**Intuition:** when the condition is rare, false positives from the huge healthy group swamp the true positives.

**Conditional dice questions:** list (or count) only the outcomes where the condition holds, then count the favourable ones inside that set. "At least one 6": 11 outcomes, only (6,6) is a double six, so 1/11.

**Common mistake:** confusing P(positive | disease) with P(disease | positive).

@p combinatorics | Counting
- Ordered arrangements of n distinct items: n!
- Choose k from n (order doesn't matter): C(n,k) = n! / (k!(n−k)!)
- Arrangements with repeated letters: n! / (a!·b!·…) for each repeated letter. BANANA = 6!/(3!·2!) = 60.
- Without replacement: multiply the shrinking probabilities. Two aces: (4/52)(3/51) = 1/221.
- All k drawn are red (r red, b blue): C(r,k)/C(r+b,k).

**Speed tips:** cancel before multiplying. C(n,2) = n(n−1)/2. Know C(52,5) = 2,598,960.

**Common mistake:** double counting when order doesn't matter. Ask yourself "is (A,B) different from (B,A) here?"

@p stopping | Optimal stopping and backward induction
Games where you choose when to stop (reroll a die, draw again) are solved **backwards**.

1. Find the value of the *last* decision point (e.g. a final reroll is worth the plain average, 3.5).
2. At the previous step, keep any outcome **better than the continuation value**; otherwise continue.
3. Repeat backwards.

**One reroll on a d6:** reroll is worth 3.5, so keep 4–6 (avg 5) and reroll 1–3: ½·5 + ½·3.5 = 4.25.
**Two rerolls:** now continuing is worth 4.25, so keep only 5–6: (5+6)/6 + (4/6)·4.25 = 14/3 ≈ 4.67.

**Interview extension:** "What would you pay to play?" Your fair value is the game value; you'd pay less to make a profit.

@p orderstats | Max, min and uniform variables
**Max of two dice:** P(max ≤ k) = (k/6)², so P(max = k) = (k² − (k−1)²)/36 = (2k−1)/36. E = 161/36 ≈ 4.47.

**Max of n Uniform(0,1):** P(max ≤ x) = xⁿ, so E[max] = n/(n+1), E[min] = 1/(n+1). The n points split [0,1] into n+1 gaps of equal expected length.

**Sum of two uniforms:** P(X + Y < t) is an area under a line in the unit square: t²/2 for t ≤ 1, and 1 − (2 − t)²/2 for 1 ≤ t ≤ 2.

**Trick:** for "max ≤ x", use independence: multiply the individual probabilities.

@p martingale | Fair games and gambler's ruin
In a fair game (expected change 0 each step), your expected wealth stays constant: it's a **martingale**.

Gambler's ruin with ±1 fair steps, starting at k, stopping at 0 or N: E[final] = k, and final is either 0 or N, so P(reach N)·N = k, giving **P = k/N**.

**Unfair coin (win prob p ≠ ½):** P(reach N) = (1 − rᵏ)/(1 − r^N) with r = q/p.

**Expected duration (fair):** k(N − k) steps.

**Interview use:** whenever a process is "fair", look for a conserved expectation instead of summing a series.

@p variance | Variance
Var(X) = E[X²] − E[X]². For independent X, Y: Var(X + Y) = Var(X) + Var(Y). Var(aX) = a²·Var(X).

- Fair die: E[X²] = 91/6, so Var = 91/6 − 49/4 = **35/12**.
- Sum of k dice: k·35/12. Standard deviation grows like √k, not k.
- Bernoulli(p): p(1 − p). Binomial(n,p): np(1 − p).

**Trading link:** variance is risk. Two strategies with the same EV can need very different capital.

**Common mistake:** adding standard deviations instead of variances.

@p binomial | Binomial and "at least one"
P(exactly k successes in n trials) = C(n,k)·pᵏ(1−p)^(n−k). For a fair coin: C(n,k)/2ⁿ.

**"At least one" → use the complement:** P(at least one 6 in k rolls) = 1 − (5/6)ᵏ.
- k = 4: 1 − 625/1296 ≈ 51.8%.

**Mean and variance:** np and np(1−p).

**Quick checks:** C(4,2)/16 = 3/8. C(5,2)/32 = 10/32. Probabilities over all k sum to 1.

@p conditional | Conditioning on events
To find P(A | B) with a small finite sample space (two dice = 36 outcomes):
1. List or count the outcomes in B.
2. Count those that are also in A.
3. Divide.

**Symmetry shortcuts:** P(first > second) = 15/36 (the 21 non-doubles split evenly; plus 6 doubles). Doubles: 6/36.

**Classic traps:** "at least one is a boy" (1/3) vs "the older one is a boy" (1/2). The information you condition on changes the sample space.

@p mental | Mental arithmetic techniques
- **Near a round number:** 98 × 97 = (100 − 2)(100 − 3) = 10000 − 500 + 6 = 9506.
- **Difference of squares:** 47 × 53 = 50² − 3² = 2491.
- **Squares:** (a + b)² = a² + 2ab + b²: 63² = 3600 + 360 + 9 = 3969. Ending in 5: 65² → 6·7 = 42, append 25 = 4225.
- **×25:** ×100 ÷ 4. **×5:** ×10 ÷ 2. **×9:** ×10 − x. **×11:** digit-sum in the middle.
- **Percentages:** x% of y = y% of x. 12.5% = 1/8, 37.5% = 3/8, 62.5% = 5/8.
- **Decimals:** remove the decimal points, multiply integers, then put back the total number of decimal places: 0.3 × 0.7 = 21 → 0.21.
- **Division by a decimal:** scale both: 7.2 ÷ 0.6 = 72 ÷ 6 = 12.
- **Fractions of a number:** divide first, then multiply: 5/8 of 48 = 6 × 5 = 30.

@p oa80 | 80-in-8 strategy
Commonly reported format: 80 arithmetic questions in 8 minutes (6 s each), +1 right, −1 wrong, skipping scores 0. Optiver doesn't publish it, so treat details as approximate.

- **Accuracy beats speed.** With −1 marking, a guess on a hard question has negative expected value unless you're more than 50% sure.
- **Skip fast.** If a question needs more than ~10 s, skip it and bank the easy ones.
- **Questions get harder.** Early ones are quick integer sums; later ones involve decimals and fractions. Don't waste time early.
- **Practise in format:** daily timed runs, tracking score and error count separately. Push speed only while errors stay low.

@p sequences | Number sequences
Work through this checklist in order:
1. **Differences.** Constant → arithmetic. If the differences themselves have constant differences → quadratic. Differences doubling → geometric component.
2. **Ratios.** Constant ratio → geometric (×2, ×3, ×−2).
3. **Two interleaved sequences.** Look at odd and even positions separately.
4. **Recursive.** Each term from the previous one or two: sum of previous two (Fibonacci-like), or a·x + b (e.g. ×2 + 1).
5. **Alternating operations:** +p, ×q, +p, ×q…
6. **Known families:** squares, cubes, primes, triangular numbers n(n+1)/2, factorials, each possibly ± a constant.

**Speed tip:** write the differences under the sequence immediately. Most questions fall to step 1 or 3.

@p fairvalue | Fair value and making markets
**Fair value** = expected value of the settlement given what you know. Unrevealed parts count at their expectation.

- Sum of k dice with some revealed: revealed sum + (unrevealed count) × 3.5.
- Sum of k cards from one deck (A=1 … K=13, total 364): each unseen card's expected value is (364 − revealed sum)/(52 − revealed count).

**Quoting:** centre your bid and ask on fair value. Make the spread wider when:
- uncertainty is high (early, few cards seen),
- you suspect the counterparty is informed (adverse selection),
- your inventory is already large (and **skew**: lower both quotes when long, raise them when short).

**After a trade:** if someone lifts your offer, they think it's worth more. Nudge fair value up.

@p pnl | Position and P&L
Track two things: **position** (units held, + long / − short) and **cash** (money in − money out).

- Buy q at p: position += q, cash −= q·p.
- Sell q at p: position −= q, cash += q·p.
- **P&L = cash + position × mark price** (or × settlement value).

**Example:** sell 10 @ 102 (cash +1020), buy 9 @ 109 (cash −981). Cash +39, position −1. Mark 110 → P&L = 39 − 110 = −71.

**Edge** on a single trade = how much better than fair value you traded: selling at a above fair f earns (a − f) per unit.

@p options | Options basics
- **Call:** right to buy at strike K. Payoff max(S − K, 0). **Put:** right to sell at K. Payoff max(K − S, 0).
- **Put–call parity (European, no dividends):** C − P = S − K·e^(−rT). With r = 0: **C − P = S − K**.
- **Volatility up → both calls and puts more valuable** (more upside, capped downside).
- **Delta:** sensitivity to the underlying. ATM call ≈ 0.5, deep ITM ≈ 1.
- **Theta:** time decay. Long options lose value as time passes.
- **Straddle:** long call + long put, same strike: a bet on a big move either way.

**Interview use:** parity questions are pure arbitrage logic. If C − P ≠ S − K, buy the cheap side, sell the expensive side.

@p hexbin | Hex, binary and bit counting
- One hex digit = 4 bits. 0xA = 1010, 0xF = 1111. Convert nibble by nibble.
- Hex → decimal: 0x9D2 = 9·256 + 13·16 + 2 = 2514.
- Decimal → hex: divide by 16 repeatedly, reading remainders bottom-up, or subtract the largest multiples of 256 then 16.
- Popcount: count per nibble (0..4 each). Learn 0–F: 0,1,1,2,1,2,2,3,1,2,2,3,2,3,3,4.
- Unsigned n-bit max: 2ⁿ − 1. `$clog2(N)` = smallest k with 2ᵏ ≥ N.
- Bitwise ops: do them per nibble with the 4-bit patterns.

@p twos | Two's complement
An n-bit value's MSB has weight **−2^(n−1)**; all other bits are positive.
- Range: −2^(n−1) … 2^(n−1) − 1. For 8 bits: −128 … 127.
- **Negate:** invert all bits and add 1. Or: −v is stored as 2ⁿ − v. −15 in 8 bits = 256 − 15 = 241 = 0xF1.
- **Read a pattern as signed:** if the MSB is 1, subtract 2ⁿ. 0xE9 = 233 → 233 − 256 = −23.
- **Sign extension:** replicate the MSB: `{{24{x[7]}}, x}`.
- **Arithmetic shift right (`>>>` on signed):** fills with the sign bit, equivalent to floor division by 2ᵏ.
- **Overflow (signed add):** operands share a sign but the result's sign differs.

@p gray | Gray code
Successive Gray codes differ in **exactly one bit**, which is why async FIFO pointers are Gray-coded: a value sampled mid-change is either the old or the new pointer, never garbage.

- **Binary → Gray:** g = b ^ (b >> 1). 1001 → 1001 ^ 0100 = 1101.
- **Gray → binary:** MSB copies; each next binary bit = previous binary bit XOR the Gray bit. 1110 → 1, 1^1 = 0, 0^1 = 1, 1^0 = 1 → 1011.

**Only works for single increments.** A Gray counter jumping by more than 1 loses the property.

@p clocks | Clocks, periods and latency
- Period (ns) = 1000 / f (MHz). 250 MHz → 4 ns. 156.25 MHz → 6.4 ns. 200 MHz → 5 ns.
- Latency of k cycles = k × period. 8 cycles at 156.25 MHz = 51.2 ns.
- Throughput of a W-bit bus at f MHz = W × f Mb/s. 64 × 156.25 = 10,000 Mb/s = 10 Gb/s.
- A free-running N-bit counter wraps every 2^N / f µs (f in MHz).

**Speed tip:** memorise periods for 100, 125, 156.25, 200, 250, 322.27 (10G with 32-bit) and 400 MHz.

@p widths | Verilog expression widths and values
- **Assignment truncates:** a sum assigned to an n-bit variable keeps the low n bits: (a + b) mod 2ⁿ.
- **Concatenation** `{a, b}`: widths add; the first item is the most significant.
- **Replication** `{k{x}}`: x repeated k times. Inside a concatenation it needs its own braces: `{{24{x[7]}}, x}`.
- **Part-select** `x[h:l]`: bits h down to l, value = (x >> l) mod 2^(h−l+1).
- **Reduction** `&x`, `|x`, `^x`: one bit. `^x` is parity (1 if an odd number of ones). `~&`, `~|`, `~^` invert the result.
- **Signedness:** if any operand is unsigned, the whole expression is unsigned. `>>>` only sign-fills when the operand is signed.

@p blocking | Blocking vs nonblocking
- `<=` (nonblocking): every right-hand side in the block is sampled first, then all updates happen together at the end of the time step. Models flip-flops.
- `=` (blocking): executes in order, each line sees the previous line's new value. Models combinational logic.

**Shift register:** `a <= d; b <= a; c <= b;` gives a 3-stage pipeline (c gets the old b).
With blocking `a = d; b = a; c = b;` every stage gets d at once: the chain collapses.
Blocking written last-stage-first (`c = b; b = a; a = d;`) happens to work, but it's fragile style.

**Swap:** `a <= b; b <= a;` swaps. Blocking sets both to the old b.

**Rule:** `<=` in clocked blocks, `=` in combinational blocks, and never mix them on one variable.

@p boolean | Boolean algebra
- **De Morgan:** ~(A & B) = ~A | ~B; ~(A | B) = ~A & ~B.
- **Absorption:** A + A·B = A; A·(A + B) = A. **A + ~A·B = A + B.**
- **XOR:** A ⊕ 0 = A, A ⊕ 1 = ~A, A ⊕ A = 0. XOR = "odd number of ones".
- **Counting true rows:** for 3 inputs there are 8 rows. Split on one variable (e.g. A = 0 / A = 1) and count each half.
- **Universal gates:** NAND alone (or NOR alone) can build anything.
- 2:1 mux: Y = ~S·A + S·B.

**Speed tip in OAs:** evaluate innermost brackets first and write intermediate bits down.

@p adders | Adders and overflow
- Full adder: Sum = A ⊕ B ⊕ Cin; Cout = majority(A, B, Cin).
- n-bit add result: (A + B + Cin) mod 2ⁿ, carry-out = 1 if the true sum ≥ 2ⁿ (unsigned overflow).
- **Signed overflow:** both operands same sign, result sign differs. Equivalently carry into MSB ≠ carry out of MSB.
- Carry-lookahead: generate g = A·B, propagate p = A ⊕ B; carries computed in parallel, log-depth.
- On FPGAs, adders use the dedicated **CARRY4** chain, so ripple carry is actually fast.

@p setup | Setup slack and f_max
**Setup check:** data launched at one edge must arrive before the next edge minus setup time.

slack = period + (capture clock skew) − (t_clk→q + t_logic + t_route + t_setup)

- Positive slack: meets timing. Negative: fails by that amount.
- f_max = 1000 / (total path delay in ns) MHz.
- Positive skew (capture clock later) helps setup but hurts hold.

**Fixes for negative setup slack:** pipeline the path, reduce logic levels, replicate high-fanout drivers, use BRAM/DSP output registers, or lower the clock.

**Hold violations** don't depend on the period. Lowering the clock never fixes them.

@p fifo | FIFO depth sizing
The FIFO must hold whatever arrives during a burst that the reader hasn't drained yet.

**Different clocks:** writer writes B words at f_w (one per cycle); reader reads one per cycle at f_r < f_w.
- Burst duration = B / f_w. Reader drains B·f_r/f_w in that time.
- **Depth = B − B·f_r/f_w.** Example: 260 words, 200 → 150 MHz: 260 − 195 = 65.

**Same clock, reader every k cycles:** depth = B − B/k.

**In real designs** add margin for synchroniser latency (a few cycles each way in an async FIFO) and round up to a power of two.

@p cdc | Clock domain crossing
- **1-bit level signal:** two-flop synchroniser in the destination clock (launch from a flop, mark `ASYNC_REG`).
- **Short pulse, fast → slow:** convert to a toggle, synchronise, edge-detect; or req/ack handshake.
- **Multi-bit value:** never synchronise each bit separately. Use Gray code (counters/pointers), a handshake with held data, or an **async FIFO**.
- **Reset:** assert asynchronously, release synchronously.
- **Related clocks** (same MMCM): no synchroniser needed; the tool times them. **Unrelated clocks:** synchronise, and tell the tool (`set_clock_groups -asynchronous` or max-delay constraints).

**Metastability** can't be eliminated, only made vanishingly unlikely: MTBF grows exponentially with resolution time, so each extra flop helps enormously.

@p ethernet | Ethernet, IP and UDP framing
On-wire layout: preamble + SFD 8 | dst MAC 6 | src MAC 6 | EtherType 2 | payload | FCS 4 | inter-packet gap 12.
- IPv4 header 20 bytes (no options), UDP 8. **Total header before UDP payload: 42 bytes.**
- Minimum frame 64 bytes (header to FCS): short payloads get padded.
- **Wire time:** (frame + 8 + 12) bytes × 0.8 ns at 10 Gb/s (× 8 ns at 1 Gb/s).
- MoldUDP64 header starts at byte 42 (session 10, sequence 8, count 2), first message-length field at byte 62.
- **Beats on a W-bit bus:** ⌈bytes × 8 / W⌉.

@p struct | C struct padding
On x86-64 Linux each member is aligned to its own size (char 1, short 2, int 4, long/double/pointer 8). The struct's total size is padded up to a multiple of its largest member's alignment.

**Example:** `short, double, char, char` → short at 0, padding to 8, double at 8–15, chars at 16 and 17, total 18 → padded to **24**.

**Optimisation:** order members from largest to smallest to minimise padding (double, short, char, char = 12 → padded to 16).

**Why HFT cares:** smaller structs fit more per 64-byte cache line.

@p bittricks | Bit tricks
- `x & (x − 1)`: clears the lowest set bit. Zero iff x is a power of two (or 0).
- `x & −x`: isolates the lowest set bit.
- `x | (x − 1)`: sets all bits below the lowest set bit.
- Popcount loop: `while (x) { x &= x − 1; count++; }`
- Swap without temp: `a ^= b; b ^= a; a ^= b;` (cute, rarely useful).
- Signed → unsigned conversion: value mod 2ⁿ (−51 as uint8 = 205).

@p endian | Endianness
- **Little-endian (x86, most ARM configs):** least significant byte at the lowest address. 0x12345678 → bytes 78 56 34 12.
- **Big-endian / network order:** most significant byte first. Network protocols (Ethernet, IP, ITCH) are big-endian.
- Byte k of a little-endian uint32 v = (v >> 8k) & 0xFF.
- Convert with `ntohl`/`htonl` or `__builtin_bswap32`.

**FPGA note:** on an AXI-Stream bus byte 0 is often in `tdata[7:0]`, so fields arrive "reversed" relative to the network order you read in the spec.

@p fabric | FPGA fabric essentials (7-series)
- **Slice:** 4 LUT6 + 8 flip-flops + CARRY4 (+ F7/F8 muxes). SLICEM can be LUTRAM or SRL shift registers.
- **LUT6** implements any function of ≤ 6 inputs in one level: a 4:1 mux is one LUT; 8:1 uses two LUTs + F7; 16:1 uses four + F7/F8.
- **BRAM:** 36 Kb (or 2 × 18 Kb), synchronous read (1 cycle, 2 with output register).
- **LUTRAM:** asynchronous read, good for small memories; big ones create deep read muxes.
- **DSP48E1:** 25×18 multiply, pre-adder, 48-bit accumulate.
- **Clocking:** MMCM/PLL generate clocks, BUFG drives the low-skew global network. Use clock enables, never gated clocks.
- **Transceivers:** GTP (Artix-7) ≈ 6.6 Gb/s max; GTX (Kintex-7) up to 12.5 Gb/s for 10GBASE-R.

@p cs | Systems fundamentals
- **Memory hierarchy:** L1 ~1 ns, L2 ~4 ns, L3 ~10–20 ns, DRAM ~100 ns. Cache line = 64 bytes.
- **Complexities:** binary search O(log n) (⌈log₂(n+1)⌉ comparisons worst case), hash lookup O(1) average, comparison sort O(n log n), vector push_back amortised O(1).
- **C/C++ undefined behaviour:** signed overflow, out-of-bounds access, use after free.
- **volatile** is for memory-mapped I/O, not threading. Use atomics for concurrency.
- **False sharing:** different threads writing the same cache line. Pad to 64 bytes.
- **Hot-path rules:** no allocation, no locks, no syscalls; predictable branches; contiguous data.

<script type="text/plain" id="course_v">
@chapter basics | Basics
@lesson wire | Your first module
@body
Verilog doesn't describe steps; it describes **hardware**: wires and gates that all run at the same time.

A design lives inside a `module`. The port list says which signals come in and go out:

```
module top_module(input in, output out);
  assign out = in;
endmodule
```

`assign` creates a **continuous connection**: `out` is permanently wired to `in`. Whenever `in` changes, `out` changes with it. There's no "running" an assign; it's a piece of wire.

Every exercise in this course uses a module called `top_module`. The checker drives your inputs, runs a reference design next to yours, and compares the outputs on every test vector. Mismatches show up in red on the waveform.
@example
module top_module(input in, output out);
  assign out = in;
endmodule
@task
Build a module with one input `in` and one output `out` that behaves like a wire.
@starter
module top_module(input in, output out);
  // connect out to in

endmodule
@solution
module top_module(input in, output out);
  assign out = in;
endmodule
@spec {"type":"comb"}
@hint Use one `assign` statement: `assign out = in;`
@end

@lesson multiports | Several inputs and outputs
@body
Ports are separated by commas. You can group ports of the same direction: `input a, b, c` declares three 1-bit inputs.

The order of `assign` statements doesn't matter: they all exist at the same time, like wires on a board. Two assigns can read the same input (fan-out), but **one output can only have one driver**. Assigning the same wire twice is an error.
@example
module top_module(input a, b, output x, y);
  assign y = b;   // order doesn't matter
  assign x = a;
endmodule
@task
Inputs `a`, `b`, `c`. Outputs `w`, `x`, `y`, `z`. Wire them like this: `a → w`, `b → x`, `b → y`, `c → z`.
@starter
module top_module(input a, b, c, output w, x, y, z);

endmodule
@solution
module top_module(input a, b, c, output w, x, y, z);
  assign w = a;
  assign x = b;
  assign y = b;
  assign z = c;
endmodule
@spec {"type":"comb"}
@hint You need four assign statements. `b` drives two outputs.
@end

@lesson gates | Logic gates
@body
Bitwise operators build gates:

- `~a` NOT
- `a & b` AND, `a | b` OR, `a ^ b` XOR
- `~(a & b)` NAND, `~(a | b)` NOR, `~(a ^ b)` XNOR (also written `a ~^ b`)

There's also a **logical** NOT, `!a`. For a 1-bit signal `~a` and `!a` are the same, but for vectors they differ: `~4'b0101 = 4'b1010` while `!4'b0101 = 0` (the vector is non-zero, i.e. "true"). Use `~` for gates.

Try changing the example: make `y` a NAND and run it again to see the waveform change.
@example
module top_module(input a, b, output y);
  assign y = a & b;
endmodule
@task
Inputs `a`, `b`. Produce all of these outputs: `out_and`, `out_or`, `out_xor`, `out_nand`, `out_nor`, `out_xnor`, and `out_anotb` (a AND NOT b).
@starter
module top_module(
  input a, b,
  output out_and, out_or, out_xor,
  output out_nand, out_nor, out_xnor,
  output out_anotb
);

endmodule
@solution
module top_module(
  input a, b,
  output out_and, out_or, out_xor,
  output out_nand, out_nor, out_xnor,
  output out_anotb
);
  assign out_and   = a & b;
  assign out_or    = a | b;
  assign out_xor   = a ^ b;
  assign out_nand  = ~(a & b);
  assign out_nor   = ~(a | b);
  assign out_xnor  = ~(a ^ b);
  assign out_anotb = a & ~b;
endmodule
@spec {"type":"comb"}
@hint NAND is `~(a & b)`: the brackets matter, because `~a & b` is a different gate.
@end

@lesson wires | Internal wires
@body
Not every signal is a port. Declare internal connections with `wire`:

```
wire t;
assign t = a & b;
assign y = t | c;
```

Internal wires let you name intermediate results, exactly as you'd label nets on a schematic. A `wire` declared without a range is 1 bit.
@example
module top_module(input a, b, c, output y);
  wire t;
  assign t = a & b;
  assign y = t | c;
endmodule
@task
Implement `out = (a & b) | (c & d)` and `out_n = ~out`. Use two internal wires for the two AND gates.
@starter
module top_module(input a, b, c, d, output out, out_n);

endmodule
@solution
module top_module(input a, b, c, d, output out, out_n);
  wire ab, cd;
  assign ab = a & b;
  assign cd = c & d;
  assign out = ab | cd;
  assign out_n = ~out;
endmodule
@spec {"type":"comb"}
@hint Declare `wire ab, cd;` then assign each, then combine them.
@end

@chapter vectors | Vectors
@lesson vec | Vectors and part-selects
@body
A **vector** groups bits: `input [7:0] a` is 8 bits, `a[7]` is the MSB, `a[0]` the LSB. The **left index of the declaration is the MSB**.

- `a[3]` one bit
- `a[7:4]` the upper nibble (a part-select)

A part-select must go in the **same direction** as the declaration: for `[7:0]` write `a[7:4]`, never `a[4:7]`. This is one of the most common beginner mistakes; the simulator will stop you.

Width matters: assigning an 8-bit value to a 4-bit wire silently drops the top bits. Watch the warnings panel for width mismatches.
@example
module top_module(input [7:0] a, output [3:0] hi, lo, output msb);
  assign hi  = a[7:4];
  assign lo  = a[3:0];
  assign msb = a[7];
endmodule
@task
Split a 16-bit input `in` into its upper byte `out_hi` and lower byte `out_lo`.
@starter
module top_module(input [15:0] in, output [7:0] out_hi, output [7:0] out_lo);

endmodule
@solution
module top_module(input [15:0] in, output [7:0] out_hi, output [7:0] out_lo);
  assign out_hi = in[15:8];
  assign out_lo = in[7:0];
endmodule
@spec {"type":"comb"}
@hint `in[15:8]` is the upper byte.
@end

@lesson byteswap | Byte swap (endianness)
@body
Network data (Ethernet, ITCH) is **big-endian**: the most significant byte comes first. x86 CPUs are **little-endian**. Hardware often needs to swap byte order, which costs zero logic: it's just wiring.

Assign each output byte from the matching input byte:

```
assign out[31:24] = in[7:0];
```

You can also build the whole result with a **concatenation**, `{ … }`, where the first item becomes the most significant bits.
@example
module top_module(input [15:0] in, output [15:0] out);
  assign out = {in[7:0], in[15:8]};   // swap two bytes
endmodule
@task
Reverse the byte order of a 32-bit word: byte 0 ↔ byte 3, byte 1 ↔ byte 2.
@starter
module top_module(input [31:0] in, output [31:0] out);

endmodule
@solution
module top_module(input [31:0] in, output [31:0] out);
  assign out = {in[7:0], in[15:8], in[23:16], in[31:24]};
endmodule
@wrong
module top_module(input [31:0] in, output [31:0] out);
  assign out = {in[31:24], in[23:16], in[15:8], in[7:0]};
endmodule
@spec {"type":"comb"}
@hint Byte k is `in[8k+7 : 8k]`. Concatenate them lowest byte first.
@hint `assign out = {in[7:0], in[15:8], in[23:16], in[31:24]};`
@end

@lesson bitwise | Bitwise vs logical operators
@body
- **Bitwise** `|`, `&`, `^`, `~` work bit by bit and keep the width: `3'b101 | 3'b010 = 3'b111`.
- **Logical** `||`, `&&`, `!` treat a whole vector as true (non-zero) or false, and give **1 bit**: `3'b100 || 3'b000 = 1`.

Mixing them up is a classic bug: `a | b` assigned to a 1-bit output keeps only bit 0.
@example
module top_module(input [2:0] a, b, output [2:0] bw, output lg);
  assign bw = a | b;    // 3 bits
  assign lg = a || b;   // 1 bit
endmodule
@task
Inputs `a[2:0]`, `b[2:0]`. Output the bitwise OR as `out_or_bitwise[2:0]`, the logical OR as `out_or_logical`, and `out_not[5:0]` with the inverse of `b` in the upper half and the inverse of `a` in the lower half.
@starter
module top_module(
  input [2:0] a, b,
  output [2:0] out_or_bitwise,
  output out_or_logical,
  output [5:0] out_not
);

endmodule
@solution
module top_module(
  input [2:0] a, b,
  output [2:0] out_or_bitwise,
  output out_or_logical,
  output [5:0] out_not
);
  assign out_or_bitwise = a | b;
  assign out_or_logical = a || b;
  assign out_not = {~b, ~a};
endmodule
@wrong
module top_module(
  input [2:0] a, b,
  output [2:0] out_or_bitwise,
  output out_or_logical,
  output [5:0] out_not
);
  assign out_or_bitwise = a | b;
  assign out_or_logical = a | b;
  assign out_not = {~a, ~b};
endmodule
@spec {"type":"comb"}
@hint `{~b, ~a}`: the first item in a concatenation is the upper bits.
@end

@lesson reduce | Reduction operators
@body
A unary `&`, `|` or `^` in front of a vector combines **all its bits** into one:

- `&v` 1 only if every bit is 1
- `|v` 1 if any bit is 1
- `^v` XOR of all bits = **parity** (1 if an odd number of ones)

Parity is used for error detection: append `^data` to a word and the receiver can spot any single flipped bit. They also scale: `^data` works for any width without changing the code.
@example
module top_module(input [7:0] d, output all1, any1, odd);
  assign all1 = &d;
  assign any1 = |d;
  assign odd  = ^d;
endmodule
@task
For a 4-bit input `in`, output `out_and` (AND of all bits), `out_or` (OR of all bits) and `out_xor` (XOR of all bits), using reduction operators.
@starter
module top_module(input [3:0] in, output out_and, out_or, out_xor);

endmodule
@solution
module top_module(input [3:0] in, output out_and, out_or, out_xor);
  assign out_and = &in;
  assign out_or  = |in;
  assign out_xor = ^in;
endmodule
@spec {"type":"comb"}
@hint `assign out_and = &in;`
@end

@lesson concat | Concatenation
@body
`{a, b, c}` joins vectors; the **first** item becomes the most significant bits, and widths add up. Concatenations work on the left of an assign too, which splits a value:

```
assign {cout, sum} = a + b;   // 9-bit result split into carry + 8-bit sum
```

Every item needs a known width: write `2'b11`, not `3` (an unsized number is 32 bits).
@example
module top_module(input [3:0] a, b, output [7:0] y, output [1:0] top, output [5:0] rest);
  assign y = {a, b};
  assign {top, rest} = y;
endmodule
@task
Inputs `a`–`f` are 5 bits each (30 bits total). Concatenate them with two 1 bits (`2'b11`) at the end to make 32 bits, then split the result into four 8-bit outputs `w` (MSBs), `x`, `y`, `z` (LSBs).
@starter
module top_module(
  input [4:0] a, b, c, d, e, f,
  output [7:0] w, x, y, z
);

endmodule
@solution
module top_module(
  input [4:0] a, b, c, d, e, f,
  output [7:0] w, x, y, z
);
  assign {w, x, y, z} = {a, b, c, d, e, f, 2'b11};
endmodule
@spec {"type":"comb","n":150}
@hint Put a concatenation on both sides: `assign {w, x, y, z} = {…};`
@end

@lesson reverse | Reversing bit order
@body
To reverse a vector you can't use `in[0:7]` on a `[7:0]` vector. Reversed part-selects aren't allowed. Instead:

- write a **concatenation** of single bits: `{in[0], in[1], …}`, or
- use a **for loop** inside a combinational always block. The loop is unrolled into plain wiring at synthesis; it doesn't run in time.

```
integer i;
always @(*)
  for (i = 0; i < 8; i = i + 1)
    out[i] = in[7 - i];
```

(Outputs assigned in an `always` block must be declared `reg`. More on that in the Procedures chapter.)
@example
module top_module(input [3:0] in, output [3:0] out);
  assign out = {in[0], in[1], in[2], in[3]};
endmodule
@task
Reverse the bit order of an 8-bit input: `out[0] = in[7]`, `out[7] = in[0]`.
@starter
module top_module(input [7:0] in, output [7:0] out);

endmodule
@solution
module top_module(input [7:0] in, output [7:0] out);
  assign out = {in[0], in[1], in[2], in[3], in[4], in[5], in[6], in[7]};
endmodule
@wrong
module top_module(input [7:0] in, output [7:0] out);
  assign out = ~in;
endmodule
@spec {"type":"comb"}
@hint `~in` inverts bits; it doesn't reverse them. You need to move bits.
@end

@lesson replicate | Replication and sign extension
@body
`{n{x}}` repeats `x` n times: `{3{2'b01}} = 6'b010101`. Inside a larger concatenation the replication needs its **own** braces:

```
{{24{in[7]}}, in}    // correct: note the double braces
{24{in[7]}, in}      // syntax error
```

**Sign extension**: to widen a two's-complement number without changing its value, copy the sign bit (the MSB) into the new upper bits. 8'hF6 (−10) becomes 32'hFFFFFFF6, still −10.
@example
module top_module(input [3:0] in, output [7:0] zext, sext);
  assign zext = {4'b0000, in};
  assign sext = {{4{in[3]}}, in};
endmodule
@task
Sign-extend an 8-bit number `in` to 32 bits.
@starter
module top_module(input [7:0] in, output [31:0] out);

endmodule
@solution
module top_module(input [7:0] in, output [31:0] out);
  assign out = {{24{in[7]}}, in};
endmodule
@wrong
module top_module(input [7:0] in, output [31:0] out);
  assign out = {{24{in[0]}}, in};
endmodule
@spec {"type":"comb"}
@hint The sign bit of an 8-bit number is `in[7]`, not `in[0]`.
@end

@chapter modules | Modules and hierarchy
@lesson inst_name | Instantiating a module (by name)
@body
Big designs are built from smaller modules. To use one, **instantiate** it: give the module type, an instance name, and its connections.

```
mod_a u1 (.in1(a), .in2(b), .out(y));
```

`.in1(a)` means "connect my signal `a` to its port `in1`". Named connections can go in any order and survive changes to the submodule's port order. Prefer them.

The submodule's code lives in its own `module … endmodule` block. **Never** put one module inside another, and don't redefine a module that already exists (that's a "declared twice" error).
@example
module and2(input x, y, output z);
  assign z = x & y;
endmodule

module top_module(input a, b, c, output y);
  wire t;
  and2 g1 (.x(a), .y(b), .z(t));
  and2 g2 (.x(t), .y(c), .z(y));
endmodule
@task
`mod_a` is provided (`input in1, input in2, output out`). Instantiate it inside `top_module`, connecting `a → in1`, `b → in2`, `out → out`. Use named connections.
@lib
module mod_a(input in1, input in2, output out);
  assign out = in1 ^ ~in2;
endmodule
@starter
module top_module(input a, input b, output out);

endmodule
@solution
module top_module(input a, input b, output out);
  mod_a inst1 (.in1(a), .in2(b), .out(out));
endmodule
@spec {"type":"comb"}
@hint `mod_a inst1 (.in1(a), .in2(b), .out(out));`. Count your brackets.
@end

@lesson inst_pos | Connecting by position
@body
Positional connections follow the submodule's port **order**:

```
mod_b u1 (o1, o2, a, b);   // matches mod_b(output, output, input, input)
```

It's shorter, but if someone reorders the ports of `mod_b`, every positional instance silently mis-wires. In real code, use named connections; you still need to read positional style in old code and in exams.
@example
module xor2(output z, input x, input y);
  assign z = x ^ y;
endmodule

module top_module(input a, b, output y);
  xor2 g (y, a, b);
endmodule
@task
`mod_b` is provided with ports in this order: `(output out1, output out2, input in1, input in2, input in3, input in4)`. Connect `out1, out2, a, b, c, d` **by position**.
@lib
module mod_b(output out1, output out2, input in1, input in2, input in3, input in4);
  assign out1 = (in1 & in2) | in3;
  assign out2 = in4 ^ in1;
endmodule
@starter
module top_module(input a, b, c, d, output out1, out2);

endmodule
@solution
module top_module(input a, b, c, d, output out1, out2);
  mod_b u (out1, out2, a, b, c, d);
endmodule
@spec {"type":"comb"}
@hint The order is outputs first, then the four inputs.
@end

@lesson inst_chain | A chain of instances
@body
Instances connect through internal wires. To chain three flip-flops, declare the two wires between them:

```
wire q1, q2;
my_dff s1 (.clk(clk), .d(d),  .q(q1));
my_dff s2 (.clk(clk), .d(q1), .q(q2));
```

An instance isn't an expression: you can't write `assign x = my_dff(...)`. Its **output port connection** is what drives the wire.
@example
module inv(input a, output y);
  assign y = ~a;
endmodule

module top_module(input in, output out);
  wire t;
  inv i1 (.a(in), .y(t));
  inv i2 (.a(t),  .y(out));
endmodule
@task
`my_dff` is provided (`input clk, input d, output q`, a D flip-flop). Chain three of them so that `d` passes through all three to `q`: a 3-cycle delay line.
@lib
module my_dff(input clk, input d, output reg q);
  always @(posedge clk) q <= d;
endmodule
@starter
module top_module(input clk, input d, output q);

endmodule
@solution
module top_module(input clk, input d, output q);
  wire a, b;
  my_dff s1 (.clk(clk), .d(d), .q(a));
  my_dff s2 (.clk(clk), .d(a), .q(b));
  my_dff s3 (.clk(clk), .d(b), .q(q));
endmodule
@wrong
module top_module(input clk, input d, output q);
  wire a;
  my_dff s1 (.clk(clk), .d(d), .q(a));
  my_dff s3 (.clk(clk), .d(a), .q(q));
endmodule
@spec {"type":"seq","clk":"clk","cycles":60}
@hint Only the last instance drives the top-level `q`; the first two drive internal wires.
@end

@lesson adder32 | Two levels of hierarchy: a 32-bit adder
@body
A **full adder** adds three bits:

- `sum  = a ^ b ^ cin`
- `cout = (a & b) | (a & cin) | (b & cin)` (the majority function)

The provided `add16` contains **16 instances of `add1`**, a module that you write. Your `top_module` instantiates two `add16`s: the low half's carry-out feeds the high half's carry-in (a ripple between the halves). Carry-in of the low half is `1'b0`; the final carry-out is ignored.

You write two modules here, `add1` and `top_module`, one after the other (not nested).
@task
Write `module add1(input a, input b, input cin, output sum, output cout);` and a `top_module` that adds two 32-bit numbers using two `add16` instances: `add16(input [15:0] a, input [15:0] b, input cin, output [15:0] sum, output cout)`.
@lib
module add16(input [15:0] a, input [15:0] b, input cin, output [15:0] sum, output cout);
  wire [16:0] c;
  assign c[0] = cin;
  genvar i;
  generate for (i = 0; i < 16; i = i + 1) begin : fa
    add1 u (.a(a[i]), .b(b[i]), .cin(c[i]), .sum(sum[i]), .cout(c[i+1]));
  end endgenerate
  assign cout = c[16];
endmodule
@starter
module top_module(input [31:0] a, input [31:0] b, output [31:0] sum);

endmodule

module add1(input a, input b, input cin, output sum, output cout);
  // full adder here
endmodule
@solution
module top_module(input [31:0] a, input [31:0] b, output [31:0] sum);
  wire c;
  add16 lo (.a(a[15:0]),  .b(b[15:0]),  .cin(1'b0), .sum(sum[15:0]),  .cout(c));
  add16 hi (.a(a[31:16]), .b(b[31:16]), .cin(c),    .sum(sum[31:16]), .cout());
endmodule

module add1(input a, input b, input cin, output sum, output cout);
  assign sum  = a ^ b ^ cin;
  assign cout = (a & b) | (a & cin) | (b & cin);
endmodule
@wrong
module top_module(input [31:0] a, input [31:0] b, output [31:0] sum);
  add16 lo (.a(a[15:0]),  .b(b[15:0]),  .cin(1'b0), .sum(sum[15:0]),  .cout());
  add16 hi (.a(a[31:16]), .b(b[31:16]), .cin(1'b0), .sum(sum[31:16]), .cout());
endmodule
module add1(input a, input b, input cin, output sum, output cout);
  assign sum  = a ^ b ^ cin;
  assign cout = (a & b) | (a & cin) | (b & cin);
endmodule
