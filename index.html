    ${row('mm','$','#b48cff','Market-making game','Quote a market on a hidden card sum while cards are revealed. Some counterparties know the answer.', mm.length?`Games ${mm.length} · avg P&L ${fmt(mm.reduce((a,g)=>a+g.pnl,0)/mm.length,1)}`:'')}
    <p class="sub" style="margin-top:14px">Formats follow candidate reports (e.g. Optiver's widely reported 80-in-8). Firms change their tests, so treat these as practice, not a replica.</p>`;
  app.querySelectorAll('[data-t]').forEach(b => b.onclick = () => { const t=b.dataset.t; if (t==='sprint') startSprint(); else if (t==='mm') startMM(); else startTest(t); });
}
function startTest(k){ const p=PRESETS[k]; ts={kind:'test', key:k, p, i:0, score:0, right:0, wrong:0, skip:0, end:Date.now()+p.secs*1000, log:[], over:false}; ts.item=p.make(0); renderTestQ(); startTimer(); }
function startTimer(){ clearInterval(window._tt); window._tt = setInterval(() => { if (!ts || ts.kind!=='test' || ts.over) return clearInterval(window._tt); const left=Math.max(0,Math.ceil((ts.end-Date.now())/1000)); const el=$('#tm'); if (el) el.textContent=`${Math.floor(left/60)}:${String(left%60).padStart(2,'0')}`; if (left<=0) endTest(); }, 250); }
function renderTestQ(){
  const p=ts.p;
  app.innerHTML = `<div class="row"><h1 class="grow">${p.title}</h1><span class="timer" id="tm"></span></div>
    <p class="sub">Q ${ts.i+1}/${p.n} · ${p.pm?`score ${ts.score}`:`${ts.right} right`} <button class="chip" id="quit" style="float:right">End</button></p><div id="itm"></div>`;
  $('#quit').onclick = endTest;
  renderItem($('#itm'), ts.item, {test:true, done: res => {
    const it=ts.item; ts.log.push({it, ...res});
    if (res.skipped) ts.skip++; else if (res.ok){ ts.right++; ts.score++; } else { ts.wrong++; if (p.pm) ts.score--; }
    bumpCat(it.cat, res.ok); bumpGen(it.gid, res.ok); if (!res.ok) logMistake(it, res.skipped?'(skipped)':res.given);
    ts.i++; if (ts.i>=p.n || Date.now()>=ts.end) return endTest();
    ts.item=p.make(ts.i); renderTestQ();
  }});
}
function endTest(){
  if (!ts || ts.over) return; ts.over=true; clearInterval(window._tt); kp=null;
  const th=store.get('tests',{}); (th[ts.key]=th[ts.key]||[]).push({d:today(), score:ts.p.pm?ts.score:ts.right, n:ts.i, right:ts.right, wrong:ts.wrong, secs:Math.round((ts.p.secs*1000-(ts.end-Date.now()))/1000)}); th[ts.key]=th[ts.key].slice(-100); store.set('tests',th);
  renderTestEnd();
}
function renderTestEnd(){
  const p=ts.p, miss=ts.log.filter(x=>!x.ok);
  app.innerHTML = `<h1>${p.title}: done</h1>
    <div class="stat"><div><b>${p.pm?ts.score:ts.right}</b><span>${p.pm?'score':'correct'}</span></div><div><b>${ts.wrong}</b><span>wrong</span></div><div><b>${ts.skip + (p.n-ts.i)}</b><span>skipped/unseen</span></div></div>
    ${miss.length?`<h2>Review your misses</h2>${miss.map(x=>`<div class="card small"><div>${x.it.type==='card'?md(x.it.card.q):qh(x.it.q)}</div><div class="a">Answer: <b>${md(answerText(x.it))}</b>${x.given?` · you: ${esc(x.given)}`:x.skipped?' · skipped':''}${x.it.why?`<br><span class="mut">${md(x.it.why)}</span>`:''}</div>${PRIMERS[conceptOf(x.it)]?`<div class="pslot"></div><button class="chip" data-pr="${conceptOf(x.it)}" style="margin-top:10px">Learn: ${esc(PRIMERS[conceptOf(x.it)].title)}</button>`:''}</div>`).join('')}`:'<p class="sub">No mistakes. Raise the bar: go faster next time.</p>'}
    <button class="big" id="again">Go again</button><button class="big ghost" id="back">Back to tests</button>`;
  $('#again').onclick = () => startTest(ts.key); $('#back').onclick = () => { ts=null; renderTests(); };
  app.querySelectorAll('[data-pr]').forEach(b => b.onclick = () => { b.previousElementSibling.innerHTML = primerHTML(PRIMERS[b.dataset.pr]); b.remove(); });
}

/* ---- Zetamac sprint ---- */
function sprintQ(){ const op=rnd(0,3); if (op===0){const a=rnd(2,100),b=rnd(2,100); return {t:`${a} + ${b}`,a:a+b};} if (op===1){const a=rnd(2,100),b=rnd(2,100); return {t:`${a+b} − ${a}`,a:b};} if (op===2){const a=rnd(2,12),b=rnd(2,100); return Math.random()<.5?{t:`${a} × ${b}`,a:a*b}:{t:`${b} × ${a}`,a:a*b};} const a=rnd(2,12),b=rnd(2,100); return {t:`${a*b} ÷ ${a}`,a:b}; }
function startSprint(){ ts={kind:'sprint', score:0, end:Date.now()+settings.sprintSecs*1000, q:sprintQ(), over:false, val:''}; renderSprint(); }
function renderSprint(){
  if (ts.over){ const h=store.get('sprints',[]), best=h.reduce((m,s)=>Math.max(m,s.score),0); kp=null;
    app.innerHTML = `<h1>Sprint over</h1><div class="card" style="text-align:center"><div class="mut">Score</div><div class="sprint-q">${ts.score}</div><div class="mut small">Best ${best} · last 5: ${h.slice(-5).map(s=>s.score).join(', ')}</div><button class="big" id="again">Go again</button><button class="big ghost" id="back">Back</button></div>`;
    $('#again').onclick=startSprint; $('#back').onclick=()=>{ts=null; renderTests();}; return; }
  app.innerHTML = `<div class="row"><h1 class="grow">Sprint</h1><span class="timer" id="tm"></span></div><p class="sub">Score <b id="sc">${ts.score}</b> · answers submit automatically <button class="chip" id="quit" style="float:right">Quit</button></p>
    <div class="card"><div class="sprint-q" id="sq">${ts.q.t}</div><div class="disp" id="disp"></div>${keypadHTML('num')}</div>`;
  const disp=$('#disp');
  bindKeypad(app, {get:()=>ts.val, set:v=>{ ts.val=v.replace(/[^0-9]/g,''); disp.textContent=ts.val; if (ts.val!=='' && +ts.val===ts.q.a){ ts.score++; ts.q=sprintQ(); ts.val=''; $('#sq').textContent=ts.q.t; $('#sc').textContent=ts.score; disp.textContent=''; } }, submit:()=>{ ts.val=''; disp.textContent=''; }});
  $('#quit').onclick = () => { clearInterval(ts.tick); ts=null; kp=null; renderTests(); };
  const upd = () => { if (!ts || ts.kind!=='sprint' || ts.over) return; const left=Math.max(0,Math.ceil((ts.end-Date.now())/1000)); const tm=$('#tm'); if (tm) tm.textContent=left+'s';
    if (left<=0){ clearInterval(ts.tick); ts.over=true; const h=store.get('sprints',[]); h.push({d:today(), score:ts.score, secs:settings.sprintSecs}); store.set('sprints',h.slice(-300)); markActive(); renderSprint(); } };
  clearInterval(ts.tick); ts.tick=setInterval(upd,200); upd();
}

/* ---- market-making game ---- */
const CARDNAME = v => ({1:'A',11:'J',12:'Q',13:'K'})[v] || String(v);
const MAXSPREAD = [10,8,6,4];
function startMM(){
  const deck=shuffle([...Array(52)].map((_,i)=>i%13+1)); const hand=deck.slice(0,5);
  ts={kind:'mm', hand, sum:hand.reduce((a,b)=>a+b,0), round:0, pos:0, cash:0, hist:[], field:'bid', bid:'', ask:'', over:false, msg:''}; renderMM();
}
const mmFair = (hand, r) => { const s=hand.slice(0,r).reduce((a,b)=>a+b,0); return s + (5-r)*(364-s)/(52-r); };
function renderMM(){
  const g=ts, r=g.round;
  if (g.over){ kp=null;
    const pnl=g.cash+g.pos*g.sum; const err=g.hist.reduce((a,h)=>a+Math.abs(h.mid-h.fair),0)/g.hist.length;
    app.innerHTML = `<h1>Settlement</h1><div class="card"><div class="cards">${g.hand.map(v=>`<span class="pc">${CARDNAME(v)}</span>`).join('')}</div>
      <p>Sum = <b>${g.sum}</b>. Final position ${g.pos>0?'+':''}${g.pos}, cash ${g.cash}.</p>
      <div class="stat"><div><b style="color:${pnl>=0?'var(--good)':'var(--bad)'}">${pnl>0?'+':''}${pnl}</b><span>P&L</span></div><div><b>${fmt(err,2)}</b><span>avg |mid − fair|</span></div><div><b>${g.hist.filter(h=>h.trade).length}</b><span>trades</span></div></div>
      <div class="list">${g.hist.map((h,i)=>`<div class="li"><span>R${i+1}: ${h.bid} – ${h.ask}</span><span class="mut">fair ${fmt(h.fair,2)} · ${h.trade||'no trade'}</span></div>`).join('')}</div>
      <p class="small mut">Judge yourself on quote error, not P&L: one game's P&L is mostly luck. A mid close to fair value, tightening as cards appear, is the skill.</p>
      <button class="big" id="again">New game</button><button class="big ghost" id="back">Back</button></div>`;
    $('#again').onclick=startMM; $('#back').onclick=()=>{ts=null; renderTests();}; return; }
  const shown=g.hand.slice(0,r);
  app.innerHTML = `<div class="row"><h1 class="grow">Make a market</h1><button class="chip" id="quit">Quit</button></div>
    <p class="sub">Settlement = sum of 5 cards from one deck (A=1 … K=13). Round ${r+1}/4. Max spread ${MAXSPREAD[r]}. Each trade is 1 lot.</p>
    <div class="card"><div class="cards">${g.hand.map((v,i)=>`<span class="pc ${i<r?'':'hid'}">${i<r?CARDNAME(v):'?'}</span>`).join('')}</div>
      <p class="small">Position <b>${g.pos>0?'+':''}${g.pos}</b> · cash <b>${g.cash}</b>${g.msg?`<br><span class="mut">${g.msg}</span>`:''}</p>
      <div class="row"><button class="qf ${g.field==='bid'?'on':''}" data-f="bid"><small>Bid</small>${g.bid||'—'}</button><button class="qf ${g.field==='ask'?'on':''}" data-f="ask"><small>Ask</small>${g.ask||'—'}</button></div>
      ${keypadHTML('num')}</div>`;
  app.querySelectorAll('[data-f]').forEach(b => b.onclick = () => { g.field=b.dataset.f; renderMM(); });
  $('#quit').onclick = () => { ts=null; kp=null; renderTests(); };
  bindKeypad(app, {get:()=>g[g.field], set:v=>{ g[g.field]=v.replace(/[^0-9.]/g,''); renderMM(); }, submit:()=>{
    if (g.field==='bid' && g.bid){ g.field='ask'; return renderMM(); }
    const b=parseFloat(g.bid), a=parseFloat(g.ask);
    if (!isFinite(b)||!isFinite(a)) return toast('Enter a bid and an ask');
    if (a<=b) return toast('Ask must be above bid');
    if (a-b>MAXSPREAD[r]) return toast(`Spread too wide (max ${MAXSPREAD[r]})`);
    const fair=mmFair(g.hand,r); let trade='';
    if (Math.random()<0.5){ if (g.sum>a){ g.pos--; g.cash+=a; trade=`informed bought @ ${a}`; } else if (g.sum<b){ g.pos++; g.cash-=b; trade=`informed sold @ ${b}`; } }
    else { if (Math.random()<.5){ g.pos--; g.cash+=a; trade=`noise bought @ ${a}`; } else { g.pos++; g.cash-=b; trade=`noise sold @ ${b}`; } }
    g.hist.push({bid:b, ask:a, mid:(a+b)/2, fair, trade});
    g.msg = `${trade || 'No trade'}. Fair value was ${fmt(fair,2)}, your mid ${fmt((a+b)/2,2)}.`;
    g.round++; g.bid=''; g.ask=''; g.field='bid';
    if (g.round>=4){ g.over=true; const h=store.get('mm',[]); h.push({d:today(), pnl:g.cash+g.pos*g.sum, err:g.hist.reduce((s,x)=>s+Math.abs(x.mid-x.fair),0)/4}); store.set('mm',h.slice(-200)); markActive(); }
    renderMM();
  }});
}

    ${list.length ? list.slice(0,150).map(m => { const it=unsnap(m); if (!it) return ''; const pr=PRIMERS[conceptOf(it)];

function startDrill(ms, similar){
  const q=[]; shuffle([...ms]).forEach(m => { const it=unsnap(m); if (!it) return; if (similar){ const g=GENS.find(x=>x.gid===it.gid); for (let i=0;i<5;i++){ const n=g&&makeGen(g); if (n) q.push({...n, simOf:m.key}); } } else { q.push({...it, retryKey:m.key}); const g=it.gid&&GENS.find(x=>x.gid===it.gid); if (g){ const n=makeGen(g); if (n) q.push({...n, simOf:m.key}); } } });
  rvw.drill={q, i:0, ok:0}; renderDrill();
}
function renderDrill(){
  const d=rvw.drill; if (d.i>=d.q.length){ kp=null; app.innerHTML = `<h1>Retry done</h1><div class="card" style="text-align:center"><div class="sprint-q">${d.ok}/${d.q.length}</div><p class="sub">Mistakes answered right twice move to Fixed.</p><button class="big" id="bk">Back to review</button></div>`; $('#bk').onclick=()=>{ rvw.drill=null; renderReview(); }; return; }
  const it=d.q[d.i];
  app.innerHTML = `<div class="row"><h1 class="grow">Retry</h1><span class="pill">${d.i+1}/${d.q.length}</span><button class="chip" id="stop" style="margin-left:8px">Stop</button></div><p class="sub">${it.retryKey?'The exact question you missed.':'A fresh one of the same kind.'}</p><div id="itm"></div>`;
  $('#stop').onclick = () => { rvw.drill=null; renderReview(); };
  renderItem($('#itm'), it, {done: res => {
    if (it.retryKey){ const m=mistakes.find(x=>x.key===it.retryKey); if (m) retryResult(m, res.ok); }
    else if (!res.ok) logMistake(it, res.given);
    if (!res.card){ bumpCat(it.cat,res.ok); bumpGen(it.gid,res.ok); }
    if (res.ok) d.ok++; d.i++; renderDrill();
  }});
}

/* ================= CARDS (SRS review) ================= */
let rv = {deck:store.get('lastDeck','all'), queue:null};
function counts(deck){ const now=Date.now(); let due=0,nw=0; for (const c of CARDS){ if (deck!=='all'&&c.deck!==deck) continue; const s=srs[c.id]; if (!s) nw++; else if (s.d<=now) due++; } return {due, nw:Math.min(nw, Math.max(0,settings.newPerDay-newToday()))}; }
function buildQueue(){ const now=Date.now(); const pool=CARDS.filter(c=>rv.deck==='all'||c.deck===rv.deck); const due=shuffle(pool.filter(c=>srs[c.id]&&srs[c.id].d<=now)); let fresh=pool.filter(c=>!srs[c.id]); if (rv.deck==='all') shuffle(fresh); fresh=fresh.slice(0,Math.max(0,settings.newPerDay-newToday())); rv.queue=due.concat(fresh); }
function renderCards(){
  if (!rv.queue) buildQueue();
  const decks=[{id:'all',title:'All'}].concat(DECKS);
  app.innerHTML = `<div class="row"><h1 class="grow">Flashcards</h1><button class="chip" id="backtr">← Practice</button></div><p class="sub">${CARDS.length} flashcards with spaced repetition. Due cards also appear in Practice.</p>
    <div class="chips">${decks.map(d=>{const k=counts(d.id); return `<button class="chip ${rv.deck===d.id?'on':''}" data-deck="${d.id}">${esc(d.title)}<span class="n">${k.due+k.nw}</span></button>`;}).join('')}</div><div id="itm"></div>`;
  app.querySelectorAll('[data-deck]').forEach(b => b.onclick = () => { rv.deck=b.dataset.deck; store.set('lastDeck',rv.deck); rv.queue=null; renderCards(); });
  $('#backtr').onclick = () => tab('train');
  const c=rv.queue[0];
  if (!c){ kp=null; $('#itm').innerHTML = `<div class="card empty"><b style="color:var(--fg)">Done for now.</b><br>Nothing due here. Practice never runs out.<button class="big" id="gotr">Go to Practice</button></div>`; $('#gotr').onclick=()=>tab('train'); return; }
  renderItem($('#itm'), {type:'card', card:c, cat:c.cat}, {done: res => { const x=rv.queue.shift(); if (srs[x.id] && srs[x.id].i===0) rv.queue.splice(Math.min(3,rv.queue.length),0,x); renderCards(); }});
}

/* ================= PROGRESS ================= */
function streak(){ const set=new Set(store.get('days',[])); let n=0; const d=new Date(); if (!set.has(d.toISOString().slice(0,10))) d.setDate(d.getDate()-1); while (set.has(d.toISOString().slice(0,10))){ n++; d.setDate(d.getDate()-1); } return n; }
function spark(vals, label){ if (!vals.length) return ''; const max=Math.max(1,...vals.map(Math.abs)); const w=300/vals.length; return `<div class="card"><svg viewBox="0 0 300 90" width="100%" height="90" role="img" aria-label="${label}">${vals.map((v,i)=>{const h=Math.max(2,70*Math.abs(v)/max); return `<rect x="${i*w+3}" y="${80-h}" width="${Math.max(2,w-6)}" height="${h}" rx="3" fill="${v<0?'#ff6b6b':'#7aa2ff'}"/>`+(vals.length<=12?`<text x="${i*w+w/2}" y="${76-h}" font-size="10" fill="#9aa1ae" text-anchor="middle">${fmt(v,1)}</text>`:'');}).join('')}<line x1="0" y1="80.5" x2="300" y2="80.5" stroke="#2a2f3a"/></svg></div>`; }
function renderStats(){
  kp=null; renderStatsInner(); app.insertAdjacentHTML('beforeend', '<div id="morebox"></div>'); renderMore($('#morebox'));
}
function renderStatsInner(){

/* ---------- syntax highlighting (Verilog / SystemVerilog, plus Python and Tcl for lesson snippets) ---------- */
const HL = (() => {
  const V_KW = new Set('module endmodule input output inout wire reg logic integer genvar parameter localparam assign always always_ff always_comb always_latch initial begin end generate endgenerate function endfunction automatic signed unsigned int bit posedge negedge or default case casez casex endcase if else for while unique priority typedef struct packed enum'.split(' '));
  const V_CTRL = new Set('if else for while case casez casex endcase default begin end return'.split(' '));
  const V_TYPE = new Set('wire reg logic integer genvar int bit signed unsigned parameter localparam input output inout'.split(' '));
  const PY_KW = new Set('def async await import from as return for in if elif else while with class assert and or not None True False lambda yield try except raise pass range'.split(' '));
  const TCL_KW = new Set('set source puts expr foreach if else proc return open_checkpoint create_clock opt_design place_design phys_opt_design route_design get_timing_paths get_property get_ports report_timing lassign format'.split(' '));
  function lang(code){ if (/\b(async def|await |import cocotb|def )/.test(code)) return 'py'; if (/^\s*(set |source |open_checkpoint|create_clock|puts )/m.test(code) && !/\bmodule\b/.test(code)) return 'tcl'; return 'v'; }
  function hl(code, lg){
    lg = lg || lang(code);
    let out = '', i = 0; const n = code.length;
    const span = (c, t) => `<span class="${c}">${esc(t)}</span>`;
    while (i < n){
      const ch = code[i], rest = code.slice(i);
      let m;
      if (lg !== 'py' && lg !== 'tcl' && rest.startsWith('//')){ const e = code.indexOf('\n', i); const t = code.slice(i, e < 0 ? n : e); out += span('tc', t); i += t.length; continue; }
      if (lg === 'v' && rest.startsWith('/*')){ const e = code.indexOf('*/', i + 2); const t = code.slice(i, e < 0 ? n : e + 2); out += span('tc', t); i += t.length; continue; }
      if ((lg === 'py' || lg === 'tcl') && ch === '#'){ const e = code.indexOf('\n', i); const t = code.slice(i, e < 0 ? n : e); out += span('tc', t); i += t.length; continue; }
      if (lg === 'tcl' && rest.startsWith(';#')){ const e = code.indexOf('\n', i); const t = code.slice(i, e < 0 ? n : e); out += span('tc', t); i += t.length; continue; }
      if (ch === '"'){ let j = i + 1; while (j < n && code[j] !== '"' && code[j] !== '\n') j++; const t = code.slice(i, j + 1); out += span('ts', t); i += t.length; continue; }
      if (lg === 'v' && (m = rest.match(/^(\d+)?'[sS]?[bBoOdDhH][0-9a-fA-FxXzZ_?]+/))){ out += span('tn', m[0]); i += m[0].length; continue; }
      if (lg === 'v' && (m = rest.match(/^'[01xz]\b/))){ out += span('tn', m[0]); i += m[0].length; continue; }
      if ((m = rest.match(/^\d[\d_]*(\.\d+)?/)) && !/[A-Za-z_]/.test(code[i-1] || '')){ out += span('tn', m[0]); i += m[0].length; continue; }
      if (lg === 'v' && (m = rest.match(/^\$[A-Za-z_]\w*/))){ out += span('tf', m[0]); i += m[0].length; continue; }
      if (lg === 'v' && (m = rest.match(/^`\w+/))){ out += span('tk', m[0]); i += m[0].length; continue; }
      if ((m = rest.match(/^[A-Za-z_]\w*/))){
        const w = m[0];
        if (lg === 'v'){
          if (V_CTRL.has(w)) out += span('tq', w);
          else if (V_TYPE.has(w)) out += span('tt', w);
          else if (V_KW.has(w)) out += span('tk', w);
          else if (/^[A-Z][A-Z0-9_]+$/.test(w)) out += span('tp', w);
          else if (/^\s*\(/.test(code.slice(i + w.length)) && /\b(module)\s+$/.test(code.slice(Math.max(0, i - 12), i))) out += span('tm', w);
          else out += esc(w);
        } else if (lg === 'py'){ out += PY_KW.has(w) ? span('tq', w) : /^\s*\(/.test(code.slice(i + w.length)) ? span('tf', w) : esc(w); }
        else { out += TCL_KW.has(w) ? span('tk', w) : esc(w); }
        i += w.length; continue;
      }
      if (lg === 'v' && (m = rest.match(/^(<=|>=|==|!=|&&|\|\||<<<|>>>|<<|>>|[=+\-*\/%&|^~!<>?:])/))){ out += span('to', m[0]); i += m[0].length; continue; }
      out += esc(ch); i++;
    }
    return out;
  }
  return {hl, lang};
})();

/* ---------- code editor (overlay: transparent textarea over a highlighted layer) ---------- */
const SYMS = [';','(',')','[',']','{','}','<=','=','&','|','^','~','!','?',':',"'",'@','#',',','_','begin','end'];
const PAIRS = {'(':')','[':']','{':'}'};
const LINE_H = 20;
function mountEditor(host, o){
  const saved = lcode[o.key];
  host.innerHTML = `<div class="ed2"><div class="gut2" aria-hidden="true"><div class="gin"></div></div><div class="code2"><pre class="hlp" aria-hidden="true"><code></code></pre><textarea spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off" wrap="off" aria-label="Code editor"></textarea></div></div>
    <div class="syms">${SYMS.map(s => `<button type="button" data-s="${esc(s)}">${esc(s)}</button>`).join('')}<button type="button" data-s="TAB">⇥</button><button type="button" data-s="UNTAB">⇤</button></div>
    <div class="row" style="gap:8px;margin-top:8px"><button class="big grow" data-run style="margin-top:0">${o.runLabel}</button>${o.extra||''}<button class="chip" data-reset>Reset</button></div>
    <div class="out"></div>`;
  const ta = host.querySelector('textarea'), hlc = host.querySelector('.hlp code'), hlp = host.querySelector('.hlp'), gin = host.querySelector('.gin'), box = host.querySelector('.ed2'), out = host.querySelector('.out');
  ta.value = saved != null ? saved : o.initial;
  let errLines = new Set(), lastLines = -1;
  function render(){
    hlc.innerHTML = HL.hl(ta.value, 'v') + '\n ';
    const nl = ta.value.split('\n').length;
    if (nl !== lastLines || render.force){
      let s = ''; for (let k = 1; k <= nl; k++) s += `<div class="${errLines.has(k) ? 'gerr' : ''}">${k}</div>`; gin.innerHTML = s;
      const h = Math.min(Math.max(nl * LINE_H + 24, 180), Math.round(window.innerHeight * 0.6));
      box.style.height = h + 'px'; lastLines = nl; render.force = false;
    }
    sync();
  }
  function sync(){ hlp.scrollTop = ta.scrollTop; hlp.scrollLeft = ta.scrollLeft; gin.style.transform = `translateY(${-ta.scrollTop}px)`; }
  const save = () => { lcode[o.key] = ta.value; store.set('lcode', lcode); };
  ta.addEventListener('scroll', sync);
  ta.addEventListener('input', () => { autoDedent(); render(); save(); });
  function ins(t, caretBack = 0){ const s = ta.selectionStart, e = ta.selectionEnd; ta.setRangeText(t, s, e, 'end'); if (caretBack) ta.selectionStart = ta.selectionEnd = ta.selectionStart - caretBack; render(); save(); }
  function curLine(){ const b = ta.value.slice(0, ta.selectionStart); return b.slice(b.lastIndexOf('\n') + 1); }
  function newlineIndent(){
    const line = curLine(), ind = line.match(/^\s*/)[0], t = line.trim(), after = ta.value.slice(ta.selectionStart).split('\n')[0];
    let more = /(\bbegin|[\(\[{])\s*(\/\/.*)?$/.test(t) || (/^(always|always_ff|always_comb|if|else|for|initial)\b/.test(t) && !/;\s*(\/\/.*)?$/.test(t) && !/\bbegin\b/.test(t)) || /^(case|casez|casex)\b/.test(t) || /^module\b/.test(t) || /^\);\s*$/.test(t);
    if (/^\s*[\)\]}]/.test(after) && /[\(\[{]\s*$/.test(t)){ ins('\n' + ind + '  ' + '\n' + ind, ind.length + 1); return; }
    ins('\n' + ind + (more ? '  ' : ''));
  }
  function autoDedent(){
    const line = curLine(), m = line.match(/^(\s*)(end|endcase|endmodule|endgenerate|else)$/);
    if (!m) return;
    if (ta.value.slice(ta.selectionStart).split('\n')[0].trim()) return;
    const lines = ta.value.slice(0, ta.selectionStart).split('\n'); lines.pop();
    const w = m[2]; let target = null;
    if (w === 'endmodule') target = '';
    else if (w === 'else'){
      let depth = 0;
      for (let k = lines.length - 1; k >= 0; k--){ const t = lines[k].trim(); if (!t) continue;
        const closes = (t.match(/\bend\b/g)||[]).length, opens = (t.match(/\bbegin\b/g)||[]).length;
        if (depth === 0 && (/^(if|else\s+if)\b/.test(t) || /^end\b/.test(t))){ target = lines[k].match(/^\s*/)[0]; break; }
        depth += opens - closes; if (depth > 0){ break; } }
    } else {
      const op = w === 'endcase' ? /\b(case|casez|casex)\b/g : w === 'endgenerate' ? /\bgenerate\b/g : /\bbegin\b/g;
      const cl = w === 'endcase' ? /\bendcase\b/g : w === 'endgenerate' ? /\bendgenerate\b/g : /\bend\b/g;
      let depth = 0;
      for (let k = lines.length - 1; k >= 0; k--){ const t = lines[k].replace(/\/\/.*$/, ''); depth += (t.match(cl)||[]).length - (t.match(op)||[]).length; if (depth < 0){ target = lines[k].match(/^\s*/)[0]; break; } }
    }
    if (target === null || target === m[1]) return;
    const s = ta.selectionStart; ta.setRangeText(target + w, s - line.length, s, 'end');
  }
  ta.addEventListener('beforeinput', e => {
    if (e.inputType === 'insertLineBreak' || (e.inputType === 'insertText' && e.data === '\n')){ e.preventDefault(); newlineIndent(); return; }
    if (e.inputType === 'insertText' && e.data && e.data.length === 1 && ta.selectionStart === ta.selectionEnd){
      const nx = ta.value[ta.selectionStart];
      if (PAIRS[e.data] && (!nx || /[\s\)\]},;]/.test(nx))){ e.preventDefault(); ins(e.data + PAIRS[e.data], 1); return; }
      if (/[\)\]}]/.test(e.data) && nx === e.data){ e.preventDefault(); ta.selectionStart = ta.selectionEnd = ta.selectionStart + 1; return; }
    }
    if (e.inputType === 'deleteContentBackward' && ta.selectionStart === ta.selectionEnd){
      const s = ta.selectionStart, pv = ta.value[s-1], nx = ta.value[s];
      if (PAIRS[pv] && PAIRS[pv] === nx){ e.preventDefault(); ta.setRangeText('', s - 1, s + 1, 'end'); render(); save(); return; }
      const line = curLine(); if (line.length && /^ +$/.test(line) && line.length % 2 === 0){ e.preventDefault(); ta.setRangeText('', s - 2, s, 'end'); render(); save(); }
    }
  });
  ta.addEventListener('keydown', e => {
    if (e.key === 'Tab'){ e.preventDefault(); if (e.shiftKey) unindent(); else ins('  '); }
  });
  function unindent(){ const s = ta.selectionStart, ls = ta.value.lastIndexOf('\n', s - 1) + 1; const sp = ta.value.slice(ls).match(/^ {1,2}/); if (sp){ ta.setRangeText('', ls, ls + sp[0].length, 'preserve'); ta.selectionStart = ta.selectionEnd = Math.max(ls, s - sp[0].length); render(); save(); } }
  host.querySelectorAll('[data-s]').forEach(b => b.addEventListener('pointerdown', e => { e.preventDefault(); const s = b.dataset.s;
    if (s === 'TAB') ins('  '); else if (s === 'UNTAB') unindent();
    else if (s === 'begin'){ const ind = curLine().match(/^\s*/)[0]; ins('begin\n' + ind + '  \n' + ind + 'end', ind.length + 4); }
    else if (s === 'end'){ ins('end'); ta.dispatchEvent(new Event('input')); }
    else if (PAIRS[s]) ins(s + PAIRS[s], 1);
    else ins(s);
    ta.focus({preventScroll:true}); }));
  host.querySelector('[data-reset]').onclick = () => { if (ta.value !== o.reset && !host._confirmReset){ host._confirmReset = true; toast('Tap Reset again to restore the starting code'); setTimeout(() => host._confirmReset = false, 2500); return; } ta.value = o.reset; save(); errLines = new Set(); render.force = true; render(); out.innerHTML = ''; };
  host.querySelector('[data-run]').onclick = () => {
    const res = o.run(ta.value);
    errLines = new Set((res.errors || []).map(e => e.line).filter(Boolean)); render.force = true; render();
    out.innerHTML = resultHTML(res, o.graded);
    out.querySelectorAll('[data-line]').forEach(a => a.onclick = ev => { ev.preventDefault(); gotoLine(+a.dataset.line); });
    if (o.after) o.after(res, out);
    const r = out.getBoundingClientRect(); if (r.top > window.innerHeight * 0.8) window.scrollBy({top: r.top - window.innerHeight * 0.35, behavior: 'smooth'});
  };
  function gotoLine(n){ const ls = ta.value.split('\n'); let pos = 0; for (let k = 0; k < n-1 && k < ls.length; k++) pos += ls[k].length + 1; ta.focus({preventScroll:true}); ta.setSelectionRange(pos, pos + (ls[n-1]||'').length); ta.scrollTop = Math.max(0, (n - 3) * LINE_H); sync(); box.scrollIntoView({behavior:'smooth', block:'center'}); }
  render();
  return {get: () => ta.value, set: v => { ta.value = v; save(); render.force = true; render(); }, out};
}

function resultHTML(res, graded){
  const msgs = (arr, cls) => arr.map(e => `<div class="msg ${cls}">${e.line ? `<a href="#" data-line="${e.line}">line ${e.line}</a> ` : ''}${esc(e.msg)}</div>`).join('');
  let h = '';
  if (!res.ok && res.errors && res.errors.length){
    h += `<div class="fb no"><b>${res.internal ? 'Checker problem' : 'Compile error'}</b>${msgs(res.errors, 'err')}</div>`;
    if (res.warnings && res.warnings.length) h += `<div class="warns">${msgs(res.warnings, 'warn')}</div>`;
    return h;
  }
  if (graded){
    h += res.ok ? `<div class="fb ok"><b>✓ Pass.</b> All ${res.total} test ${res.seq?'cycles':'vectors'} match the reference.</div>`
                : `<div class="fb no"><b>✗ ${res.mismatches} of ${res.total} ${res.seq?'cycles':'vectors'} mismatch.</b> ${Object.entries(res.perOut).filter(([,n])=>n).map(([k,n])=>`<code>${esc(k)}</code> wrong ${n}×`).join(', ')}. Red cells on the waveform show where. The <i>expected</i> row is the reference.</div>`;
  } else h += `<div class="fb ok"><b>Simulated.</b> ${res.rows.length} ${res.seq?'clock cycles':'input combinations'}.</div>`;
  if (res.warnings && res.warnings.length) h += `<div class="warns">${msgs(res.warnings, 'warn')}</div>`;
  h += waveHTML(res, graded);
  return h;
}

/* ---------- waveform viewer ---------- */
function waveHTML(res, graded){
  const rows = res.rows; if (!rows || !rows.length) return '';
  const N = rows.length, start = graded && res.first > 6 ? res.first - 6 : 0, end = Math.min(N, start + 48);
  const view = rows.slice(start, end), lw = 96, rh = 26;
  const maxw = Math.max(1, ...res.ports.map(p => p.w)); const digits = maxw <= 4 ? 2 : Math.min(8, Math.ceil(maxw / 4)); const cw = Math.max(36, digits * 7 + 12);
  const ins = res.ports.filter(p => p.dir === 'input' && p.name !== res.clk), outs = res.ports.filter(p => p.dir === 'output');
  const lines = [];
  if (res.seq) lines.push({label:'clk', clk:true});
  ins.forEach(p => lines.push({label:p.name, w:p.w, get: r => r.in[p.name]}));
  outs.forEach(p => { const anyBad = graded && view.some(r => r.bad.includes(p.name)); lines.push({label:p.name, w:p.w, get: r => r.out[p.name], out:true, name:p.name}); if (anyBad) lines.push({label:'expected', sub:p.name, w:p.w, get: r => r.ref[p.name], ref:true}); });
  const W = lw + view.length * cw, H = lines.length * rh + 22;
  let s = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" font-family="ui-monospace,Menlo,monospace" font-size="11">`;
  view.forEach((r, k) => { if (r.bad && r.bad.length) s += `<rect x="${lw + k*cw}" y="0" width="${cw}" height="${H-20}" fill="rgba(255,107,107,.08)"/>`; });
  lines.forEach((ln, li) => {
    const y = li * rh + 4, mid = y + rh/2 - 2, hi = y + 4, lo = y + rh - 8;
    s += `<text x="4" y="${mid+4}" fill="${ln.ref?'#9aa1ae':ln.out?'#e7e9ee':'#b9c3d6'}">${esc(ln.ref ? '  exp' : ln.label)}${ln.w>1?`<tspan fill="#6d7585">[${ln.w}]</tspan>`:''}</text>`;
    if (ln.clk){ let d = ''; view.forEach((r, k) => { const x = lw + k*cw; d += `M${x} ${lo} H${x+cw/2} V${hi} H${x+cw-0.5} V${lo} `; }); s += `<path d="${d}" stroke="#6d7585" fill="none"/>`; return; }
    view.forEach((r, k) => {
      const x = lw + k*cw, v = BigInt(ln.get(r) ?? 0), bad = ln.out && graded && r.bad.includes(ln.name);
      const col = ln.ref ? '#9aa1ae' : bad ? '#ff6b6b' : ln.out ? '#4ec9a0' : '#7aa2ff';
      if (ln.w === 1){
        const yv = v ? hi : lo; const pv = k ? (BigInt(ln.get(view[k-1]) ?? 0) ? hi : lo) : yv;
        s += `<path d="M${x} ${pv} V${yv} H${x+cw}" stroke="${col}" stroke-width="1.6" fill="none"/>`;
        if (bad) s += `<rect x="${x+1}" y="${hi-2}" width="${cw-2}" height="${lo-hi+4}" fill="none" stroke="#ff6b6b" stroke-dasharray="2 2"/>`;
      } else {
        const same = k && BigInt(ln.get(view[k-1]) ?? 0) === v;
        const txt = ln.w <= 4 ? v.toString() : v.toString(16).toUpperCase();
        s += `<path d="M${x} ${same?hi:mid} ${same?'':`L${x+3} ${hi} `}H${x+cw} M${x} ${same?lo:mid} ${same?'':`L${x+3} ${lo} `}H${x+cw}" stroke="${col}" stroke-width="1.3" fill="${bad?'rgba(255,107,107,.18)':'none'}"/>`;
        if (!same || k === 0) s += `<text x="${x+5}" y="${mid+4}" fill="${col}">${txt.length > 8 ? '…' + txt.slice(-7) : txt}</text>`;
      }
    });
  });
  view.forEach((r, k) => { if (k % 4 === 0) s += `<text x="${lw + k*cw + 2}" y="${H-6}" fill="#6d7585" font-size="9">${start + k}</text>`; });
  s += `</svg>`;
  const firstBad = graded && res.first >= 0 ? rows[res.first] : null;
  const fmtv = (v, w) => { v = BigInt(v ?? 0); return w > 4 ? `${v} (0x${v.toString(16).toUpperCase()})` : String(v); };
  const table = firstBad ? `<div class="card small mis"><b>First mismatch at ${res.seq?'cycle':'vector'} ${res.first}</b><br>${ins.map(p=>`<code>${esc(p.name)}</code> = ${fmtv(firstBad.in[p.name], p.w)}`).join(', ')}<br>${outs.filter(p=>firstBad.bad.includes(p.name)).map(p=>`<code>${esc(p.name)}</code>: yours ${fmtv(firstBad.out[p.name],p.w)}, expected <b>${fmtv(firstBad.ref[p.name],p.w)}</b>`).join('<br>')}</div>` : '';
  return `${table}<div class="wave">${s}</div><p class="sub small" style="margin-top:4px">${res.seq ? 'Each column is one clock cycle (inputs change while clk is low; outputs shown just before the rising edge).' : 'Each column is one input combination.'} Multi-bit values in hex${N > view.length ? `; showing ${start}–${end-1} of ${N}` : ''}.</p>`;
}

/* ---------- quant practice inside a lesson ---------- */
function practicePool(spec){
  const [cat, concept] = spec.split(':');
  if (cat === 'quant') return {gens: GENS.filter(g => g.cat === concept), mcs: MCB.filter(m => m.cat === concept)};
  if (cat === 'mdp') return {gens: GENS.filter(g => g.cat === 'mdp' && g.tag === concept), mcs: MCB.filter(m => m.cat === 'mdp' && m.tag === concept)};
  const gens = GENS.filter(g => { if (g.cat !== cat) return false; for (let k = 0; k < 6; k++){ const it = makeGen(g); if (it && conceptOf(it) === concept) return true; } return false; });
  const mcs = MCB.filter(m => m.cat === cat && conceptOf(m) === concept);
  return {gens, mcs, concept};
}
function mountPractice(host, c, L){
  const st = ln.state.prac; const pool = practicePool(L.practice);
  const next = () => {
    for (let k = 0; k < 30; k++){
      if (pool.mcs.length && (!pool.gens.length || Math.random() < 0.25)) return {...pick(pool.mcs)};
      if (!pool.gens.length) return {...pick(pool.mcs)};
      const it = makeGen(pick(pool.gens)); if (it && (!pool.concept || conceptOf(it) === pool.concept)) return it;
    }
    return makeGen(pick(pool.gens));
  };
  const draw = () => {
    const done = isDone(c, L);
    host.innerHTML = `<div class="row"><span class="pill">${st.ok}/4 correct${done?' · complete ✓':''}</span></div><div id="pitem"></div>`;
    if (!st.item) st.item = next();
    const it = st.item;
    renderItem($('#pitem'), it, {done: res => {
      bumpCat(it.cat, res.ok); bumpGen(it.gid, res.ok); if (!res.ok) logMistake(it, res.given);
      st.n++; if (res.ok) st.ok++;
      if (st.ok >= 4 && !isDone(c, L)){ markDone(c, L); toast('Lesson complete ✓'); ln.refreshFoot && ln.refreshFoot(); }
      st.item = null; draw();
    }});
  };
  draw();
}

/* ---------- simulations (interactive trials) ---------- */
const R6 = () => 1 + Math.floor(Math.random() * 6);
const Rn = n => 1 + Math.floor(Math.random() * n);
const SIMS = {
  die: {title:'Roll an n-sided die', controls:[{k:'n', label:'sides n', min:2, max:20, v:6}], kind:'mean', trial: p => Rn(p.n), theory: p => (p.n+1)/2, tlabel: p => `(n+1)/2 = ${fmt((p.n+1)/2)}`},
  distinct: {title:'Distinct faces in k rolls', controls:[{k:'n', label:'sides n', min:2, max:12, v:6},{k:'k', label:'rolls k', min:1, max:20, v:6}], kind:'mean', trial: p => { const s = new Set(); for (let i = 0; i < p.k; i++) s.add(Rn(p.n)); return s.size; }, theory: p => p.n * (1 - ((p.n-1)/p.n) ** p.k), tlabel: p => `n·(1 − ((n−1)/n)^k) = ${fmt(p.n * (1 - ((p.n-1)/p.n) ** p.k), 3)}`},
  waituntil: {title:'Rolls until a value ≥ t', controls:[{k:'n', label:'sides n', min:4, max:20, v:6},{k:'t', label:'target t', min:2, max:20, v:6}], kind:'mean', fix: p => { p.t = Math.min(p.t, p.n); }, trial: p => { let c = 0; for (;;){ c++; if (Rn(p.n) >= p.t) return c; } }, theory: p => p.n / (p.n - p.t + 1), tlabel: p => `1/p = ${p.n}/${p.n-p.t+1} = ${fmt(p.n/(p.n-p.t+1),3)}`},
  pattern: {title:'Flips until a pattern appears', controls:[{k:'pat', label:'pattern', options:['HT','HH','HTH','HHH']}], kind:'mean', trial: p => { let s = '', c = 0; while (!s.endsWith(p.pat)){ s = (s + (Math.random() < .5 ? 'H' : 'T')).slice(-4); c++; } return c; }, theory: p => ({HT:4, HH:6, HTH:10, HHH:14})[p.pat], tlabel: p => `theory ${({HT:4, HH:6, HTH:10, HHH:14})[p.pat]}`},
  coupon: {title:'Rolls to see every face', controls:[{k:'n', label:'sides n', min:2, max:12, v:6}], kind:'mean', trial: p => { const s = new Set(); let c = 0; while (s.size < p.n){ s.add(Rn(p.n)); c++; } return c; }, theory: p => { let h = 0; for (let i = 1; i <= p.n; i++) h += 1/i; return p.n * h; }, tlabel: p => { let h = 0; for (let i = 1; i <= p.n; i++) h += 1/i; return `n·Hₙ = ${fmt(p.n*h,3)}`; }},
  bayes: {title:'Test a random person', controls:[{k:'prev', label:'prevalence %', min:1, max:50, v:1},{k:'sens', label:'sensitivity %', min:50, max:100, v:90},{k:'fpr', label:'false-positive %', min:1, max:30, v:9}], kind:'cond', clabel:'P(sick | positive)', trial: p => { const sick = Math.random() < p.prev/100; const pos = Math.random() < (sick ? p.sens : p.fpr)/100; return pos ? (sick ? 1 : 0) : null; }, theory: p => { const a = p.prev*p.sens, b = (100-p.prev)*p.fpr; return a/(a+b); }, tlabel: p => { const a = p.prev*p.sens, b = (100-p.prev)*p.fpr; return `${fmt(a/100,2)} / (${fmt(a/100,2)} + ${fmt(b/100,2)}) = ${fmt(a/(a+b),3)}`; }},
  monty: {title:'Monty Hall', controls:[{k:'strat', label:'strategy', options:['switch','stay']}], kind:'prob', clabel:'P(win)', trial: p => { const car = Rn(3), pick = Rn(3); return p.strat === 'stay' ? (pick === car ? 1 : 0) : (pick !== car ? 1 : 0); }, theory: p => p.strat === 'stay' ? 1/3 : 2/3, tlabel: p => p.strat === 'stay' ? '1/3' : '2/3'},
  birthday: {title:'Shared birthday in a group', controls:[{k:'n', label:'people n', min:2, max:70, v:23}], kind:'prob', clabel:'P(shared birthday)', trial: p => { const s = new Set(); for (let i = 0; i < p.n; i++){ const b = Rn(365); if (s.has(b)) return 1; s.add(b); } return 0; }, theory: p => { let q = 1; for (let i = 0; i < p.n; i++) q *= (365 - i)/365; return 1 - q; }, tlabel: p => { let q = 1; for (let i = 0; i < p.n; i++) q *= (365 - i)/365; return `1 − ∏(365−i)/365 = ${fmt(1-q,3)}`; }},
  reroll: {title:'Reroll game: keep the first roll if ≥ t', controls:[{k:'t', label:'keep if ≥', min:1, max:7, v:4}], kind:'mean', trial: p => { const a = R6(); return a >= p.t ? a : R6(); }, theory: p => { let e = 0; for (let k = 1; k <= 6; k++) e += k >= p.t ? k/6 : 3.5/6; return e; }, tlabel: p => { let e = 0; for (let k = 1; k <= 6; k++) e += k >= p.t ? k/6 : 3.5/6; return `${fmt(e,4)} (best is 4.25 at t = 4)`; }},
  ruin: {title:'Fair ±1 walk from k until 0 or N', controls:[{k:'k', label:'start k', min:1, max:19, v:3},{k:'N', label:'target N', min:2, max:20, v:10}], kind:'prob', clabel:'P(reach N)', fix: p => { p.k = Math.min(p.k, p.N - 1); }, trial: p => { let x = p.k; while (x > 0 && x < p.N) x += Math.random() < .5 ? 1 : -1; return x === p.N ? 1 : 0; }, theory: p => p.k / p.N, tlabel: p => `k/N = ${p.k}/${p.N} = ${fmt(p.k/p.N,3)}`},
  sumdice: {title:'Sum of k dice', controls:[{k:'k', label:'dice k', min:1, max:10, v:2}], kind:'var', trial: p => { let s = 0; for (let i = 0; i < p.k; i++) s += R6(); return s; }, theory: p => 35*p.k/12, tlabel: p => `Var = 35k/12 = ${fmt(35*p.k/12,3)}, mean = ${3.5*p.k}`},
  mmspread: {title:'Quote 50 ± h; the true value is 50 + (2d6 − 7)', controls:[{k:'h', label:'half-spread h', min:0, max:6, v:2, step:0.5},{k:'inf', label:'informed %', min:0, max:90, v:30}], kind:'mean', clabel:'avg P&L per arrival', hist:false,
    trial: p => { const V = 50 + R6() + R6() - 7, bid = 50 - p.h, ask = 50 + p.h; if (Math.random() < p.inf/100){ if (V > ask) return ask - V; if (V < bid) return V - bid; return 0; } return Math.random() < .5 ? ask - V : V - bid; },
    theory: p => { let e = 0; for (let a = 1; a <= 6; a++) for (let b = 1; b <= 6; b++){ const V = 50 + a + b - 7, bid = 50 - p.h, ask = 50 + p.h; const inf = V > ask ? ask - V : V < bid ? V - bid : 0; const noise = 0.5*(ask - V) + 0.5*(V - bid); e += ((p.inf/100)*inf + (1 - p.inf/100)*noise)/36; } return e; },
    tlabel: p => `exact ${fmt(SIMS.mmspread.theory(p),3)} per arrival`},
};
function mountSim(host, id){
  const S = SIMS[id]; if (!S){ host.innerHTML = ''; return; }
  const saved = store.get('simp', {})[id] || {};
  const p = {}; S.controls.forEach(c => p[c.k] = saved[c.k] ?? (c.options ? c.options[0] : c.v));
  let st;
  const reset = () => { st = {n:0, sum:0, sq:0, hits:0, cn:0, hist:new Map(), trace:[]}; };
  reset();
  host.innerHTML = `<div class="card sim"><b>${esc(S.title)}</b>
    <div class="ctrls">${S.controls.map(c => c.options ? `<label>${esc(c.label)} <select data-k="${c.k}">${c.options.map(o=>`<option ${o===p[c.k]?'selected':''}>${o}</option>`).join('')}</select></label>` : `<label>${esc(c.label)} <b data-v="${c.k}">${p[c.k]}</b><input type="range" data-k="${c.k}" min="${c.min}" max="${c.max}" step="${c.step||1}" value="${p[c.k]}"></label>`).join('')}</div>
    <div class="row" style="gap:6px;flex-wrap:wrap;margin-top:8px"><button class="chip on" data-run="100">Run 100</button><button class="chip on" data-run="1000">1,000</button><button class="chip on" data-run="10000">10,000</button><button class="chip" data-clear>Reset</button></div>
    <div class="simstats"></div><div class="simplot"></div></div>`;
  const statsEl = host.querySelector('.simstats'), plotEl = host.querySelector('.simplot');
  host.querySelectorAll('[data-k]').forEach(inp => inp.oninput = () => { const c = S.controls.find(x => x.k === inp.dataset.k); p[c.k] = c.options ? inp.value : +inp.value; if (S.fix) S.fix(p); host.querySelectorAll('[data-v]').forEach(b => { b.textContent = p[b.dataset.v]; }); host.querySelectorAll('input[type=range]').forEach(r => { r.value = p[r.dataset.k]; }); const sp = store.get('simp', {}); sp[id] = {...p}; store.set('simp', sp); reset(); draw(); });
  host.querySelector('[data-clear]').onclick = () => { reset(); draw(); };
  host.querySelectorAll('[data-run]').forEach(b => b.onclick = () => { const total = +b.dataset.run; let left = total; const chunk = Math.max(20, Math.ceil(total / 25));
    const tick = () => { const m = Math.min(chunk, left); for (let i = 0; i < m; i++) one(); left -= m; draw(); if (left > 0) requestAnimationFrame(tick); else markActive(); }; tick(); });
  if (S.fix) S.fix(p);
  function one(){ const x = S.trial(p); st.n++; if (S.kind === 'cond'){ if (x === null) return; st.cn++; st.hits += x; } else { st.sum += x; st.sq += x*x; if (S.kind === 'prob') st.hits += x; const key = Math.round(x*2)/2; st.hist.set(key, (st.hist.get(key)||0) + 1); } const e = est(); if (e != null && (st.n < 50 || st.n % Math.ceil(st.n/60) === 0)) st.trace.push([st.n, e]); }
  function est(){ if (S.kind === 'cond') return st.cn ? st.hits/st.cn : null; if (!st.n) return null; const m = st.sum/st.n; if (S.kind === 'var') return st.n > 1 ? (st.sq - st.n*m*m)/(st.n - 1) : null; return m; }
  function draw(){
    const th = S.theory(p), e = est();
    const lab = S.clabel || (S.kind === 'var' ? 'sample variance' : S.kind === 'prob' ? 'estimate' : 'average');
    statsEl.innerHTML = `<div class="stat" style="margin-top:10px"><div><b>${st.n.toLocaleString()}</b><span>trials${S.kind==='cond'?` (${st.cn} positive)`:''}</span></div><div><b>${e==null?'—':fmt(e,3)}</b><span>${esc(lab)}</span></div><div><b>${fmt(th,3)}</b><span>theory</span></div></div><p class="small mut" style="margin:8px 0 0">Theory: ${esc(S.tlabel(p))}${e!=null&&st.n>=1000?` · off by ${fmt(Math.abs(e-th),3)}`:''}</p>`;
    let svg = '';
    if (st.trace.length > 1){
      const W = 300, H = 90, xs = st.trace.map(t => Math.log10(t[0])), ys = st.trace.map(t => t[1]).concat([th]);
      const x0 = Math.min(...xs), x1 = Math.max(...xs, x0 + 1), y0 = Math.min(...ys), y1 = Math.max(...ys, y0 + 1e-9);
      const X = v => 4 + (W-8)*(v - x0)/(x1 - x0), Y = v => H - 8 - (H-16)*(v - y0)/(y1 - y0);
      svg += `<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" role="img" aria-label="Estimate converging to theory"><line x1="0" x2="${W}" y1="${Y(th)}" y2="${Y(th)}" stroke="#4ec9a0" stroke-dasharray="4 3"/><path d="${st.trace.map((t,k)=>`${k?'L':'M'}${X(Math.log10(t[0])).toFixed(1)} ${Y(t[1]).toFixed(1)}`).join(' ')}" stroke="#7aa2ff" stroke-width="1.6" fill="none"/><text x="${W-4}" y="${Y(th)-4}" text-anchor="end" font-size="9" fill="#4ec9a0">theory</text><text x="4" y="${H-1}" font-size="9" fill="#6d7585">trials (log scale) →</text></svg>`;
    }
    if (S.kind !== 'cond' && S.kind !== 'prob' && S.hist !== false && st.hist.size){
      const ks = [...st.hist.keys()].sort((a,b)=>a-b); const lo = ks[0], hi = Math.min(ks[ks.length-1], lo + 60); const keys = []; for (let k = lo; k <= hi; k += (ks.some(x=>x%1)?0.5:1)) keys.push(k);
      const mx = Math.max(...keys.map(k => st.hist.get(k)||0)); const W = 300, H = 80, bw = W/keys.length;
      svg += `<svg viewBox="0 0 ${W} ${H+12}" width="100%" height="${H+12}" role="img" aria-label="Histogram of outcomes">${keys.map((k,i)=>{ const h = (H-4)*((st.hist.get(k)||0)/mx); return `<rect x="${(i*bw+1).toFixed(1)}" y="${(H-h).toFixed(1)}" width="${Math.max(1,bw-2).toFixed(1)}" height="${h.toFixed(1)}" fill="#7aa2ff" opacity=".85"/>`; }).join('')}${keys.length<=24?keys.map((k,i)=>`<text x="${(i*bw+bw/2).toFixed(1)}" y="${H+10}" font-size="8" fill="#6d7585" text-anchor="middle">${k}</text>`).join(''):`<text x="0" y="${H+10}" font-size="8" fill="#6d7585">${lo}</text><text x="${W}" y="${H+10}" font-size="8" fill="#6d7585" text-anchor="end">${hi}</text>`}</svg>`;
    }
    plotEl.innerHTML = svg;
  }
  draw();
}

/* ================= tabs ================= */
let cur='learn';
function tab(t){
  if (ts && t!=='tests'){ if (ts.tick) clearInterval(ts.tick); if (ts.kind==='test' && !ts.over){ /* leaving abandons the test */ clearInterval(window._tt); } ts=null; }
  cur=t; kp=null;
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on', b.dataset.tab===(t==='cards'?'train':t)));
  ({learn:renderLearn, train:renderTrain, tests:renderTests, review:renderReview, cards:renderCards, stats:renderStats})[t]();
  window.scrollTo(0,0);
}
document.querySelectorAll('nav button').forEach(b => b.onclick = () => { if (b.dataset.tab==='cards') rv.queue=null; if (b.dataset.tab==='review') rvw.drill=null; if (b.dataset.tab==='learn' && cur==='learn') ln.lesson=null; tab(b.dataset.tab); });
if ('serviceWorker' in navigator && (location.protocol==='https:' || location.hostname==='localhost') && !location.hostname.endsWith('claude.ai') && window.top===window){ navigator.serviceWorker.register('sw.js').catch(()=>{}); }
window.__edge = {GENS, MCB, CARDS, check, makeGen, oaQ, fval, fstr, conceptOf, PRIMERS, CATS, COURSES, practicePool, SIMS, allLessons};
tab('learn');
})();
