@spec {"type":"comb","n":200}
@hint Declare `wire c;` for the carry between the two halves.
@hint `*` is multiplication, not XOR: the sum is `a ^ b ^ cin`.
@end

@chapter procedures | Procedural blocks (combinational)
@lesson always_comb | always @(*)
@body
For more complex logic you can write **procedural** code:

```
reg y;
always @(*) begin
  y = a & b;
end
```

`always @(*)` re-evaluates whenever any input it reads changes, so it describes **combinational** logic, same as `assign`.

Two rules:
- Anything assigned inside an `always` block must be declared `reg` (or `logic`). For outputs: `output reg y`. Despite the name, `reg` does **not** mean a register here.
- In combinational blocks use **blocking** `=`.
@example
module top_module(input a, b, output wire y1, output reg y2);
  assign y1 = a & b;
  always @(*) y2 = a & b;     // same hardware
endmodule
@task
Build an AND gate twice: `out_assign` with an assign statement, and `out_alwaysblock` with an `always @(*)` block.
@starter
module top_module(input a, input b, output out_assign, output out_alwaysblock);

endmodule
@solution
module top_module(input a, input b, output out_assign, output reg out_alwaysblock);
  assign out_assign = a & b;
  always @(*) out_alwaysblock = a & b;
endmodule
@spec {"type":"comb"}
@hint Change the port to `output reg out_alwaysblock`.
@end

@lesson ifmux | if statements make muxes
@body
Inside an always block, `if … else` selects between values: in hardware that's a **multiplexer**.

```
always @(*) begin
  if (sel) y = b;
  else     y = a;
end
```

Equivalent one-liner: `assign y = sel ? b : a;`. Same hardware.

Use `begin … end` when a branch has more than one statement.
@example
module top_module(input sel, input [3:0] a, b, output reg [3:0] y);
  always @(*) begin
    if (sel) y = b;
    else     y = a;
  end
endmodule
@task
Output `b` when **both** `sel_b1` and `sel_b2` are 1, otherwise `a`. Produce it twice: `out_assign` using `?:` and `out_always` using `if`.
@starter
module top_module(input a, b, sel_b1, sel_b2, output out_assign, output reg out_always);

endmodule
@solution
module top_module(input a, b, sel_b1, sel_b2, output out_assign, output reg out_always);
  assign out_assign = (sel_b1 & sel_b2) ? b : a;
  always @(*) begin
    if (sel_b1 & sel_b2) out_always = b;
    else out_always = a;
  end
endmodule
@spec {"type":"comb"}
@hint The condition is `sel_b1 & sel_b2`.
@end

@lesson latches | Avoiding latches
@body
In a combinational block, **every output must be assigned on every path**. If some path doesn't assign `y`, the hardware has to *remember* the old value, and the synthesizer builds a **latch**. Latches are almost always a bug in FPGA designs: they create timing headaches and glitches.

```
always @(*) if (en) y = d;          // latch! (what is y when en = 0?)

always @(*) begin
  y = 1'b0;                          // default first
  if (en) y = d;                     // then override: no latch
end
```

Fix: give every output a **default** at the top of the block, or make sure every `if` has an `else` and every `case` a `default`. Watch the warnings panel: the simulator flags inferred latches.
@example
module top_module(input en, d, output reg y);
  always @(*) begin
    if (en) y = d;    // latch warning: try adding a default
  end
endmodule
@task
The starter code has **latch bugs**. Fix them:
- If the CPU is overheated (`cpu_overheated`), `shut_off_computer = 1`, otherwise 0.
- If you haven't arrived (`~arrived`), keep driving: `keep_driving = ~gas_tank_empty`. If you have arrived, `keep_driving = 0`.
@starter
module top_module(
  input cpu_overheated, output reg shut_off_computer,
  input arrived, input gas_tank_empty, output reg keep_driving
);
  always @(*) begin
    if (cpu_overheated)
      shut_off_computer = 1;
  end

  always @(*) begin
    if (~arrived)
      keep_driving = ~gas_tank_empty;
  end
endmodule
@solution
module top_module(
  input cpu_overheated, output reg shut_off_computer,
  input arrived, input gas_tank_empty, output reg keep_driving
);
  always @(*) begin
    if (cpu_overheated) shut_off_computer = 1;
    else shut_off_computer = 0;
  end

  always @(*) begin
    if (~arrived) keep_driving = ~gas_tank_empty;
    else keep_driving = 0;
  end
endmodule
@wrong
module top_module(
  input cpu_overheated, output reg shut_off_computer,
  input arrived, input gas_tank_empty, output reg keep_driving
);
  always @(*) begin
    if (cpu_overheated) shut_off_computer = 1;
  end
  always @(*) begin
    if (~arrived) keep_driving = ~gas_tank_empty;
  end
endmodule
@spec {"type":"comb","vectors":[{"cpu_overheated":1,"arrived":0,"gas_tank_empty":0},{"cpu_overheated":0,"arrived":0,"gas_tank_empty":1},{"cpu_overheated":1,"arrived":1,"gas_tank_empty":0},{"cpu_overheated":0,"arrived":1,"gas_tank_empty":0},{"cpu_overheated":0,"arrived":0,"gas_tank_empty":0},{"cpu_overheated":1,"arrived":1,"gas_tank_empty":1},{"cpu_overheated":0,"arrived":1,"gas_tank_empty":1},{"cpu_overheated":1,"arrived":0,"gas_tank_empty":1}]}
@hint Add an `else` that assigns 0 to each output.
@end

@lesson case | case statements
@body
`case` picks one branch by comparing a value against labels; it's a wide multiplexer.

```
always @(*) begin
  case (sel)
    2'd0: y = a;
    2'd1: y = b;
    2'd2: y = c;
    default: y = 4'd0;
  endcase
end
```

- No `break`: only the matching branch runs.
- Always include `default` (or cover every value), otherwise you get a latch.
- One label can list several values: `2'd1, 2'd2: y = b;`
@example
module top_module(input [1:0] sel, input [3:0] a, b, c, output reg [3:0] y);
  always @(*) begin
    case (sel)
      2'd0: y = a;
      2'd1: y = b;
      2'd2: y = c;
      default: y = 4'd0;
    endcase
  end
endmodule
@task
A 6-to-1 multiplexer: when `sel` is 0–5 output `data0`…`data5`; for any other `sel` output 0. Data inputs are 4 bits, `sel` is 3 bits.
@starter
module top_module(
  input [2:0] sel,
  input [3:0] data0, data1, data2, data3, data4, data5,
  output reg [3:0] out
);

endmodule
@solution
module top_module(
  input [2:0] sel,
  input [3:0] data0, data1, data2, data3, data4, data5,
  output reg [3:0] out
);
  always @(*) begin
    case (sel)
      3'd0: out = data0;
      3'd1: out = data1;
      3'd2: out = data2;
      3'd3: out = data3;
      3'd4: out = data4;
      3'd5: out = data5;
      default: out = 4'd0;
    endcase
  end
endmodule
@spec {"type":"comb","n":200,"gen":"sel3"}
@hint Six labels plus `default: out = 4'd0;`.
@end

@lesson casez | casez and priority encoders
@body
A **priority encoder** reports the position of the first 1 bit. `casez` lets labels contain `?` (or `z`) meaning **don't care**:

```
casez (in)
  4'b???1: pos = 0;   // bit 0 set: others don't matter
  4'b??10: pos = 1;
  4'b?100: pos = 2;
  4'b1000: pos = 3;
  default: pos = 0;
endcase
```

The **first matching** label wins, so order the labels by priority. (Avoid `casex`: it also treats X values as don't-care and can hide simulation bugs.)
@example
module top_module(input [3:0] in, output reg [1:0] pos);
  always @(*) begin
    casez (in)
      4'b???1: pos = 2'd0;
      4'b??10: pos = 2'd1;
      4'b?100: pos = 2'd2;
      4'b1000: pos = 2'd3;
      default: pos = 2'd0;
    endcase
  end
endmodule
@task
8-bit priority encoder: output the position (0–7) of the **lowest** set bit of `in`. If no bit is set, output 0.
@starter
module top_module(input [7:0] in, output reg [2:0] pos);

endmodule
@solution
module top_module(input [7:0] in, output reg [2:0] pos);
  always @(*) begin
    casez (in)
      8'b???????1: pos = 3'd0;
      8'b??????10: pos = 3'd1;
      8'b?????100: pos = 3'd2;
      8'b????1000: pos = 3'd3;
      8'b???10000: pos = 3'd4;
      8'b??100000: pos = 3'd5;
      8'b?1000000: pos = 3'd6;
      8'b10000000: pos = 3'd7;
      default:     pos = 3'd0;
    endcase
  end
endmodule
@spec {"type":"comb"}
@hint Start from `8'b???????1: pos = 0;` and shift the pattern left each line.
@end

@lesson defaults | Default assignments
@body
When a block has several outputs and only some are set in each branch, the cleanest pattern is: **assign every output a default at the top**, then override in the branches.

```
always @(*) begin
  up = 0; down = 0;          // defaults
  case (code)
    8'h75: up = 1;
    8'h72: down = 1;
  endcase
end
```

No `else` chains, no latches, and adding a new case later is safe.
@example
module top_module(input [1:0] k, output reg a, b);
  always @(*) begin
    a = 0; b = 0;
    case (k)
      2'd1: a = 1;
      2'd2: b = 1;
    endcase
  end
endmodule
@task
Decode a 16-bit keyboard scancode into arrow keys: `16'he06b` → `left`, `16'he072` → `down`, `16'he074` → `right`, `16'he075` → `up`. All other codes: all four outputs 0.
@starter
module top_module(input [15:0] scancode, output reg left, down, right, up);

endmodule
@solution
module top_module(input [15:0] scancode, output reg left, down, right, up);
  always @(*) begin
    left = 0; down = 0; right = 0; up = 0;
    case (scancode)
      16'he06b: left = 1;
      16'he072: down = 1;
      16'he074: right = 1;
      16'he075: up = 1;
    endcase
  end
endmodule
@spec {"type":"comb","n":150,"gen":"scancode"}
@hint Four default assignments at the top of the block, then a case with four labels.
@end

@chapter comb2 | More combinational logic
@lesson ternary | Conditional operator: minimum of four
@body
`c ? x : y` is a 2:1 mux in one expression. Comparisons (`<`, `>`, `==`) give 1 bit, so they fit naturally as conditions.

To combine many values, build a **tree** of small steps with intermediate wires:

```
wire [7:0] m1 = (a < b) ? a : b;
```

(`wire x = expr;` declares and assigns in one line.)
@example
module top_module(input [7:0] a, b, output [7:0] mn, mx);
  assign mn = (a < b) ? a : b;
  assign mx = (a > b) ? a : b;
endmodule
@task
Output the minimum of four unsigned 8-bit numbers `a`, `b`, `c`, `d`.
@starter
module top_module(input [7:0] a, b, c, d, output [7:0] min);

endmodule
@solution
module top_module(input [7:0] a, b, c, d, output [7:0] min);
  wire [7:0] m1 = (a < b) ? a : b;
  wire [7:0] m2 = (c < d) ? c : d;
  assign min = (m1 < m2) ? m1 : m2;
endmodule
@spec {"type":"comb","n":200}
@hint Two pairwise minimums, then the minimum of those.
@end

@lesson overflow | Signed addition and overflow
@body
Adding two 8-bit **two's-complement** numbers gives an 8-bit result that can **overflow**: 100 + 100 = 200, which doesn't fit in −128…127 and wraps to −56.

**Signed overflow** happens when both operands have the same sign but the result's sign is different:

```
assign overflow = (a[7] == b[7]) && (s[7] != a[7]);
```

(The carry-out bit indicates **unsigned** overflow, a different thing.)
@example
module top_module(input [7:0] a, b, output [7:0] s, output cout);
  assign {cout, s} = a + b;   // unsigned carry
endmodule
@task
Add two 8-bit two's-complement numbers. Output the 8-bit sum `s` and `overflow`, which is 1 when a signed overflow occurs.
@starter
module top_module(input [7:0] a, input [7:0] b, output [7:0] s, output overflow);

endmodule
@solution
module top_module(input [7:0] a, input [7:0] b, output [7:0] s, output overflow);
  assign s = a + b;
  assign overflow = (a[7] == b[7]) && (s[7] != a[7]);
endmodule
@wrong
module top_module(input [7:0] a, input [7:0] b, output [7:0] s, output overflow);
  wire c;
  assign {c, s} = a + b;
  assign overflow = c;
endmodule
@spec {"type":"comb","n":250}
@hint Overflow depends only on the three sign bits: `a[7]`, `b[7]`, `s[7]`.
@end

@lesson popcount | Loops: population count
@body
A `for` loop in a combinational block is unrolled at synthesis into parallel hardware. It's a compact way to describe repetitive structure.

```
integer i;
always @(*) begin
  count = 0;                     // default first
  for (i = 0; i < 8; i = i + 1)
    count = count + in[i];
end
```

Here blocking `=` matters: each iteration adds to the value from the previous line. The result is a chain (or tree) of adders, not a loop running over time.
@example
module top_module(input [3:0] in, output reg [2:0] count);
  integer i;
  always @(*) begin
    count = 0;
    for (i = 0; i < 4; i = i + 1)
      count = count + in[i];
  end
endmodule
@task
Count the number of 1 bits in a 16-bit input `in`. Output the count on `out` (5 bits).
@starter
module top_module(input [15:0] in, output reg [4:0] out);

endmodule
@solution
module top_module(input [15:0] in, output reg [4:0] out);
  integer i;
  always @(*) begin
    out = 0;
    for (i = 0; i < 16; i = i + 1)
      out = out + in[i];
  end
endmodule
@spec {"type":"comb","n":200}
@hint Set `out = 0;` before the loop, otherwise you get a latch and a wrong sum.
@end

@chapter seq | Sequential logic
@lesson dff | The D flip-flop
@body
Combinational logic has no memory. **State** lives in flip-flops: on each rising clock edge a flip-flop copies `d` to `q`, and holds it until the next edge.

```
always @(posedge clk)
  q <= d;
```

- `posedge clk`: the block runs only on the clock's rising edge.
- `<=` is a **nonblocking** assignment: every right-hand side in the block is read first, then all the left sides update together. That's exactly how real flip-flops behave. **Always use `<=` in clocked blocks.**

On the waveform, `q` changes only at rising edges of `clk`, one cycle after `d`.
@example
module top_module(input clk, input d, output reg q);
  always @(posedge clk)
    q <= d;
endmodule
@task
Build 8 D flip-flops: on every rising edge of `clk`, `q` takes the value of `d` (both 8 bits).
@starter
module top_module(input clk, input [7:0] d, output [7:0] q);

endmodule
@solution
module top_module(input clk, input [7:0] d, output reg [7:0] q);
  always @(posedge clk) q <= d;
endmodule
@spec {"type":"seq","clk":"clk","cycles":40}
@hint `q` is assigned in an always block, so declare it `output reg [7:0] q`.
@end

@lesson syncreset | Synchronous reset
@body
A **reset** forces registers to a known value. With a **synchronous** reset, it's checked inside the clocked block, so it only takes effect on a clock edge:

```
always @(posedge clk) begin
  if (reset) q <= 8'd0;     // reset has priority
  else       q <= d;
end
```

Reset clears the **register** `q`, not the input `d`. `d` belongs to whoever drives your module.
@example
module top_module(input clk, reset, input [3:0] d, output reg [3:0] q);
  always @(posedge clk)
    if (reset) q <= 4'd0;
    else       q <= d;
endmodule
@task
8 flip-flops with an active-high **synchronous** reset to 0.
@starter
module top_module(input clk, input reset, input [7:0] d, output reg [7:0] q);

endmodule
@solution
module top_module(input clk, input reset, input [7:0] d, output reg [7:0] q);
  always @(posedge clk) begin
    if (reset) q <= 8'd0;
    else q <= d;
  end
endmodule
@spec {"type":"seq","clk":"clk","cycles":80,"reset":{"name":"reset","prob":0.15}}
@hint Inside `always @(posedge clk)`: `if (reset) q <= 0; else q <= d;`
@end

@lesson asyncreset | Asynchronous reset
@body
An **asynchronous** reset acts immediately, without waiting for a clock edge. Add it to the sensitivity list:

```
always @(posedge clk or posedge areset) begin
  if (areset) q <= 0;
  else        q <= d;
end
```

- Edge keywords (`posedge`, `negedge`) appear **only** in the sensitivity list. Inside the block you test the level: `if (areset)`.
- The block must start with the reset check.

On the waveform, compare: an async reset clears `q` in the middle of a cycle; a sync reset waits for the next rising edge.
@example
module top_module(input clk, areset, input [3:0] d, output reg [3:0] q);
  always @(posedge clk or posedge areset)
    if (areset) q <= 4'd0;
    else        q <= d;
endmodule
@task
8 flip-flops with an active-high **asynchronous** reset `areset` to 0.
@starter
module top_module(input clk, input areset, input [7:0] d, output [7:0] q);

endmodule
@solution
module top_module(input clk, input areset, input [7:0] d, output reg [7:0] q);
  always @(posedge clk or posedge areset) begin
    if (areset) q <= 8'd0;
    else q <= d;
  end
endmodule
@wrong
module top_module(input clk, input areset, input [7:0] d, output reg [7:0] q);
  always @(posedge clk) begin
    if (areset) q <= 8'd0;
    else q <= d;
  end
endmodule
@spec {"type":"seq","clk":"clk","cycles":80,"reset":{"name":"areset","prob":0.2}}
@hint `always @(posedge clk or posedge areset)`
@end

@lesson enable | Clock enables
@body
A register that only updates sometimes uses an **enable**:

```
always @(posedge clk)
  if (en) q <= d;      // otherwise q keeps its value
```

Unlike a combinational block, a missing `else` here is fine: a flip-flop holds its value anyway. That's not a latch, it's a flip-flop with an enable.

**Never** gate the clock itself (`assign gclk = clk & en`) in an FPGA design: use an enable. Gated clocks cause skew and glitches.
@example
module top_module(input clk, en, input [3:0] d, output reg [3:0] q);
  always @(posedge clk)
    if (en) q <= d;
endmodule
@task
A 16-bit register with byte enables: on each rising edge, if `byteena[1]` is set, update `q[15:8]` from `d[15:8]`; if `byteena[0]` is set, update `q[7:0]` from `d[7:0]`. Synchronous active-low reset `resetn` clears all 16 bits to 0 (it has priority).
@starter
module top_module(input clk, input resetn, input [1:0] byteena, input [15:0] d, output reg [15:0] q);

endmodule
@solution
module top_module(input clk, input resetn, input [1:0] byteena, input [15:0] d, output reg [15:0] q);
  always @(posedge clk) begin
    if (!resetn) q <= 16'd0;
    else begin
      if (byteena[1]) q[15:8] <= d[15:8];
      if (byteena[0]) q[7:0]  <= d[7:0];
    end
  end
endmodule
@spec {"type":"seq","clk":"clk","cycles":100,"reset":{"name":"resetn","active":0,"prob":0.08}}
@hint Active-low means reset when `resetn == 0`: `if (!resetn)`.
@end

@lesson shift | Shift registers
@body
A shift register moves data along a chain of flip-flops each clock:

```
always @(posedge clk)
  q <= {in, q[3:1]};      // shift right, new bit enters at the top
```

Nonblocking `<=` matters here. Every bit reads the **old** value of its neighbour. With blocking `=`, written in the wrong order, all stages would see the new value at once and the chain would collapse. Shift registers are everywhere: serial links, delay lines, and parsing byte streams.
@example
module top_module(input clk, input in, output reg [3:0] q);
  always @(posedge clk)
    q <= {in, q[3:1]};
endmodule
@task
A 4-bit shift-right register with asynchronous reset `areset` (to 0), synchronous `load` and `ena`:
- `load` = 1: load `data` (load has priority over `ena`)
- else `ena` = 1: shift right, `q[3]` becomes 0
- otherwise hold
@starter
module top_module(input clk, input areset, input load, input ena, input [3:0] data, output reg [3:0] q);

endmodule
@solution
module top_module(input clk, input areset, input load, input ena, input [3:0] data, output reg [3:0] q);
  always @(posedge clk or posedge areset) begin
    if (areset) q <= 4'd0;
    else if (load) q <= data;
    else if (ena) q <= {1'b0, q[3:1]};
  end
endmodule
@spec {"type":"seq","clk":"clk","cycles":120,"reset":{"name":"areset","prob":0.05},"gen":"loadena"}
@hint Priority order: `if (areset) … else if (load) … else if (ena) …`
@end

@lesson counter | Counters
@body
A counter is a register plus an adder feeding back into itself:

```
always @(posedge clk)
  if (reset) q <= 0;
  else       q <= q + 1'b1;
```

A 4-bit counter wraps from 15 to 0 by itself, because the carry is dropped. For any other range, compare and wrap explicitly:

```
else if (q == 4'd9) q <= 0;
```

Counters drive timers, state machines, FIFO pointers and timestamps (like the latency counters in an HFT pipeline).
@example
module top_module(input clk, reset, output reg [3:0] q);
  always @(posedge clk)
    if (reset) q <= 4'd0;
    else       q <= q + 1'b1;
endmodule
@task
A decade counter: counts 0, 1, …, 9, 0, … with an active-high synchronous `reset` to 0.
@starter
module top_module(input clk, input reset, output reg [3:0] q);

endmodule
@solution
module top_module(input clk, input reset, output reg [3:0] q);
  always @(posedge clk) begin
    if (reset || q == 4'd9) q <= 4'd0;
    else q <= q + 1'b1;
  end
endmodule
@wrong
module top_module(input clk, input reset, output reg [3:0] q);
  always @(posedge clk) begin
    if (reset || q == 4'd10) q <= 4'd0;
    else q <= q + 1'b1;
  end
endmodule
@spec {"type":"seq","clk":"clk","cycles":120,"reset":{"name":"reset","prob":0.02}}
@hint Wrap when `q == 9`, not 10.
@end

@lesson edge | Edge detection
@body
To detect a rising edge on a signal, compare it with its value **one clock ago**:

```
reg prev;
always @(posedge clk) prev <= in;
assign rise = in & ~prev;     // was 0, now 1
```

Works bit-by-bit on vectors too. Edge detectors turn levels into one-cycle pulses: "a new message has started", "the button was just pressed".
@example
module top_module(input clk, input in, output rise, fall);
  reg prev;
  always @(posedge clk) prev <= in;
  assign rise = in & ~prev;
  assign fall = ~in & prev;
endmodule
@task
For each bit of an 8-bit input `in`, set the corresponding bit of `pedge` for **one cycle** after a 0→1 transition. `pedge` should be registered: on the clock edge where `in` is seen as 1 and was 0 the cycle before, set the bit.
@starter
module top_module(input clk, input [7:0] in, output reg [7:0] pedge);

endmodule
@solution
module top_module(input clk, input [7:0] in, output reg [7:0] pedge);
  reg [7:0] prev;
  always @(posedge clk) begin
    prev  <= in;
    pedge <= in & ~prev;
  end
endmodule
@spec {"type":"seq","clk":"clk","cycles":120}
@hint Keep a register `prev` with last cycle's `in`. In the same clocked block, `pedge <= in & ~prev;`
@end

@lesson toggle | Feedback: a toggle flip-flop
@body
A flip-flop can feed its own output back. In

```
always @(posedge clk)
  out <= in ^ out;
```

the right-hand side reads the **old** `out`, so `out` flips on every clock where `in` is 1, and holds where `in` is 0. That's a T (toggle) flip-flop.

Without a reset the starting value is unknown in real hardware. This simulator starts registers at 0, but a real design should reset them.
@example
module top_module(input clk, input in, output reg out);
  always @(posedge clk)
    out <= in ^ out;
endmodule
@task
Build the toggle circuit above, but add an active-high synchronous `reset` that clears `out` to 0.
@starter
module top_module(input clk, input reset, input in, output reg out);

endmodule
@solution
module top_module(input clk, input reset, input in, output reg out);
  always @(posedge clk) begin
    if (reset) out <= 1'b0;
    else out <= in ^ out;
  end
endmodule
@spec {"type":"seq","clk":"clk","cycles":80,"reset":{"name":"reset","prob":0.08}}
@hint Don't assign to `in`: it's an input. Only `out` changes.
@end

@chapter fsm | Finite state machines
@lesson fsm1 | Your first FSM
@body
A **finite state machine** is a state register plus logic to compute the next state. Write it in three parts:

```
localparam A = 1'b0, B = 1'b1;
reg state, next;

always @(*) begin              // 1. next-state logic (combinational)
  case (state)
    A: next = in ? A : B;
    B: next = in ? B : A;
    default: next = A;
  endcase
end

always @(posedge clk)          // 2. state register
  if (reset) state <= B;
  else       state <= next;

assign out = (state == B);     // 3. output logic
```

In a **Moore** machine, outputs depend only on the state. In a **Mealy** machine they also depend on the inputs.
@task
Implement the FSM above: a Moore machine with states A and B, synchronous active-high `reset` to **B**. In state B: stay in B if `in` = 1, go to A if `in` = 0. In state A: stay in A if `in` = 1, go to B if `in` = 0. Output `out` = 1 in state B.
@starter
module top_module(input clk, input reset, input in, output out);

endmodule
@solution
module top_module(input clk, input reset, input in, output out);
  localparam A = 1'b0, B = 1'b1;
  reg state, next;
  always @(*) begin
    case (state)
      A: next = in ? A : B;
      B: next = in ? B : A;
      default: next = B;
    endcase
  end
  always @(posedge clk) begin
    if (reset) state <= B;
    else state <= next;
  end
  assign out = (state == B);
endmodule
@spec {"type":"seq","clk":"clk","cycles":100,"reset":{"name":"reset","prob":0.05}}
@hint Copy the three-part structure from the lesson.
@end

@lesson seqdet | Sequence detector
@body
FSMs recognise patterns in a bit stream. To detect `101`, track how much of the pattern you've seen so far:

- `S0` nothing useful yet
- `S1` seen `1`
- `S2` seen `10`
- `S3` seen `101`: the output is 1 here (Moore)

**Overlapping** detection: after `101`, the final `1` can start the next match (`10101` contains two). So from `S3`, a `0` goes to `S2` and a `1` goes to `S1`.

Draw the state diagram on paper first: for each state and each input value, ask "what's the longest suffix of what I've seen that is a prefix of the pattern?"
@task
Moore FSM that sets `out` = 1 for one cycle after the input stream has just completed the pattern `101` (overlapping allowed). Synchronous active-high `reset` returns to the initial state (output 0).
@starter
module top_module(input clk, input reset, input in, output out);

endmodule
@solution
module top_module(input clk, input reset, input in, output out);
  localparam S0 = 2'd0, S1 = 2'd1, S2 = 2'd2, S3 = 2'd3;
  reg [1:0] state, next;
  always @(*) begin
    case (state)
      S0: next = in ? S1 : S0;
      S1: next = in ? S1 : S2;
      S2: next = in ? S3 : S0;
      S3: next = in ? S1 : S2;
      default: next = S0;
    endcase
  end
  always @(posedge clk) begin
    if (reset) state <= S0;
    else state <= next;
  end
  assign out = (state == S3);
endmodule
@wrong
module top_module(input clk, input reset, input in, output out);
  localparam S0 = 2'd0, S1 = 2'd1, S2 = 2'd2, S3 = 2'd3;
  reg [1:0] state, next;
  always @(*) begin
    case (state)
      S0: next = in ? S1 : S0;
      S1: next = in ? S1 : S2;
      S2: next = in ? S3 : S0;
      S3: next = S0;
      default: next = S0;
    endcase
  end
  always @(posedge clk) begin
    if (reset) state <= S0;
    else state <= next;
  end
  assign out = (state == S3);
endmodule
@spec {"type":"seq","clk":"clk","cycles":200,"reset":{"name":"reset","prob":0.02}}
@hint From S3 (just saw 101): on 0 you've seen "10" → S2; on 1 you've seen "1" → S1.
@end

@lesson lemmings | Lemmings: a walker FSM
@body
FSMs model behaviour. A Lemming walks left or right and turns around when it bumps into something:

- `bump_left` → it was walking left, now walks right
- `bump_right` → it was walking right, now walks left
- bumped on both sides at once → it turns around

Asynchronous reset `areset` makes it walk left. Moore outputs: `walk_left`, `walk_right`.

Pattern for async reset in an FSM:

```
always @(posedge clk or posedge areset)
  if (areset) state <= LEFT;
  else        state <= next;
```
@task
Implement the Lemming: two states LEFT and RIGHT, async reset to LEFT. In LEFT, go RIGHT if `bump_left`. In RIGHT, go LEFT if `bump_right`. Outputs `walk_left` = (state is LEFT), `walk_right` = (state is RIGHT).
@starter
module top_module(input clk, input areset, input bump_left, input bump_right, output walk_left, output walk_right);

endmodule
@solution
module top_module(input clk, input areset, input bump_left, input bump_right, output walk_left, output walk_right);
  localparam LEFT = 1'b0, RIGHT = 1'b1;
  reg state, next;
  always @(*) begin
    case (state)
      LEFT:  next = bump_left  ? RIGHT : LEFT;
      RIGHT: next = bump_right ? LEFT  : RIGHT;
      default: next = LEFT;
    endcase
  end
  always @(posedge clk or posedge areset) begin
    if (areset) state <= LEFT;
    else state <= next;
  end
  assign walk_left  = (state == LEFT);
  assign walk_right = (state == RIGHT);
endmodule
@spec {"type":"seq","clk":"clk","cycles":150,"reset":{"name":"areset","prob":0.04}}
@hint In LEFT only `bump_left` matters; in RIGHT only `bump_right`.
@end

@chapter fpga | FPGA design and HFT patterns
@lesson gray | Gray code encoder
@body
Consecutive Gray codes differ in **exactly one bit**. That property is why FIFO pointers are Gray-coded before crossing between clock domains: if the receiving clock samples while the pointer is changing, it gets either the old or the new value, never a corrupted mix.

Binary to Gray is one XOR per bit:

```
assign gray = bin ^ (bin >> 1);
```

Try it in the example and watch only one bit change between neighbouring values.
@example
module top_module(input [3:0] bin, output [3:0] gray);
  assign gray = bin ^ (bin >> 1);
endmodule
@task
Convert an 8-bit binary number to Gray code.
@starter
module top_module(input [7:0] bin, output [7:0] gray);

endmodule
@solution
module top_module(input [7:0] bin, output [7:0] gray);
  assign gray = bin ^ (bin >> 1);
endmodule
@spec {"type":"comb"}
@hint `bin >> 1` shifts in a 0 at the top, so the MSB passes through unchanged.
@end

@lesson gray2bin | Gray code decoder
@body
Going back from Gray to binary is a **prefix XOR from the top**:

- `bin[N-1] = gray[N-1]`
- `bin[i] = bin[i+1] ^ gray[i]`

Equivalently, `bin[i]` is the XOR of all Gray bits from `i` upward: `bin[i] = ^(gray >> i)`. A loop expresses this neatly:

```
integer i;
always @(*)
  for (i = 0; i < 8; i = i + 1)
    bin[i] = ^(gray >> i);
```
@task
Convert an 8-bit Gray code back to binary.
@starter
module top_module(input [7:0] gray, output reg [7:0] bin);

endmodule
@solution
module top_module(input [7:0] gray, output reg [7:0] bin);
  integer i;
  always @(*) begin
    for (i = 0; i < 8; i = i + 1)
      bin[i] = ^(gray >> i);
  end
endmodule
@spec {"type":"comb"}
@hint Bit i of the result is the reduction XOR of `gray >> i`.
@end

@lesson sync2 | Two-flop synchroniser
@body
When a signal comes from **another clock domain** (or the outside world), it can change right at your clock edge. The capturing flop may go **metastable**: its output hovers between 0 and 1 for an unpredictable time.

The standard fix for a **single bit**: pass it through **two flip-flops** in the destination clock. The first may go metastable; the extra cycle lets it settle before any logic uses it.

```
reg s1, s2;
always @(posedge clk) begin
  s1 <= async_in;
  s2 <= s1;
end
```

Rules: the source must come straight from a flop (no glitchy logic), and **never** synchronise a multi-bit bus bit-by-bit (bits can resolve on different cycles). Use Gray code, a handshake, or an async FIFO for buses. In Vivado, mark the flops with `(* ASYNC_REG = "TRUE" *)` so they're placed close together.

(Simulation can't show metastability; it only shows the 2-cycle latency. The safety comes from the structure.)
@task
Synchronise the 1-bit `async_in` into the `clk` domain with two flops, then output `rise`: a one-cycle pulse when the **synchronised** signal goes from 0 to 1. Also output `sync_out` (the second flop). Synchronous active-high `reset` clears all registers.
@starter
module top_module(input clk, input reset, input async_in, output sync_out, output rise);

endmodule
@solution
module top_module(input clk, input reset, input async_in, output sync_out, output rise);
  reg s1, s2, s3;
  always @(posedge clk) begin
    if (reset) begin s1 <= 0; s2 <= 0; s3 <= 0; end
    else begin
      s1 <= async_in;
      s2 <= s1;
      s3 <= s2;
    end
  end
  assign sync_out = s2;
  assign rise = s2 & ~s3;
endmodule
@spec {"type":"seq","clk":"clk","cycles":150,"reset":{"name":"reset","prob":0.03},"gen":"slowbit"}
@hint You need a third flop holding the previous `sync_out` to detect the edge: `rise = s2 & ~s3`.
@end

@lesson pipeline | Pipelining and latency
@body
Long combinational paths limit your clock speed: everything between two registers must settle within one period. **Pipelining** splits a long path with registers:

- more stages → shorter paths → higher f_max
- but each stage adds **one cycle of latency**

In HFT the trade-off is explicit: a design might run at 322 MHz with 6 stages, or 156 MHz with 3. What matters is total nanoseconds, and whether it keeps up with line rate.

Every pipeline stage registers *all* the signals that travel together, so values from the same input stay aligned.
@example
module top_module(input clk, input [7:0] a, b, output reg [8:0] s);
  reg [7:0] ra, rb;
  always @(posedge clk) begin
    ra <= a; rb <= b;      // stage 1: register inputs
    s  <= ra + rb;         // stage 2: add, register result
  end
endmodule
@task
Compute `y = a * b + c` (a, b, c are 8 bits; y is 16 bits) as a **2-stage pipeline**:
- stage 1 registers `a * b` (16 bits) and `c` (delayed so it stays aligned)
- stage 2 registers the sum into `y`

So `y` shows the result for inputs presented two clock edges earlier. No reset needed.
@starter
module top_module(input clk, input [7:0] a, b, c, output reg [15:0] y);

endmodule
@solution
module top_module(input clk, input [7:0] a, b, c, output reg [15:0] y);
  reg [15:0] p;
  reg [7:0] c1;
  always @(posedge clk) begin
    p  <= a * b;
    c1 <= c;
    y  <= p + c1;
  end
endmodule
@wrong
module top_module(input clk, input [7:0] a, b, c, output reg [15:0] y);
  reg [15:0] p;
  always @(posedge clk) begin
    p <= a * b;
    y <= p + c;
  end
endmodule
@spec {"type":"seq","clk":"clk","cycles":80}
@hint `c` must also be delayed one cycle, or it gets added to the wrong product.
@hint `a * b` needs a 16-bit destination: declare `reg [15:0] p;`
@end

@lesson fifo | Synchronous FIFO
@body
A **FIFO** buffers data between a producer and a consumer that run at different rates. In a market-data pipeline, a FIFO absorbs a burst of messages while the order book processes them.

A FIFO of depth 2ᴺ needs:
- a memory `mem`
- a write pointer and a read pointer, each **N+1 bits** wide
- **empty** when the pointers are equal
- **full** when the low N bits are equal and the top bits differ (the writer has lapped the reader)

```
wire empty = (wptr == rptr);
wire full  = (wptr[3] != rptr[3]) && (wptr[2:0] == rptr[2:0]);   // depth 8
```

Only write when not full and only read when not empty. That protects the data.
@task
An 8-deep, 8-bit synchronous FIFO with synchronous active-high `reset` (pointers to 0):
- `wr_en && !full`: write `din` at the write pointer, advance it
- `rd_en && !empty`: advance the read pointer
- `dout` is **combinational**: the word at the read pointer (`mem[rptr[2:0]]`)
- outputs `full`, `empty`, and `count` (number of stored words, 4 bits)
@starter
module top_module(
  input clk, input reset,
  input wr_en, input [7:0] din,
  input rd_en,
  output [7:0] dout,
  output full, output empty,
  output [3:0] count
);

endmodule
@solution
module top_module(
  input clk, input reset,
  input wr_en, input [7:0] din,
  input rd_en,
  output [7:0] dout,
  output full, output empty,
  output [3:0] count
);
  reg [7:0] mem [0:7];
  reg [3:0] wptr, rptr;
  assign empty = (wptr == rptr);
  assign full  = (wptr[3] != rptr[3]) && (wptr[2:0] == rptr[2:0]);
  assign count = wptr - rptr;
  assign dout  = mem[rptr[2:0]];
  always @(posedge clk) begin
    if (reset) begin
      wptr <= 4'd0;
      rptr <= 4'd0;
    end else begin
      if (wr_en && !full) begin
        mem[wptr[2:0]] <= din;
        wptr <= wptr + 1'b1;
      end
      if (rd_en && !empty) rptr <= rptr + 1'b1;
    end
  end
endmodule
@spec {"type":"seq","clk":"clk","cycles":250,"reset":{"name":"reset","prob":0.01},"gen":"fifo"}
@hint `count = wptr - rptr` works because the pointers have one extra bit.
@hint Memory: `reg [7:0] mem [0:7];` and index with `wptr[2:0]`.
@end

@lesson field | Parsing a byte stream
@body
Market data arrives as a stream of bytes. A parser counts bytes from the start of each message and captures fields at fixed offsets. Fields are **big-endian**: the first byte is the most significant.

A first attempt usually looks like this:

```
if (valid) begin
  if (sop) idx <= 1; else idx <= idx + 1;
  if (idx == 2) field[15:8] <= byte_in;
  if (idx == 3) field[7:0]  <= byte_in;
end
```

It looks right, but on the `sop` byte it still tests the **old** `idx`. If the previous message was only 2 bytes long, `idx` is still 2 when the next message's byte 0 arrives, and byte 0 gets captured as if it were byte 2.

The fix is to compute **the index of the byte arriving now** combinationally, and use it for every decision:

```
wire [7:0] cur = sop ? 8'd0 : idx;
```

Bytes only count when `valid` is high; gaps between bytes are allowed. Edge cases like short messages are exactly what real feeds throw at you, and what interviewers ask about.
@task
Bytes arrive on `byte_in` when `valid` = 1. `sop` (start of packet) is high together with byte 0 of each message. Capture bytes **2 and 3** of each message as a big-endian 16-bit `field` (byte 2 is the upper byte). On the clock edge that receives byte 3, also set `field_valid` to 1 for one cycle (it's 0 otherwise). Messages can be as short as 2 bytes; then there is no field and `field_valid` must stay 0. Synchronous `reset` clears `field_valid` and the byte index.
@starter
module top_module(
  input clk, input reset,
  input valid, input sop, input [7:0] byte_in,
  output reg [15:0] field,
  output reg field_valid
);

endmodule
@solution
module top_module(
  input clk, input reset,
  input valid, input sop, input [7:0] byte_in,
  output reg [15:0] field,
  output reg field_valid
);
  reg [7:0] idx;
  wire [7:0] cur = sop ? 8'd0 : idx;
  always @(posedge clk) begin
    if (reset) begin
      idx <= 8'd0;
      field_valid <= 1'b0;
    end else begin
      field_valid <= 1'b0;
      if (valid) begin
        idx <= cur + 8'd1;
        if (cur == 8'd2) field[15:8] <= byte_in;
        if (cur == 8'd3) begin
          field[7:0] <= byte_in;
          field_valid <= 1'b1;
        end
      end
    end
  end
endmodule
@wrong
module top_module(
  input clk, input reset,
  input valid, input sop, input [7:0] byte_in,
  output reg [15:0] field,
  output reg field_valid
);
  reg [7:0] idx;
  always @(posedge clk) begin
    if (reset) begin idx <= 0; field_valid <= 0; end
    else begin
      field_valid <= 0;
      if (valid) begin
        if (sop) idx <= 1; else idx <= idx + 1;
        if (idx == 2) field[15:8] <= byte_in;
        if (idx == 3) begin field[7:0] <= byte_in; field_valid <= 1; end
      end
    end
  end
endmodule
@spec {"type":"seq","clk":"clk","cycles":300,"reset":{"name":"reset","prob":0.0,"cycles":2},"gen":"stream"}
@hint `cur = sop ? 0 : idx` is the index of the byte arriving now. Store `idx <= cur + 1` when `valid`.
@hint Default `field_valid <= 0;` at the top of the else branch, then set it to 1 on byte 3.
@end

@lesson bestbid | Tracking the best price
@body
An order book's **best bid** is the highest price anyone will pay. A minimal version of that logic: keep a register with the maximum price seen, update it when a higher one arrives.

```
always @(posedge clk)
  if (reset) best <= 0;
  else if (valid && price > best) best <= price;
```

A real book also handles cancels and executions (so the best price can go *down*), which needs per-level storage, the kind of structure in your ITCH pipeline project.
@task
Track the best (highest) bid and the best (lowest) ask. Inputs: `valid`, `side` (0 = bid, 1 = ask), `price` (16 bits). Synchronous `reset` sets `best_bid` to 0 and `best_ask` to 16'hFFFF. On a valid bid above `best_bid`, update `best_bid`. On a valid ask below `best_ask`, update `best_ask`. Output `crossed` (combinational) = 1 when `best_bid >= best_ask`.
@starter
module top_module(
  input clk, input reset,
  input valid, input side, input [15:0] price,
  output reg [15:0] best_bid, output reg [15:0] best_ask,
  output crossed
);

endmodule
@solution
module top_module(
  input clk, input reset,
  input valid, input side, input [15:0] price,
  output reg [15:0] best_bid, output reg [15:0] best_ask,
  output crossed
);
  always @(posedge clk) begin
    if (reset) begin
      best_bid <= 16'd0;
      best_ask <= 16'hFFFF;
    end else if (valid) begin
      if (!side && price > best_bid) best_bid <= price;
      if (side && price < best_ask) best_ask <= price;
    end
  end
  assign crossed = (best_bid >= best_ask);
endmodule
@spec {"type":"seq","clk":"clk","cycles":200,"reset":{"name":"reset","prob":0.03},"gen":"book"}
@hint Two separate ifs inside `else if (valid)`, one per side.
@end

</script>
<script type="text/plain" id="course_q">
@chapter ev | Expectation
@lesson ev | Expected value and fair prices
@body
The **expected value** of a random outcome is its long-run average: each value weighted by its probability.

E[die] = (1 + 2 + 3 + 4 + 5 + 6) / 6 = **3.5**

Shortcut: the faces pair up (1+6, 2+5, 3+4 = 7 each), so the mean of a fair n-sided die is **(n+1)/2**.

In trading, expected value is the **fair price** of a bet: if a game pays the face value of a die, a fair price to play is 3.5. Charge more and you profit on average; that gap is your **edge**.

**Try it:** run the simulation a few times. With 100 rolls the average wanders; with 10,000 it hugs the theory line. That's the law of large numbers, and it's why a small edge repeated many times is what trading firms live on.
@sim die
@practice prob:linearity
@end

@lesson linearity | Linearity of expectation
@body
**E[X + Y] = E[X] + E[Y]**, always, even when X and Y are dependent. It's the most useful tool in interview probability.

To find an expected **count**, write it as a sum of **indicator** variables: 1 if something happens, else 0. Then add their probabilities.

**Example:** expected number of distinct faces in k rolls of an n-sided die. Face j appears at least once with probability 1 − ((n−1)/n)ᵏ. There are n faces, so

E[distinct] = n · (1 − ((n−1)/n)ᵏ)

No need to work out the full distribution. Interviewers love this because the "obvious" approach (enumerating cases) is slow and error-prone.

**Try it:** change n and k and check the simulation agrees with the formula.
@sim distinct
@practice prob:linearity
@end

@chapter waiting | Waiting times
@lesson geometric | How long until…? (geometric)
@body
Repeat independent trials that each succeed with probability p. The expected number of trials up to the first success is **1/p**.

Derive it with **first-step analysis**: you always spend one trial; with probability (1 − p) you fail and are back where you started:

E = 1 + (1 − p) · E  ⟹  **E = 1/p**

Rolling until a 6: p = 1/6, so 6 rolls on average. Rolling until you get t or more on an n-sided die: p = (n − t + 1)/n.

The common mistake is writing E = 1 + p·E. The recursion uses the probability of **continuing**.
@sim waituntil
@practice prob:geometric
@end

@lesson patterns | Patterns: why HH takes longer than HT
@body
Expected flips of a fair coin until you see:
- **HT**: 4
- **HH**: 6
- **HHH**: 14 (in general k heads in a row: 2ᵏ⁺¹ − 2)

Why does HH take longer than HT? Both have probability 1/4 at any given spot. But after a failure, HT keeps your progress (you're waiting for H then T; a T after H finishes it, an H after H still leaves you one step away). For HH, a T throws you back to the start.

**States method:** let S = expected flips from scratch, H = expected flips after one head.
- HH: S = 1 + ½H + ½S, H = 1 + ½·0 + ½S → S = 6
- HT: S = 1 + ½H + ½S, H = 1 + ½·0 + ½H → H = 2, S = 4

Patterns that **overlap themselves** take longer.
@sim pattern
@practice prob:geometric
@end

@lesson coupon | Collecting everything (coupon collector)
@body
How many rolls of a die until you've seen all six faces?

Split the wait into stages. When you already have i distinct faces, a new one appears with probability (6 − i)/6, so that stage takes 6/(6 − i) rolls on average (geometric). Add the stages:

6/6 + 6/5 + 6/4 + 6/3 + 6/2 + 6/1 = 6 · (1 + 1/2 + … + 1/6) = **14.7**

In general: **n · Hₙ** where Hₙ = 1 + 1/2 + … + 1/n ≈ ln n + 0.577.

The last face takes the longest (6 rolls on average by itself). Notice the long right tail in the histogram.
@sim coupon
@practice prob:coupon
@end

@chapter cond | Conditional probability
@lesson bayes | Bayes and the false-positive trap
@body
A test for a rare condition (1% of people) is 90% sensitive and has a 9% false-positive rate. You test positive. What's the chance you have it?

Most people say ~90%. The answer is about **9%**.

**Natural frequencies** make it obvious. Picture 10,000 people:
- 100 have it → 90 test positive
- 9,900 don't → 891 test positive
- P(have it | positive) = 90 / (90 + 891) ≈ 9.2%

When the condition is rare, false positives from the huge healthy group swamp the true positives. In trading terms: a signal that is "90% accurate" can still be mostly noise if the event it predicts is rare.

**Try it:** drag the prevalence up and watch P(sick | positive) climb.
@sim bayes
@practice prob:bayes
@end

@lesson condition | Conditioning on information
@body
To find P(A | B) when outcomes are equally likely: **restrict to the outcomes where B is true, then count how many also satisfy A.**

Two dice, "at least one shows a 6": 11 of the 36 outcomes. Only (6,6) is a double six. So P(double six | at least one 6) = **1/11**.

Compare: "the **first** die shows a 6" leaves 6 outcomes, and P(double six) = 1/6. **What exactly you're told** changes the sample space. That's the whole trick behind the boy-girl paradox and Monty Hall.

**Monty Hall:** switching wins whenever your first pick was wrong, which happens 2/3 of the time. Run the simulation to convince yourself.
@sim monty
@practice prob:conditional
@end

@lesson counting | Counting and the birthday problem
@body
- Choose k from n, order irrelevant: C(n, k) = n! / (k!(n−k)!)
- Arrangements of letters with repeats: n! / (a!·b!·…), so BANANA = 6!/(3!·2!) = 60
- Draws without replacement: multiply shrinking fractions. Two aces: (4/52)(3/51) = 1/221

**Birthday problem:** how many people until a shared birthday is more likely than not? Only **23**. The probability all n birthdays differ is

(365/365)·(364/365)·…·((365 − n + 1)/365)

and with 23 people there are C(23,2) = 253 pairs, each a chance to match. Counting **pairs**, not people, is the insight.
@sim birthday
@practice prob:combinatorics
@end

@chapter decisions | Decisions and games
@lesson stopping | Optimal stopping: the reroll game
@body
You roll a die and may either keep the result or reroll once (and must keep the second roll). What's the best strategy, and what's the game worth?

**Work backwards.** If you reroll, you get 3.5 on average. So keep any first roll **above 3.5** (4, 5, 6) and reroll 1–3:

E = ½ · 5 + ½ · 3.5 = **4.25**

With two rerolls, continuing is worth 4.25, so on the first roll keep only 5 or 6: E = 14/3 ≈ 4.67.

**Try it:** slide the "keep if ≥" threshold and see which gives the highest average. The simulation lets you check your intuition, which is how you build it.
@sim reroll
@practice prob:stopping
@end

@lesson ruin | Fair games and gambler's ruin
@body
You start with £k and flip a fair coin, winning or losing £1 each time, stopping at £0 or £N. P(reach N)?

In a **fair** game your expected wealth never changes (a **martingale**). When you stop, you have either 0 or N, so

P(reach N) · N + P(ruin) · 0 = k  ⟹  **P(reach N) = k/N**

No series, no recursion: just a conserved expectation. The expected game length is k(N − k) flips.

The interview lesson: whenever a process is "fair", look for the quantity whose expectation stays constant.
@sim ruin
@practice prob:martingale
@end

@lesson variance | Variance: measuring risk
@body
Two bets can have the same expected value but very different **risk**. Variance measures spread:

Var(X) = E[X²] − E[X]²

- Fair die: E[X²] = 91/6, so Var = 91/6 − 49/4 = **35/12** (sd ≈ 1.71)
- Independent sums: variances **add**. The sum of k dice has variance 35k/12, so sd grows like √k, not k.

That √k is why diversification and repeated small bets work: the average of many independent bets is far less volatile than one big bet. **Try it:** increase k and watch the histogram's shape (and its relative width).
@sim sumdice
@practice prob:variance
@end

@chapter mm | Markets
@lesson fairvalue | Fair value and quoting
@body
A market maker quotes a **bid** (price they'll buy at) and an **ask** (price they'll sell at) around their estimate of **fair value**.

**Fair value = expected settlement given what you know.** If a contract settles at the sum of 5 cards from a deck (A=1 … K=13), before any card is shown each card is worth 364/52 = 7 on average, so fair value is 35. After one card is revealed as a 4: 4 + 4 × (364 − 4)/51 ≈ 32.2.

**Spread width** compensates you for:
- uncertainty (wider early, tighter as information arrives)
- **adverse selection**: some counterparties know more than you
- inventory risk: if you're long, **skew** both quotes down to encourage selling

**Try it:** the simulation shows your average profit per trade against a mix of random ("noise") traders and informed traders. Too tight and the informed traders eat you; too wide and nobody trades.
@sim mmspread
@practice mm:fairvalue
@end

@lesson pnl | Positions and P&L
@body
Track two numbers:
- **Position**: units held (+ long, − short)
- **Cash**: money received minus money paid

Buy q at p: position += q, cash −= q·p. Sell q at p: position −= q, cash += q·p.

**P&L = cash + position × mark price.**

Example: sell 10 at 102 (+1020), buy 9 at 109 (−981). Cash +39, position −1. Mark at 110 → P&L = 39 − 110 = **−71**.

**Edge on a trade** = how much better than fair value you traded. Selling at 54 when fair value is 50 earns 4 per unit of edge, whatever happens to the price afterwards. Over many trades, edge is what you keep; the price noise averages out.
@practice mm:pnl
@end

@lesson options | Options in one page
@body
- **Call**: the right to buy at strike K. Payoff max(S − K, 0).
- **Put**: the right to sell at K. Payoff max(K − S, 0).
- **Put–call parity** (European, r = 0): **C − P = S − K**. A long call plus a short put is the same as owning the stock and owing K. If prices break parity, buy the cheap side and sell the expensive side: arbitrage.
- More **volatility** makes both calls and puts more valuable (more upside, downside capped at zero).
- **Delta** ≈ how much the option moves per unit move in the stock (an at-the-money call ≈ 0.5).
@practice mm:options
@end

@chapter speed | Speed skills
@lesson mental | Mental arithmetic for online assessments
@body
Online assessments like the widely reported Optiver 80-in-8 reward **accuracy under time pressure**. Techniques that save seconds:

- **Near a round number:** 98 × 97 = (100 − 2)(100 − 3) = 10000 − 500 + 6 = 9506
- **Difference of squares:** 47 × 53 = 50² − 3² = 2491
- **Squares ending in 5:** 65² → 6 × 7 = 42, append 25 → 4225
- **×25** = ×100 ÷ 4; **×5** = ×10 ÷ 2; **×9** = ×10 − x
- **Percentages swap:** 8% of 25 = 25% of 8 = 2
- **Decimals:** multiply as integers, then place the point: 0.3 × 0.7 = 0.21
- **Fractions of a number:** divide first: 5/8 of 48 = 6 × 5 = 30

With −1 marking for wrong answers, **skipping beats guessing** unless you're more than 50% sure.
@practice quant:arith
@end

@lesson sequences | Number sequences
@body
A checklist that cracks most "next term" questions:
1. **Differences**: constant → arithmetic; second differences constant → quadratic; differences doubling → geometric part
2. **Ratios**: constant → geometric
3. **Interleaved**: look at odd and even positions separately
4. **Recursive**: sum of previous two, or a·x + b
5. **Alternating operations**: +p, ×q, +p, ×q…
6. **Known families**: squares, cubes, primes, triangular numbers, each possibly ± a constant

Write the differences under the sequence straight away. Most questions fall to step 1 or 3.
@practice quant:seq
@end

</script>
<script type="text/plain" id="course_m">
@chapter m1 | Level 1: SystemVerilog the way the repo uses it
@lesson m1learn | Reading the repo's SystemVerilog
@body
Hardware is a network of gates and flops that all exist at once. A module isn't a function call; it's a block of circuit. Statements describe **wiring**, not steps in time.

### Parameters and ports (`rtl/mdp_fifo.sv`)
```
module mdp_fifo #(
    parameter int W  = 128,
    parameter int AW = 5
) (
    input  logic          clk,
    input  logic          wr_en,
    input  logic [W-1:0]  wr_data,
    output logic [W-1:0]  rd_data,
    output logic          empty,
    output logic [AW:0]   count
);
```
`parameter` is fixed at elaboration. `[W-1:0]` makes widths follow the parameter. Depth is `1 << AW`, and `count` is AW+1 bits so "full" (count = depth) differs from "empty".

### Slicing, and a byte reversal made of wires (`mdp_order_tx.sv`)
- `x[hi:lo]` a fixed slice; `x[base +: w]` w bits **up** from base; `x[base -: w]` w bits **down**.
```
for (int i = 0; i < 60; i++) f_le[8*i +: 8] = f_be[479 - 8*i -: 8];
```
Byte i of the little-endian frame is byte i of the big-endian frame counted from the top: **zero logic**, just wiring.

### Concatenation, casts, reductions
- `{cfg_dst_mac, cfg_src_mac, 16'h0800}` builds an Ethernet header in network order (first byte in the top bits).
- `(AW+1)'(1 << AW)` resizes to AW+1 bits; `64'(win >> 8)` truncates/extends; `$signed(x)` reinterprets.
- `|px_hit` OR of all bits; `&x` AND; `^x` parity.

### Loops in always_comb are copy-paste, not time (`mdp_itch_book.sv`)
```
for (int i = 0; i < N_LVL; i++) begin
    if (mask[{w_sym, 1'b0}][i]) begin   // highest set bit wins
        bid_vld_c = 1'b1;
        bid_lvl_c = LVL_W'(i);
    end
end
```
Later iterations overwrite earlier ones, so the **highest** set i wins: a priority encoder for the best bid. Loop downwards and the **lowest** wins (best ask).

### Generate, elaboration checks, functions, attributes
- `if (ASYNC_CORE != 0) begin : g_mq … end else …` chooses between two circuits at build time.
- `if (AW < 2) begin : g_chk $error("…"); end` stops a bad parameter before synthesis.
- `function automatic logic [AW:0] b2g(input logic [AW:0] b); b2g = (b >> 1) ^ b; endfunction`: binary to Gray, one XOR per bit.
- `(* ram_style = "block" *)`, `(* ASYNC_REG = "TRUE" *)` are hints to Vivado, not logic.

### Pitfalls
- `<=` in `always_ff`, `=` in `always_comb`.
- An incomplete `always_comb` makes a latch. Give every output a default first.
- `a + b` assigned to N bits drops the carry. `count = wp - rp` works **because** it wraps modulo 2^(AW+1).
- Mixing signed and unsigned silently makes everything unsigned.
@practice mdp:L1
@iq Why does the book use for loops in always_comb, and what hardware does that become? || The loop is unrolled at elaboration into parallel logic: a compare chain / priority tree. Later iterations overriding earlier ones builds a priority encoder (highest set bit for the bid, lowest for the ask) with constant latency, no scan.
@iq logic vs wire in SystemVerilog? || logic is a 4-state variable that can be driven by one procedural block or one continuous assign; use it everywhere. wire is for nets with multiple drivers (e.g. tri-state).
@iq Why is count = wp − rp correct even after the pointers wrap? || Both pointers are AW+1 bits and the subtraction is modulo 2^(AW+1), so the difference is the occupancy as long as it never exceeds the depth.
@end

@lesson m1build | Build: best bid / best ask encoder
@body
The book finds the best prices without scanning RAM: an **occupancy mask** has one bit per price level, and a priority encoder picks the right bit in constant time.

- Best **bid** = the **highest** occupied bid level.
- Best **ask** = the **lowest** occupied ask level.
- If a mask is all zero, that side is empty: `vld = 0`.
@task
Inputs `bid_mask[15:0]` and `ask_mask[15:0]` (bit i = level i occupied). Outputs: `bid_vld`, `bid_lvl[3:0]` (highest set bit of bid_mask), `ask_vld`, `ask_lvl[3:0]` (lowest set bit of ask_mask). When a mask is 0, its `vld` is 0 and its level is 0.
@starter
module top_module(
  input [15:0] bid_mask, ask_mask,
  output reg bid_vld, output reg [3:0] bid_lvl,
  output reg ask_vld, output reg [3:0] ask_lvl
);

endmodule
@solution
module top_module(
  input [15:0] bid_mask, ask_mask,
  output reg bid_vld, output reg [3:0] bid_lvl,
  output reg ask_vld, output reg [3:0] ask_lvl
);
  integer i;
  always @(*) begin
    bid_vld = 1'b0; bid_lvl = 4'd0;
    ask_vld = 1'b0; ask_lvl = 4'd0;
    for (i = 0; i < 16; i = i + 1)
      if (bid_mask[i]) begin bid_vld = 1'b1; bid_lvl = i[3:0]; end
    for (i = 15; i >= 0; i = i - 1)
      if (ask_mask[i]) begin ask_vld = 1'b1; ask_lvl = i[3:0]; end
  end
endmodule
@wrong
module top_module(
  input [15:0] bid_mask, ask_mask,
  output reg bid_vld, output reg [3:0] bid_lvl,
  output reg ask_vld, output reg [3:0] ask_lvl
);
  integer i;
  always @(*) begin
    bid_vld = 1'b0; bid_lvl = 4'd0;
    ask_vld = 1'b0; ask_lvl = 4'd0;
    for (i = 0; i < 16; i = i + 1) begin
      if (bid_mask[i]) begin bid_vld = 1'b1; bid_lvl = i; end
      if (ask_mask[i]) begin ask_vld = 1'b1; ask_lvl = i; end
    end
  end
endmodule
@spec {"type":"comb","n":250,"gen":"sparse16"}
@hint Two loops. Upwards for the bid (last match = highest), downwards for the ask (last match = lowest).
@hint Defaults first, so an empty mask gives vld = 0 and no latch.
@end

@chapter m2 | Level 2: Flops, pulses, FSMs
@lesson m2learn | Sequential logic in the repo
@body
A flop copies its input on the clock edge. Everything between two flops must settle within one period: 6.4 ns at 156.25 MHz. The repo uses **synchronous resets** in the datapath, generated by an async-assert / sync-release synchroniser (level 5).

### Pulses: default low, set for one cycle (`mdp_fifo.sv`)
```
always_ff @(posedge clk) begin
    ovf <= 1'b0;                       // default: pulse is low
    if (rst) begin
        wp <= '0;  rp <= '0;
    end else begin
        if (wr_en) begin
            if (full) ovf <= 1'b1;     // overrides the default for one cycle
            else begin
                mem[wp[AW-1:0]] <= wr_data;
                wp <= wp + 1'b1;
            end
        end
        if (rd_en && !empty) rp <= rp + 1'b1;
    end
end
```
All `<=` take effect together at the edge using pre-edge values. Two assignments to one signal: **the last one wins**. `'0` = all zeros at the right width.

### Accumulators (`mdp_lat_stats.sv`)
```
end else if (valid) begin
    o_valid <= 1'b1;  o_lat <= lat;  s_last <= lat;
    if (lat < s_min) s_min <= lat;
    if (lat > s_max) s_max <= lat;
    s_sum   <= s_sum + 64'(lat);
    s_cnt   <= s_cnt + 32'd1;
end
```
`s_min` resets to all ones (`'1`) so the first sample always wins. `64'(lat)` widens so the sum doesn't wrap. This 40-bit subtract → 40-bit compare is the path that limited Fmax at 250 MHz in run 04.

### The book's FSM (`mdp_itch_book.sv`)
| State | Work (one clock each) |
|---|---|
| IDLE/BT | accept the message, issue the order-table read |
| D1 | normalise: type, length, side, watchlist, price offset, tag compare |
| D2 | price → level, delta maths; unknown types / bad lengths leave here |
| RD | final accept/drop decision; issue the level-RAM read |
| WR | update level RAM, occupancy mask, order table |
| BT | best bid/ask + trigger (overlaps the next accept) |

A replace runs RD/WR twice. Back-to-back Adds are accepted every 5 cycles. Why so many states? Each state's logic must fit in one clock: the **latency vs frequency trade-off**.

### Edge-armed trigger
```
if (cond_c && !fired[w_sym]) begin ord_valid <= 1'b1; fired[w_sym] <= 1'b1; end
else if (!cond_c)            fired[w_sym] <= 1'b0;
```
Fires once when the condition becomes true; re-arms only when it goes false. Without `fired`, every book update while the condition holds would send another order.

### Pitfalls
- Reading a value you wrote in the same cycle gives the **old** value.
- A pulse with no default stays high forever.
- An FSM with no reset or no `default`.
- Counters wrap silently.
@practice mdp:L2
@iq Why synchronous reset in the datapath? || It maps onto the flops' synchronous set/reset or the logic in front of them, and avoids async reset recovery/removal timing analysis. Async assert / sync release is used only where reset is generated.
@iq Why does a wide clock enable hurt timing? || It's a high-fanout net: one signal driving every flop's CE. In run 04 at 4.5 ns a 52-load control signal into the framer's wleft enables was on the worst path.
@iq Why is the book split into six states instead of fewer? || Each state's logic has to fit in one clock period. Merging D1/D2/RD would save cycles but lengthen paths and lower Fmax; it's the latency vs frequency trade-off, and changing it needs Vivado evidence.
@end

@lesson m2build | Build: the edge-armed trigger
@body
The trigger sends **one** order when a symbol's condition becomes true, then waits for the condition to go false before it can fire again: one `fired` bit per symbol.
@task
Inputs: `upd` (a book update happens this cycle), `sym[1:0]`, `cond` (the trigger condition for that symbol, valid when `upd` = 1). On each clock edge with `upd` = 1: if `cond` and `!fired[sym]`, pulse `ord` (for one cycle) and set `fired[sym]`; else if `!cond`, clear `fired[sym]`. `ord` is 0 on every other cycle. Synchronous `rst` clears `ord` and all four `fired` bits. Also output `ord_sym[1:0]`, the symbol of the last order (registered when `ord` fires).
@starter
module top_module(
  input clk, input rst,
  input upd, input [1:0] sym, input cond,
  output reg ord, output reg [1:0] ord_sym
);

endmodule
@solution
module top_module(
  input clk, input rst,
  input upd, input [1:0] sym, input cond,
  output reg ord, output reg [1:0] ord_sym
);
  reg [3:0] fired;
  always @(posedge clk) begin
    ord <= 1'b0;
    if (rst) begin
      fired <= 4'd0;
      ord_sym <= 2'd0;
    end else if (upd) begin
      if (cond && !fired[sym]) begin
        ord <= 1'b1;
        ord_sym <= sym;
        fired[sym] <= 1'b1;
      end else if (!cond) begin
        fired[sym] <= 1'b0;
      end
    end
  end
endmodule
@wrong
module top_module(
  input clk, input rst,
  input upd, input [1:0] sym, input cond,
  output reg ord, output reg [1:0] ord_sym
);
  reg fired;
  always @(posedge clk) begin
    ord <= 1'b0;
    if (rst) begin
      fired <= 1'b0;
      ord_sym <= 2'd0;
    end else if (upd) begin
      if (cond && !fired) begin
        ord <= 1'b1;
        ord_sym <= sym;
        fired <= 1'b1;
      end else if (!cond) fired <= 1'b0;
    end
  end
endmodule
@spec {"type":"seq","clk":"clk","cycles":250,"reset":{"name":"rst","prob":0.01},"gen":"symtrig"}
@hint `reg [3:0] fired;` and index it with `sym`.
@hint `ord <= 1'b0;` as the first line makes it a one-cycle pulse.
@end

@chapter m3 | Level 3: Memories and inference
@lesson m3learn | LUTRAM, block RAM and the single-write-port lesson
@body
Xilinx 7-series has three places to keep arrays:
- **Flops**: fast, any number of ports, expensive. The 128-bit occupancy mask lives here.
- **Distributed RAM (LUTRAM)**: built from LUTs, **asynchronous read**. Cheap when small; a big one becomes a wide LUT mux tree.
- **Block RAM**: dedicated, **registered read** (data one clock after the address), large clock-to-out (~1.8 ns here), at most two ports.

You don't instantiate them: you write code **shaped like** one and the tool infers it.

- `assign rd_data = mem[rp[AW-1:0]];` combinational read → LUTRAM. The FIFO does this on purpose: first-word-fall-through needs the data in the same cycle.
- Registered read + one write port → block RAM candidate:
```
(* ram_style = "block" *) logic [OW-1:0] ord_mem [0:(1<<ORD_AW)-1];
```
Entry = `{valid, tag(64−ORD_AW), sym, side, level, remaining(32)}` = 1 + 54 + 2 + 1 + 6 + 32 = **96 bits × 1024**.

### The story the repo tells
| Run | Change | Result |
|---|---|---|
| 01 | async-read memories | book 7,308 LUTs; table as LUTRAM; read address fanned out to 144 loads → 1024:1 mux; WNS −0.545 ns at 250 MHz |
| 02 | added ram_style = "block" | ignored: 0 BRAMs, 4,448 LUTRAMs (and invalid: ASYNC_CORE=1 left set) |
| 03 | one write port per memory | BRAM used; book 7,308 → 1,701 LUTs; **no Fmax gain** |

Observed: the attribute was ignored while the memory had **two write processes** (init sweep + normal write); block RAM appeared once there was one. The fix was architectural:
```
wire              ord_wr_en   = init_busy | ord_we;
wire [ORD_AW-1:0] ord_wr_addr = init_busy ? init_cnt : ord_waddr;
wire [OW-1:0]     ord_wr_data = init_busy ? '0       : ord_wdata;
always_ff @(posedge clk) begin
    ord_q <= ord_mem[ord_raddr];                        // registered read
    if (ord_wr_en) ord_mem[ord_wr_addr] <= ord_wr_data; // the ONLY write
end
```
Lessons: **write RTL in the shape of the primitive**, and **lower area doesn't imply higher Fmax**.

The table is **read-first** (a same-cycle write returns old data); the testbench relies on it, and a pipelined book would need forwarding.

### Pitfalls
- Assuming `ram_style` always wins. Read RAMB36/RAMB18 vs LUTRAM counts.
- Async read in the datapath puts a LUTRAM mux on the critical path.
- A one-cycle read latency reshapes the FSM: the book issues the read the cycle **before** it needs the data.
- Initial contents: the book clears both RAMs with an `init_cnt` sweep after reset (`ready` goes high at the end).
@practice mdp:L3
@iq Why did adding ram_style = "block" do nothing in run 02? || The memory had two write processes (the init clear and the normal write); block RAM wasn't inferred until both were merged into one port. Run 02 was also invalid because ASYNC_CORE=1 had been left set, so it built a different design.
@iq Why can area shrink 4× without Fmax improving? || Fmax is set by the worst path. Removing the LUTRAM mux exposed the next path (BRAM clock-to-out → 32-bit add → mask), which was already almost as slow.
@iq Why is the FIFO deliberately LUTRAM? || It's first-word-fall-through: rd_data must show the head in the same cycle, which needs an asynchronous read.
@end

@lesson m3build | Build: one write port with an init sweep
@body
Block RAM can't be cleared by reset. The book clears its RAMs with a counter that sweeps every address after reset, **through the same write port** as normal writes, so the tool can still infer block RAM.
@task
A 16 × 8 memory with a registered (read-first) read port.
- Reset `rst` (synchronous) sets `busy` and `icnt = 0`.
- While `busy`: each clock writes 0 to address `icnt`, increments `icnt`, and clears `busy` on the edge that writes address 15. Normal writes (`we`) are ignored while busy.
- Otherwise: if `we`, write `wdata` to `waddr`.
- Every clock: `rdata <= mem[raddr]` (old data if the same address is written that cycle).
- `ready = !busy`.

Use **one** write statement (select address/data/enable with `busy`).
@starter
module top_module(
  input clk, input rst,
  input we, input [3:0] waddr, input [7:0] wdata,
  input [3:0] raddr,
  output reg [7:0] rdata,
  output ready
);

endmodule
@solution
module top_module(
  input clk, input rst,
  input we, input [3:0] waddr, input [7:0] wdata,
  input [3:0] raddr,
  output reg [7:0] rdata,
  output ready
);
  reg [7:0] mem [0:15];
  reg [3:0] icnt;
  reg busy;
  wire       wr_en = busy | we;
  wire [3:0] wa    = busy ? icnt : waddr;
  wire [7:0] wd    = busy ? 8'd0 : wdata;
  always @(posedge clk) begin
    if (rst) begin
      busy <= 1'b1;
      icnt <= 4'd0;
    end else if (busy) begin
      icnt <= icnt + 1'b1;
      if (icnt == 4'd15) busy <= 1'b0;
    end
  end
  always @(posedge clk) begin
    rdata <= mem[raddr];
    if (wr_en) mem[wa] <= wd;
  end
  assign ready = !busy;
endmodule
@wrong
module top_module(
  input clk, input rst,
  input we, input [3:0] waddr, input [7:0] wdata,
  input [3:0] raddr,
  output reg [7:0] rdata,
  output ready
);
  reg [7:0] mem [0:15];
  reg [3:0] icnt;
  reg busy;
  always @(posedge clk) begin
    if (rst) begin
      busy <= 1'b1;
      icnt <= 4'd0;
    end else if (busy) begin
      icnt <= icnt + 1'b1;
      if (icnt == 4'd15) busy <= 1'b0;
    end
  end
  always @(posedge clk) begin
    rdata <= mem[raddr];
    if (busy) mem[icnt] <= 8'd0;
    else if (we) mem[waddr] <= wdata;
    if (we) mem[waddr] <= wdata;
  end
  assign ready = !busy;
endmodule
@spec {"type":"seq","clk":"clk","cycles":300,"reset":{"name":"rst","prob":0.006},"gen":"ramsweep"}
@hint Compute `wr_en`, `wa` and `wd` with `busy ? … : …`, then a single `if (wr_en) mem[wa] <= wd;`
@hint The busy/icnt logic goes in its own clocked block (or the same one); reset only touches busy and icnt.
@end

@chapter m4 | Level 4: AXI-Stream and realignment
@lesson m4learn | Byte lanes, endianness and the 128-bit window
@body
- AXI-Stream here: `tdata[63:0]`, `tkeep[7:0]` (valid lanes), `tvalid`, `tlast`. **No `tready`**: the exchange can't be paused, so overflow is counted, not prevented.
- 64 bits × 156.25 MHz = **10 Gb/s exactly**: one beat per clock at line rate.
- **Lane order**: frame byte 0 is `tdata[7:0]` (little-endian lanes). **Network order** is big-endian within fields. The repo stores a message with byte 0 at the **top** of its vector.
- Frames aren't multiples of 8: the 60-byte order frame is 7.5 beats, so the last `tkeep = 8'h0F`.

### Building the order frame (`mdp_order_tx.sv`)
```
wire [479:0] f_be = {cfg_dst_mac, cfg_src_mac, 16'h0800, 8'h45, 8'h00, 16'h002C, ...,
                     8'h4F, 8'h42, o_sym, cid, o_px, o_qty, 16'h0000};
for (int i = 0; i < 60; i++) f_le[8*i +: 8] = f_be[479 - 8*i -: 8];
```
Beats are shifted out with `frame_q[{beat, 6'd0} +: 64]` (`{beat, 6'd0}` = beat × 64). **Real bug:** the frame register was 480 bits but beat 7 read bits 448–511 → X on the last beat. Widened to 512.

### Realigning messages (`mdp_itch_unit.sv`)
Eth 14 + IPv4 20 + UDP 8 + MoldUDP64 20 = **62**, so the first block starts at lane 6 of beat 7. Blocks are `[2-byte length][body]` with **no padding**, so a body can start on any lane and straddle two beats.
```
wire [127:0] win  = {cur, prv};
wire [63:0]  sh   = 64'(win >> {r, 3'b000});          // rotate right by r lanes
wire [63:0]  word = {sh[7:0], sh[15:8], sh[23:16], sh[31:24],
                     sh[39:32], sh[47:40], sh[55:48], sh[63:56]};  // byte-reverse
```
One aligned big-endian word per beat, no extra latency. Words go to fixed positions (`msg[319-64k -: 64]`) so message byte 0 is always `msg[319:312]`. The tracker `nb_q` in `mdp_itch_frame` holds a signed distance to the end of the newest block and raises `end_ev` in the beat holding its last byte. **Two units alternate** because a short block can end in the same beat the next starts.

### Pitfalls
- Off-by-one lane maths: byte i is beat i/8, lane i%8.
- Mixing little-endian lanes with big-endian fields (that's what the `word` reversal fixes).
- Declaring a block complete before its last byte truly arrived.
- Treating lanes with `tkeep = 0` as valid.
@practice mdp:L4
@iq Why a 128-bit window instead of shifting a 64-bit register? || A block can straddle two beats; you need both the previous and current beat to produce one aligned word per clock without adding latency.
@iq What costs more, the byte-reverse or the rotate? || The byte-reverse is pure wiring (free). The variable rotate is a barrel shifter: a mux tree in LUTs.
@iq Why do two realignment units alternate? || A short block can end in the same beat the next one starts, so one unit finishes the old block while the other loads the new one.
@end

@lesson m4build | Build: the lane aligner
@body
This is the heart of the framer: take the previous and current beats, rotate by the start lane `r`, and byte-reverse so message byte 0 lands in the most significant byte.
@task
Inputs `prv[63:0]`, `cur[63:0]` (beats, lane 0 = bits [7:0]) and `r[2:0]`. Output `word[63:0]`: the 8 bytes starting at lane `r` of `prv` (continuing into `cur`), in **wire order with the first byte as the MSB**. That is: `win = {cur, prv}`, `sh = low 64 bits of (win >> 8r)`, `word` = byte-reverse of `sh`.
@starter
module top_module(input [63:0] prv, input [63:0] cur, input [2:0] r, output [63:0] word);

endmodule
@solution
module top_module(input [63:0] prv, input [63:0] cur, input [2:0] r, output [63:0] word);
  wire [127:0] win = {cur, prv};
  wire [127:0] shw = win >> {r, 3'b000};
  wire [63:0]  sh  = shw[63:0];
  assign word = {sh[7:0], sh[15:8], sh[23:16], sh[31:24], sh[39:32], sh[47:40], sh[55:48], sh[63:56]};
endmodule
@wrong
module top_module(input [63:0] prv, input [63:0] cur, input [2:0] r, output [63:0] word);
  wire [127:0] win = {cur, prv};
  wire [127:0] shw = win >> {r, 3'b000};
  assign word = shw[63:0];
endmodule
@spec {"type":"comb","n":200}
@hint `{r, 3'b000}` is r × 8: the shift in bits.
@hint Shift into a 128-bit wire, then take `[63:0]`, then reverse the 8 bytes with a concatenation.
@end

@chapter m5 | Level 5: FIFOs, CDC, reset
@lesson m5learn | FIFOs, crossings and the Gray async FIFO
@body
- **Occupancy** = wp − rp, with pointers one bit wider than the address so full differs from empty.
- **First-word-fall-through**: `rd_data` already shows the head when `!empty`; `rd_en` consumes it.
- **No back-pressure**: when full, a write is dropped and `ovf` pulses; a counter keeps the total. Data may be lost, but **never silently**.
- **Bypass**: when the FIFO is empty and the consumer is ready, skip it. An ITCH-lite bypass bug was a mutation survivor, closed by `test_order_storm`.

### Why CDC is hard
Two unrelated clocks: a flop sampling a changing signal can go **metastable**. You can't prevent it, only make escape negligible with a second flop (MTBF grows exponentially with settling time). Rules:
1. Only 1-bit signals or **Gray-coded** buses go through synchronisers. A binary bus can arrive half-updated: 0111 → 1000 read as 1111.
2. Gray changes one bit per increment, so a sample is the old or new pointer, never garbage.

### Gray async FIFO (`mdp_async_fifo.sv`, Cummings style)
```
wire [AW:0] wbin_n  = wbin + (AW+1)'(do_wr);
wire [AW:0] wgray_n = b2g(wbin_n);
mdp_sync2 #(.W(AW+1)) u_r2w (.clk(wclk), .d(rgray_r), .q(rgray_w));
wfull  <= (wgray_n == {~rgray_w[AW:AW-1], rgray_w[AW-2:0]});   // top two bits inverted
rempty <= (rgray_n == wgray_r);
```
- Each side compares its **next** pointer with the synchronised other pointer and registers the flag, so flags are **conservative**: they may clear late but never report space or data that isn't there.
- Data bits aren't synchronised: a word is read only after its pointer has crossed.
- `wrst`/`rrst` must be asserted together.

### Synchroniser and its simulation model (`mdp_sync2.sv`)
Synthesis: `(* ASYNC_REG = "TRUE" *) logic [W-1:0] s1, s2;`. Simulation never goes metastable, so with `MDP_CDC_SIM` any bit that changed within 1 ns of the edge resolves randomly: Gray pointers survive, binary ones fail. `test_cdc_model_exercised` asserts the model was actually hit. It models the **logic** of the crossing, not physical MTBF.

### Reset synchroniser (`mdp_rst_sync.sv`)
```
(* ASYNC_REG = "TRUE" *) logic [1:0] q;
always_ff @(posedge clk or posedge arst) begin
    if (arst) q <= 2'b11;
    else      q <= {q[0], 1'b0};
end
assign rst_o = q[1];
```
Asserts instantly; releases on that domain's clock, two cycles after the input falls. One copy per domain.

### Pitfalls
- Synchronising a multi-bit binary value; resetting one side only.
- CDC tests where both clocks are identical (the repo sweeps 4000/5000/6400/6401/7000/9000/3333 ps).
- A core clock slower than the network clock: messages queue; the test checks `ign + ovf == msgs`.
- Quasi-static config is not synchronised bit by bit: change it only while traffic is quiet (an explicit, documented trade-off).
@practice mdp:L5
@iq Why must wfull be computed from the NEXT Gray pointer? || So the flag, which is registered, is correct on the cycle the write happens; using the current pointer would make it one write late and allow an overflow.
@iq What does ASYNC_REG do and not do? || It places the synchroniser flops together and tags them for CDC analysis. It does not make a bad crossing (e.g. a binary bus) safe.
@iq Why dual-clock FIFOs in a trading design at all, and what do they cost? || The MAC receive clock comes from the transceiver and the core may run at a different (faster) clock. Every crossing costs latency: here about 20–25 ns across two crossings, simulated.
@end

@lesson m5build | Build: the reset synchroniser
@body
Every clock domain needs its own reset that **asserts immediately** but **releases synchronously**, so no flop sees reset released right at its clock edge.
@task
Input `arst` (asynchronous, active high). Output `rst_o`. Two flops: on `arst` both go to 1 immediately; otherwise on each rising edge shift in a 0 (`q <= {q[0], 1'b0}`). `rst_o = q[1]`.
@starter
module top_module(input clk, input arst, output rst_o);

endmodule
@solution
module top_module(input clk, input arst, output rst_o);
  reg [1:0] q;
  always @(posedge clk or posedge arst) begin
    if (arst) q <= 2'b11;
    else q <= {q[0], 1'b0};
  end
  assign rst_o = q[1];
endmodule
@wrong
module top_module(input clk, input arst, output rst_o);
  reg [1:0] q;
  always @(posedge clk) begin
    if (arst) q <= 2'b11;
    else q <= {q[0], 1'b0};
  end
  assign rst_o = q[1];
endmodule
@spec {"type":"seq","clk":"clk","cycles":150,"reset":{"name":"arst","prob":0.08}}
@hint `always @(posedge clk or posedge arst)` and `if (arst)` first.
@end

@chapter m6 | Level 6: Ethernet, MoldUDP64, ITCH 5.0
@lesson m6learn | Protocols on the wire
@body
```
Ethernet 14 | IPv4 20 | UDP 8 | MoldUDP64 header 20 | [len(2) | ITCH message] × count
 0..13        14..33    34..41   42..61                 first block at byte 62
```
- **Ethernet**: dst MAC 6, src MAC 6, ethertype 2 (`0x0800` = IPv4). The FCS is handled by the MAC.
- **IPv4** (IHL 5): first byte `0x45`, protocol at byte 23 (17 = UDP). The order frame's static header checksum is supplied as `cfg_ip_csum` (one's-complement sum of 16-bit words).
- **UDP**: destination port at bytes 36–37; checksum 0 is legal for IPv4.
- **MoldUDP64**: session (10 B, offset 42), **sequence** of the first message (8 B, offset 52), **count** (2 B, offset 60). Count 0 = heartbeat; 0xFFFF = end of session.

### Sequence rules (`mdp_itch_frame`, `model/itch50.py`, C++ baseline)
- First packet sets `expected = seq`.
- `seq > expected`: **gap**, counted; resync. Detected, **not recovered** (that needs a retransmission channel).
- Message i has sequence `seq + i`; below `expected` → **duplicate**, skipped.
- Block length < 12 or running past the frame → **truncation**; the rest of the frame is abandoned.
```
if (seq + i < expected_) { k.dups++; continue; }
expected_ = seq + i + 1;
k.msgs++;
```
The hardware splits the 64-bit sequence compare over **two pipeline stages** so it's not one long path.

### ITCH 5.0 messages used (big-endian, byte offsets)
| Type | Message | Len | Fields |
|---|---|---|---|
| A | Add | 36 | ref 11..18, side 19, shares 20..23, stock 24..31, price 32..35 |
| F | Add + MPID | 40 | as A |
| E | Executed | 31 | ref 11..18, shares 19..22 |
| C | Executed w/ price | 36 | ref 11..18, shares 19..22 |
| X | Cancel | 23 | ref 11..18, shares 19..22 |
| D | Delete | 19 | ref 11..18 |
| U | Replace | 35 | old ref 11..18, new ref 19..26, shares 27..30, price 31..34 |

Price has 4 implied decimals; `TICK = 100` = $0.01. A wrong length for a known type is `BAD_LEN`; an unknown type is ignored (counted).

### Drop reasons, in precedence order
`BAD_LEN, BAD_SIDE, NOT_WATCHED, BAD_PRICE, BAD_QTY, COLLISION / DUP_REF, UNK_REF`. A message with two faults reports the first. Stock names are 8 bytes, space-padded; duplicate watchlist entries: lowest index wins. BAD_PRICE: below base, off-tick, or ≥ 64 ticks above base, and `px − base` must not be allowed to **wrap** (`test_base_near_top_of_range`).
@practice mdp:L6
@iq How does a feed handler recover from a gap? || A retransmission request or snapshot channel. This design only detects and counts gaps; recovery needs a request path to the exchange's rerequest server.
