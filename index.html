/* ================= SRS ================= */
let srs = store.get('srs', {});
const DAY = 864e5;
function nextState(s, g){
  s = s ? {...s} : {i:0, e:2.5, r:0, l:0};
  if (g===0){ s.r=0; s.l++; s.e=Math.max(1.3,s.e-0.2); s.i=0; s.d=Date.now()+60e3; return s; }
  if (g===1){ s.i = s.r===0 ? 1 : Math.max(1, s.i*1.2); s.e=Math.max(1.3,s.e-0.15); }
  if (g===2){ s.i = s.r===0 ? 1 : s.r===1 ? 3 : s.i*s.e; }
  if (g===3){ s.i = s.r===0 ? 3 : s.r===1 ? 5 : s.i*s.e*1.3; s.e+=0.15; }
  s.r++; s.d = Date.now() + s.i*DAY; return s;
}
function ivLabel(s){ if (!s.i) return '1m'; const d=s.i; if (d<30) return Math.round(d)+'d'; if (d<365) return (d/30).toFixed(1).replace('.0','')+'mo'; return (d/365).toFixed(1)+'y'; }
function newToday(){ const n=store.get('newday',{d:'',c:0}); return n.d===today() ? n.c : 0; }
function bumpNew(){ store.set('newday', {d:today(), c:newToday()+1}); }
function gradeCard(c, g){ if (!srs[c.id]) bumpNew(); srs[c.id]=nextState(srs[c.id],g); store.set('srs',srs); const log=store.get('revlog',{}); log[today()]=(log[today()]||0)+1; store.set('revlog',log); markActive(); }
const settings = Object.assign({newPerDay:20, sprintSecs:120, groups:['quant','fpga','cs'], autoNext:false, focus:false}, store.get('settings', {}));

/* ================= answer checking ================= */
function parseNum(s){
  s = s.trim().replace(/\s+/g,'').replace(/,/g,'').replace(/−/g,'-');
  if (!s) return NaN;
  let pct=false; if (s.endsWith('%')){ pct=true; s=s.slice(0,-1); }
  const m = s.match(/^(-?[\d.]+)\/(-?[\d.]+)$/);
  let v = m ? parseFloat(m[1])/parseFloat(m[2]) : (/^-?(\d+\.?\d*|\.\d+)$/.test(s) ? parseFloat(s) : NaN);
  return pct ? v/100 : v;
}
function check(it, input){
  if (it.type==='str'){ const n = x => x.trim().toLowerCase().replace(/^0x/,'').replace(/^0+(?=.)/,''); return it.accept.some(a => n(a)===n(input)); }
  const v=parseNum(input), t=fval(it.f); if (!isFinite(v)) return false;
  return Math.abs(v-t) <= Math.max(1e-9, Math.abs(t)*0.01);
}
const answerText = it => it.type==='str' ? it.show : it.type==='mc' ? it.opts[0] : fstr(it.f);
function bumpCat(cat, ok){ const s=store.get('cstat',{}); const c=s[cat]||{n:0,ok:0}; c.n++; if (ok) c.ok++; s[cat]=c; store.set('cstat',s); markActive(); }

/* ================= keypad ================= */
const KEYS = {
  num: ['7','8','9','⌫','4','5','6','/','1','2','3','.','-','0','%','✓'],
  hex: ['7','8','9','A','⌫','4','5','6','B','C','1','2','3','D','E','0','F','✓'],
  bin: ['0','1','⌫','✓'],
};
let kp = null;   // {get,set,submit}
function keypadHTML(mode){ return `<div class="kp k-${mode}">${KEYS[mode].map(k=>`<button type="button" data-k="${k}" class="${k==='✓'?'kok':k==='⌫'?'kdel':''}">${k==='-'?'−':k}</button>`).join('')}</div>`; }
function kpPress(k){ if (!kp) return; if (k==='✓') return kp.submit(); let v=kp.get(); if (k==='⌫') v=v.slice(0,-1); else if (v.length<16) v+=k; kp.set(v); }
function bindKeypad(root, handlers){ kp = handlers; root.querySelectorAll('[data-k]').forEach(b => b.addEventListener('pointerdown', e => { e.preventDefault(); kpPress(b.dataset.k); })); }
document.addEventListener('keydown', e => {
  if (!kp || e.target.tagName==='TEXTAREA' || (e.target.tagName==='INPUT' && e.target.type!=='hidden')) return;
  const k=e.key;
  if (k==='Enter'){ e.preventDefault(); kpPress('✓'); }
  else if (k==='Backspace'){ e.preventDefault(); kpPress('⌫'); }
  else if (/^[0-9.\/%\-]$/.test(k) || /^[a-fA-F]$/.test(k)) kpPress(k.toUpperCase());
});

/* ================= item renderer ================= */
// opts: {test:bool, done(result)}  result: {ok, given, skipped}
function renderItem(box, it, opts){
  kp = null;
  const tag = `<span class="tag">${esc(CATS[it.cat]?CATS[it.cat].t:it.cat)}${it.card ? ' · card' : ''}</span>`;
  if (it.type==='card'){
    const c=it.card, s=srs[c.id];
    box.innerHTML = `<div class="card">${tag}<div class="q">${md(c.q)}</div><div id="cardA"></div></div>`;
    const showA = () => {
      const prev=[0,1,2,3].map(g=>ivLabel(nextState(s,g)));
      $('#cardA').innerHTML = `<div class="a">${md(c.a)}</div><div class="grades"><button class="g0" data-g="0">Again<small>${prev[0]}</small></button><button class="g1" data-g="1">Hard<small>${prev[1]}</small></button><button class="g2" data-g="2">Good<small>${prev[2]}</small></button><button class="g3" data-g="3">Easy<small>${prev[3]}</small></button></div>`;
      const pr = PRIMERS[conceptOf(it)];
      if (pr){ $('#cardA').insertAdjacentHTML('beforeend', `<div id="deep"></div><button class="chip" id="lm" style="margin-top:10px">Learn: ${esc(pr.title)}</button>`); $('#lm').onclick = () => { $('#lm').remove(); $('#deep').innerHTML = primerHTML(pr); }; }
      box.querySelectorAll('[data-g]').forEach(b => b.onclick = () => { const g=+b.dataset.g; gradeCard(c,g); if (g===0 && !it.retryKey) logMistake(it, ''); opts.done({ok:g>=2, card:true}); });
      kp = {get:()=>'', set:()=>{}, submit:()=>{ gradeCard(c,2); opts.done({ok:true, card:true}); }};
    };
    box.querySelector('.card').insertAdjacentHTML('beforeend', `<button class="big" id="reveal">Show answer</button>`);
    $('#reveal').onclick = () => { $('#reveal').remove(); showA(); };
    kp = {get:()=>'', set:()=>{}, submit:()=>{ const r=$('#reveal'); if (r){ r.remove(); showA(); } }};
    return;
  }
  if (it.type==='mc'){
    const order = shuffle(it.opts.map((o,i)=>({o,i})));
    box.innerHTML = `<div class="card">${tag}<div class="q">${qh(it.q)}</div><div class="mc">${order.map(x=>`<button data-i="${x.i}">${md(x.o)}</button>`).join('')}</div>${opts.test?`<button class="big ghost" id="skipq">Skip</button>`:''}<div id="fb"></div></div>`;
    let done=false;
    box.querySelectorAll('.mc button').forEach(b => b.onclick = () => {
      if (done) return; done=true; const ok = b.dataset.i==='0';
      if (opts.test) return opts.done({ok, given:it.opts[+b.dataset.i]});
      b.classList.add(ok?'right':'wrong'); box.querySelector('.mc button[data-i="0"]').classList.add('right');
      feedback(box, it, ok, it.opts[+b.dataset.i], opts);
    });
    const sk=$('#skipq'); if (sk) sk.onclick = () => { if (!done){ done=true; opts.done({ok:false, skipped:true}); } };
    kp = null; return;
  }
  const mode = it.type==='str' ? (it.kp||'hex') : 'num';
  box.innerHTML = `<div class="card">${tag}<div class="q">${qh(it.q)}</div>
    <div class="disp" id="disp"><span class="ph">${mode==='num'?'answer (e.g. 17/4)':'answer'}</span></div>
    <div id="fb"></div><div id="kpw">${keypadHTML(mode)}</div>
    <div class="row" style="margin-top:8px"><button class="chip grow" id="skipq">${opts.test?'Skip':'Show answer'}</button></div></div>`;
  let val='', done=false;
  const disp=$('#disp');
  const set = v => { val=v; disp.innerHTML = v ? esc(v.replace(/-/g,'−')) : `<span class="ph">${mode==='num'?'answer (e.g. 17/4)':'answer'}</span>`; };
  const finish = (skipped) => {
    if (done) return; done=true;
    const ok = !skipped && check(it, val);
    if (opts.test) return opts.done({ok, given:val, skipped});
    $('#kpw').remove(); $('#skipq').parentElement.remove();
    feedback(box, it, ok, skipped ? '' : val, opts);
  };
  bindKeypad(box, {get:()=>val, set, submit:()=>{ if (val) finish(false); }});
  $('#skipq').onclick = () => finish(true);
}
function feedback(box, it, ok, given, opts){
  const fb = box.querySelector('#fb');
  const pr = PRIMERS[conceptOf(it)];
  fb.innerHTML = `<div class="fb ${ok?'ok':'no'}"><b>${ok?'Correct.':'Not quite.'}</b> Answer: <b>${md(answerText(it))}</b>${!ok&&given?` (you: ${esc(given)})`:''}${it.why?`<div class="why">${md(it.why)}</div>`:''}</div>
    <div id="deep"></div>
    <div class="row" style="gap:8px;margin-top:12px">${pr?`<button class="big ghost grow" id="lm" style="margin-top:0">Learn: ${esc(pr.title)}</button>`:''}<button class="big grow" id="nextq" style="margin-top:0">Next</button></div>`;
  let t=null; const go = () => { clearTimeout(t); opts.done({ok, given}); };
  $('#nextq').onclick = go;
  if (pr) $('#lm').onclick = () => { clearTimeout(t); $('#lm').remove(); $('#deep').innerHTML = primerHTML(pr); };
  if (ok && settings.autoNext) t = setTimeout(go, 1500);
  kp = {get:()=>'', set:()=>{}, submit:go};
}

/* ================= primers (offline study guides) ================= */
const PRIMERS = {};
(function(){ let cur=null; for (const ln of $('#primers').textContent.split('\n')){ if (ln.startsWith('@p ')){ const [id,title]=ln.slice(3).split('|').map(x=>x.trim()); cur=PRIMERS[id]={id,title,body:''}; } else if (cur) cur.body+=ln+'\n'; } })();
function mdLong(s){
  return String(s).trim().split('```').map((p,i) => {
    if (i % 2) return '<pre><code>' + esc(p.replace(/^[a-z]*\n/,'').replace(/\n$/,'')) + '</code></pre>';
    return esc(p).split('\n').map(l => {
      let h = l.replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>');
      if (/^\s*[-*]\s/.test(l)) return `<div class="li2">• ${h.replace(/^\s*[-*]\s/,'')}</div>`;
      if (/^\s*\d+\.\s/.test(l)) return `<div class="li2">${h}</div>`;
      return h.trim() ? `<p>${h}</p>` : '';
    }).join('');
  }).join('');
}
const primerHTML = pr => `<div class="deep"><div class="dh">${esc(pr.title)}</div>${mdLong(pr.body)}</div>`;
const plain = s => String(s||'').replace(/<br>/g,' ').replace(/<[^>]+>/g,'');
function conceptOf(it){
  const q = plain(it.type==='card' ? it.card.q+' '+it.card.a : it.q+' '+(it.why||'')), c = it.cat;
  const R = (re) => re.test(q);
  if (c==='arith') return 'mental';
  if (c==='seq') return 'sequences';
  if (c==='prob'){
    if (R(/prevalence|test is positive|Bayes|positive/i)) return 'bayes';
    if (R(/given that|at least one is a boy|Given/i)) return 'conditional';
    if (R(/every face|all six faces|coupon/i)) return 'coupon';
    if (R(/reroll|optimal|stopping/i)) return 'stopping';
    if (R(/coin game|reach £|ruin|martingale/i)) return 'martingale';
    if (R(/variance|Var/i)) return 'variance';
    if (R(/larger|maximum|max|Uniform|minimum/i)) return 'orderstats';
    if (R(/until|first head|first 6|in a row|first success/i)) return 'geometric';
    if (R(/exactly \d+ heads|at least one/i)) return 'binomial';
    if (R(/arrange|committee|choose|without replacement|urn|Draw 2|aces|flush/i)) return 'combinatorics';
    return 'linearity';
  }
  if (c==='mm'){ if (R(/parity|call|put|volatility|delta|theta|straddle|option/i)) return 'options'; if (R(/Trades:|P&L|position|long|short|edge/i)) return 'pnl'; return 'fairvalue'; }
  if (c==='bits'){ if (R(/Gray/i)) return 'gray'; if (R(/two's complement|signed|negative/i)) return 'twos'; if (R(/MHz|ns|period|cycles/i)) return 'clocks'; return 'hexbin'; }
  if (c==='verilog'){ if (R(/<=|blocking|posedge clk\) begin/)) return 'blocking'; if (R(/latch|always|reg|wire|reset|FSM|Mealy|Moore|handshake|skid|LFSR/i)) return R(/<=|=\s/) && R(/blocking/i) ? 'blocking' : 'widths'; return 'widths'; }
  if (c==='logic'){ if (R(/adder|overflow|Cout|carry/i)) return 'adders'; if (R(/x & \(x|x & -x|power of two/i)) return 'bittricks'; return 'boolean'; }
  if (c==='timing'){ if (R(/FIFO/i) && R(/depth|burst/i)) return 'fifo'; if (R(/slack|f_max|setup|hold|path|fanout|retim|pipelin|skew/i)) return 'setup'; if (R(/Gb\/s|counter|pipeline|latency|bus/i)) return 'clocks'; return 'cdc'; }
  if (c==='arch') return 'fabric';
  if (c==='net') return 'ethernet';
  if (c==='cs'){ if (R(/sizeof\(struct|struct S|struct \{/)) return 'struct'; if (R(/x & \(x|x & -x|uint8_t y|int8_t/)) return 'bittricks'; if (R(/endian/i)) return 'endian'; return 'cs'; }
  return null;
}

/* ================= mistakes log ================= */
const SESSION = Date.now().toString(36);
let mistakes = store.get('mistakes', []);
function snap(it){ const o={type:it.type, cat:it.cat, gid:it.gid||null, q:it.q, why:it.why||''}; if (it.type==='num') o.f=it.f; if (it.type==='str'){ o.accept=it.accept; o.show=it.show; o.kp=it.kp; } if (it.type==='mc') o.opts=it.opts; if (it.type==='card'){ o.cid=it.card.id; o.q=''; } return o; }
function unsnap(m){ const it={...m.it}; if (it.type==='card'){ const c=CARDS.find(x=>x.id===it.cid); if (!c) return null; it.card=c; } return it; }
function logMistake(it, given){
  const s=snap(it); const key=hash(JSON.stringify([s.type,s.q,s.cid||'']));
  const ex=mistakes.find(m=>m.key===key && !m.fixed);
  if (ex){ ex.n++; ex.t=Date.now(); ex.given=given||''; ex.sess=SESSION; }
  else mistakes.push({key, it:s, given:given||'', t:Date.now(), n:1, sess:SESSION, fixed:false, streak:0});
  mistakes = mistakes.slice(-600); store.set('mistakes', mistakes);
}
function retryResult(m, ok){ if (ok){ m.streak=(m.streak||0)+1; if (m.streak>=2) m.fixed=true; } else { m.streak=0; m.n++; } m.t=Date.now(); store.set('mistakes', mistakes); }
function bumpGen(gid, ok){ if (!gid) return; const s=store.get('gstat',{}); const g=s[gid]||{n:0,ok:0}; g.n++; if (ok) g.ok++; s[gid]=g; store.set('gstat',s); }

/* ================= item pools ================= */
const groupOf = cat => CATS[cat] ? CATS[cat].g : 'mine';
function makeGen(g){ for (let i=0;i<5;i++){ try { const it=g.make(); if (it && (it.type!=='num' || (it.f && isFinite(fval(it.f))))) return {...it, cat:g.cat, gid:g.gid}; } catch(e){} } return null; }
function cardPool(cats){ const now=Date.now(); return CARDS.filter(c => cats.has(c.cat) && (!srs[c.id] || srs[c.id].d<=now)); }
function weight(stat, base=1){ if (!settings.focus || !stat || stat.n<3) return base; return base * (0.15 + 3*(1 - stat.ok/stat.n)) + 0.1; }
function wpick(arr, wf){ const ws=arr.map(wf); let t=ws.reduce((a,b)=>a+b,0)*Math.random(); for (let i=0;i<arr.length;i++){ t-=ws[i]; if (t<=0) return arr[i]; } return arr[arr.length-1]; }
function nextMixed(groups){
  const cats = new Set(Object.keys(CATS).filter(c => groups.includes(groupOf(c))));
  if (CARDS.some(c=>c.cat==='mine')) cats.add('mine');
  const r = Math.random();
  const open = mistakes.filter(m=>!m.fixed && cats.has(m.it.cat) && Date.now()-m.t > 90e3);
  if (settings.focus && open.length && r < 0.2){ const m=pick(open); const it=unsnap(m); if (it) return {...it, retryKey:m.key}; }
  const cards = cardPool(cats);
  if (r > 0.8 && cards.length){ const c = pick(cards); return {type:'card', card:c, cat:c.cat}; }
  const cs = store.get('cstat',{}), gs = store.get('gstat',{});
  const catList = [...cats].filter(c => c!=='mine');
  const cat = wpick(catList, c => weight(cs[c]));
  const gens = GENS.filter(g=>g.cat===cat), mcs = MCB.filter(m=>m.cat===cat);
  if ((Math.random() < 0.35 || !gens.length) && mcs.length) return {...pick(mcs)};
  if (gens.length){ const it = makeGen(wpick(gens, g => weight(gs[g.gid]))); if (it) return it; }
  return mcs.length ? {...pick(mcs)} : nextMixed(groups);
}

/* ================= TRAIN (endless mixed feed) ================= */
let tr = {item:null, n:0, ok:0, streak:0, best:0, wrong:0};
function renderTrain(){
  const gs = settings.groups;
  app.innerHTML = `<div class="row"><h1 class="grow">Train</h1><span class="pill">${tr.ok}/${tr.n} · streak ${tr.streak}</span></div>
    <p class="sub">Endless shuffled mix, generated on your phone.${tr.wrong?` <a href="#" id="gorev">${tr.wrong} to review this session →</a>`:''}</p>
    <div class="chips">${Object.entries(GROUPS).map(([k,t])=>`<button class="chip ${gs.includes(k)?'on':''}" data-grp="${k}">${t}</button>`).join('')}<button class="chip ${settings.focus?'on':''}" id="focus">🎯 Weak spots</button></div>
    <div id="itm"></div>`;
  app.querySelectorAll('[data-grp]').forEach(b => b.onclick = () => {
    const k=b.dataset.grp; let g=settings.groups.includes(k) ? settings.groups.filter(x=>x!==k) : [...settings.groups, k];
    if (!g.length) return toast('Keep at least one on'); settings.groups=g; store.set('settings',settings); tr.item=null; renderTrain();
  });
  $('#focus').onclick = () => { settings.focus=!settings.focus; store.set('settings',settings); toast(settings.focus?'Weak spots: your worst topics and past mistakes come up more':'Weak spots off: even mix'); tr.item=null; renderTrain(); };
  const gr=$('#gorev'); if (gr) gr.onclick = e => { e.preventDefault(); rvw.view='session'; tab('review'); };
  if (!tr.item) tr.item = nextMixed(settings.groups);
  const it = tr.item;
  renderItem($('#itm'), it, {done: res => {
    if (it.retryKey){ const m=mistakes.find(x=>x.key===it.retryKey); if (m) retryResult(m, res.ok); }
    else if (!res.ok){ logMistake(it, res.given); tr.wrong++; }
    if (!res.card){ bumpCat(it.cat, res.ok); bumpGen(it.gid, res.ok); }
    tr.n++; if (res.ok){ tr.ok++; tr.streak++; tr.best=Math.max(tr.best,tr.streak); } else tr.streak=0;
    tr.item=null; if (cur==='train') renderTrain();
  }});
}

  fpga: {title:'FPGA technical', sub:'25 questions in 25 minutes: Verilog analysis, Boolean logic, timing/CDC, architecture, C/CS, networking.', n:25, secs:1500, make:()=>{ const cats=['verilog','logic','timing','arch','bits','net','cs']; const cat=pick(cats); const gs=GENS.filter(g=>g.cat===cat), ms=MCB.filter(m=>m.cat===cat); return (Math.random()<.5 && ms.length) || !gs.length ? {...pick(ms)} : makeGen(pick(gs)); }},
};

function renderTests(){

    ${row('prob','P','#7aa2ff','Probability & EV',PRESETS.prob.sub, best('prob')!=null?`Best ${best('prob')}/12`:'')}
    ${row('fpga','RTL','#4ec9a0','FPGA technical',PRESETS.fpga.sub, best('fpga')!=null?`Best ${best('fpga')}/25`:'')}
    ${row('mm','$','#b48cff','Market-making game','Quote a market on a hidden card sum while cards are revealed. Some counterparties know the answer.', mm.length?`Games ${mm.length} · avg P&L ${fmt(mm.reduce((a,g)=>a+g.pnl,0)/mm.length,1)}`:'')}
    <p class="sub" style="margin-top:14px">Formats follow candidate reports (e.g. Optiver's widely reported 80-in-8). Firms change their tests, so treat these as practice, not a replica.</p>`;
  app.querySelectorAll('[data-t]').forEach(b => b.onclick = () => { const t=b.dataset.t; if (t==='sprint') startSprint(); else if (t==='mm') startMM(); else startTest(t); });
}
function startTest(k){ const p=PRESETS[k]; ts={kind:'test', key:k, p, i:0, score:0, right:0, wrong:0, skip:0, end:Date.now()+p.secs*1000, log:[], over:false}; ts.item=p.make(0); renderTestQ(); startTimer(); }
function startTimer(){ clearInterval(window._tt); window._tt = setInterval(() => { if (!ts || ts.kind!=='test' || ts.over) return clearInterval(window._tt); const left=Math.max(0,Math.ceil((ts.end-Date.now())/1000)); const el=$('#tm'); if (el) el.textContent=`${Math.floor(left/60)}:${String(left%60).padStart(2,'0')}`; if (left<=0) endTest(); }, 250); }
function renderTestQ(){
  const p=ts.p;
  app.innerHTML = `<div class="row"><h1 class="grow">${p.title}</h1><span class="timer" id="tm"></span></div>
    <p class="sub">Q ${ts.i+1}/${p.n} · ${p.pm?`score ${ts.score}`:`${ts.right} right`} <button class="chip" id="quit" style="float:right">End</button></p><div id="itm"></div>`;
  $('#quit').onclick = endTest;
  renderItem($('#itm'), ts.item, {test:true, done: res => {
    const it=ts.item; ts.log.push({it, ...res});
    if (res.skipped) ts.skip++; else if (res.ok){ ts.right++; ts.score++; } else { ts.wrong++; if (p.pm) ts.score--; }
    bumpCat(it.cat, res.ok); bumpGen(it.gid, res.ok); if (!res.ok) logMistake(it, res.skipped?'(skipped)':res.given);
    ts.i++; if (ts.i>=p.n || Date.now()>=ts.end) return endTest();
    ts.item=p.make(ts.i); renderTestQ();
  }});
}
function endTest(){
  if (!ts || ts.over) return; ts.over=true; clearInterval(window._tt); kp=null;
  const th=store.get('tests',{}); (th[ts.key]=th[ts.key]||[]).push({d:today(), score:ts.p.pm?ts.score:ts.right, n:ts.i, right:ts.right, wrong:ts.wrong, secs:Math.round((ts.p.secs*1000-(ts.end-Date.now()))/1000)}); th[ts.key]=th[ts.key].slice(-100); store.set('tests',th);
  renderTestEnd();
}
function renderTestEnd(){
  const p=ts.p, miss=ts.log.filter(x=>!x.ok);
  app.innerHTML = `<h1>${p.title}: done</h1>
    <div class="stat"><div><b>${p.pm?ts.score:ts.right}</b><span>${p.pm?'score':'correct'}</span></div><div><b>${ts.wrong}</b><span>wrong</span></div><div><b>${ts.skip + (p.n-ts.i)}</b><span>skipped/unseen</span></div></div>
    ${miss.length?`<h2>Review your misses</h2>${miss.map(x=>`<div class="card small"><div>${x.it.type==='card'?md(x.it.card.q):qh(x.it.q)}</div><div class="a">Answer: <b>${md(answerText(x.it))}</b>${x.given?` · you: ${esc(x.given)}`:x.skipped?' · skipped':''}${x.it.why?`<br><span class="mut">${md(x.it.why)}</span>`:''}</div>${PRIMERS[conceptOf(x.it)]?`<div class="pslot"></div><button class="chip" data-pr="${conceptOf(x.it)}" style="margin-top:10px">Learn: ${esc(PRIMERS[conceptOf(x.it)].title)}</button>`:''}</div>`).join('')}`:'<p class="sub">No mistakes. Raise the bar: go faster next time.</p>'}
    <button class="big" id="again">Go again</button><button class="big ghost" id="back">Back to tests</button>`;
  $('#again').onclick = () => startTest(ts.key); $('#back').onclick = () => { ts=null; renderTests(); };
  app.querySelectorAll('[data-pr]').forEach(b => b.onclick = () => { b.previousElementSibling.innerHTML = primerHTML(PRIMERS[b.dataset.pr]); b.remove(); });
}

/* ---- Zetamac sprint ---- */
function sprintQ(){ const op=rnd(0,3); if (op===0){const a=rnd(2,100),b=rnd(2,100); return {t:`${a} + ${b}`,a:a+b};} if (op===1){const a=rnd(2,100),b=rnd(2,100); return {t:`${a+b} − ${a}`,a:b};} if (op===2){const a=rnd(2,12),b=rnd(2,100); return Math.random()<.5?{t:`${a} × ${b}`,a:a*b}:{t:`${b} × ${a}`,a:a*b};} const a=rnd(2,12),b=rnd(2,100); return {t:`${a*b} ÷ ${a}`,a:b}; }
function startSprint(){ ts={kind:'sprint', score:0, end:Date.now()+settings.sprintSecs*1000, q:sprintQ(), over:false, val:''}; renderSprint(); }
function renderSprint(){
  if (ts.over){ const h=store.get('sprints',[]), best=h.reduce((m,s)=>Math.max(m,s.score),0); kp=null;
    app.innerHTML = `<h1>Sprint over</h1><div class="card" style="text-align:center"><div class="mut">Score</div><div class="sprint-q">${ts.score}</div><div class="mut small">Best ${best} · last 5: ${h.slice(-5).map(s=>s.score).join(', ')}</div><button class="big" id="again">Go again</button><button class="big ghost" id="back">Back</button></div>`;
    $('#again').onclick=startSprint; $('#back').onclick=()=>{ts=null; renderTests();}; return; }
  app.innerHTML = `<div class="row"><h1 class="grow">Sprint</h1><span class="timer" id="tm"></span></div><p class="sub">Score <b id="sc">${ts.score}</b> · answers submit automatically <button class="chip" id="quit" style="float:right">Quit</button></p>
    <div class="card"><div class="sprint-q" id="sq">${ts.q.t}</div><div class="disp" id="disp"></div>${keypadHTML('num')}</div>`;
  const disp=$('#disp');
  bindKeypad(app, {get:()=>ts.val, set:v=>{ ts.val=v.replace(/[^0-9]/g,''); disp.textContent=ts.val; if (ts.val!=='' && +ts.val===ts.q.a){ ts.score++; ts.q=sprintQ(); ts.val=''; $('#sq').textContent=ts.q.t; $('#sc').textContent=ts.score; disp.textContent=''; } }, submit:()=>{ ts.val=''; disp.textContent=''; }});
  $('#quit').onclick = () => { clearInterval(ts.tick); ts=null; kp=null; renderTests(); };
  const upd = () => { if (!ts || ts.kind!=='sprint' || ts.over) return; const left=Math.max(0,Math.ceil((ts.end-Date.now())/1000)); const tm=$('#tm'); if (tm) tm.textContent=left+'s';
    if (left<=0){ clearInterval(ts.tick); ts.over=true; const h=store.get('sprints',[]); h.push({d:today(), score:ts.score, secs:settings.sprintSecs}); store.set('sprints',h.slice(-300)); markActive(); renderSprint(); } };
  clearInterval(ts.tick); ts.tick=setInterval(upd,200); upd();
}

/* ---- market-making game ---- */
const CARDNAME = v => ({1:'A',11:'J',12:'Q',13:'K'})[v] || String(v);
const MAXSPREAD = [10,8,6,4];
function startMM(){
  const deck=shuffle([...Array(52)].map((_,i)=>i%13+1)); const hand=deck.slice(0,5);
  ts={kind:'mm', hand, sum:hand.reduce((a,b)=>a+b,0), round:0, pos:0, cash:0, hist:[], field:'bid', bid:'', ask:'', over:false, msg:''}; renderMM();
}
const mmFair = (hand, r) => { const s=hand.slice(0,r).reduce((a,b)=>a+b,0); return s + (5-r)*(364-s)/(52-r); };
function renderMM(){
  const g=ts, r=g.round;
  if (g.over){ kp=null;
    const pnl=g.cash+g.pos*g.sum; const err=g.hist.reduce((a,h)=>a+Math.abs(h.mid-h.fair),0)/g.hist.length;
    app.innerHTML = `<h1>Settlement</h1><div class="card"><div class="cards">${g.hand.map(v=>`<span class="pc">${CARDNAME(v)}</span>`).join('')}</div>
      <p>Sum = <b>${g.sum}</b>. Final position ${g.pos>0?'+':''}${g.pos}, cash ${g.cash}.</p>
      <div class="stat"><div><b style="color:${pnl>=0?'var(--good)':'var(--bad)'}">${pnl>0?'+':''}${pnl}</b><span>P&L</span></div><div><b>${fmt(err,2)}</b><span>avg |mid − fair|</span></div><div><b>${g.hist.filter(h=>h.trade).length}</b><span>trades</span></div></div>
      <div class="list">${g.hist.map((h,i)=>`<div class="li"><span>R${i+1}: ${h.bid} – ${h.ask}</span><span class="mut">fair ${fmt(h.fair,2)} · ${h.trade||'no trade'}</span></div>`).join('')}</div>
      <p class="small mut">Judge yourself on quote error, not P&L: one game's P&L is mostly luck. A mid close to fair value, tightening as cards appear, is the skill.</p>
      <button class="big" id="again">New game</button><button class="big ghost" id="back">Back</button></div>`;
    $('#again').onclick=startMM; $('#back').onclick=()=>{ts=null; renderTests();}; return; }
  const shown=g.hand.slice(0,r);
  app.innerHTML = `<div class="row"><h1 class="grow">Make a market</h1><button class="chip" id="quit">Quit</button></div>
    <p class="sub">Settlement = sum of 5 cards from one deck (A=1 … K=13). Round ${r+1}/4. Max spread ${MAXSPREAD[r]}. Each trade is 1 lot.</p>
    <div class="card"><div class="cards">${g.hand.map((v,i)=>`<span class="pc ${i<r?'':'hid'}">${i<r?CARDNAME(v):'?'}</span>`).join('')}</div>
      <p class="small">Position <b>${g.pos>0?'+':''}${g.pos}</b> · cash <b>${g.cash}</b>${g.msg?`<br><span class="mut">${g.msg}</span>`:''}</p>
      <div class="row"><button class="qf ${g.field==='bid'?'on':''}" data-f="bid"><small>Bid</small>${g.bid||'—'}</button><button class="qf ${g.field==='ask'?'on':''}" data-f="ask"><small>Ask</small>${g.ask||'—'}</button></div>
      ${keypadHTML('num')}</div>`;
  app.querySelectorAll('[data-f]').forEach(b => b.onclick = () => { g.field=b.dataset.f; renderMM(); });
  $('#quit').onclick = () => { ts=null; kp=null; renderTests(); };
  bindKeypad(app, {get:()=>g[g.field], set:v=>{ g[g.field]=v.replace(/[^0-9.]/g,''); renderMM(); }, submit:()=>{
    if (g.field==='bid' && g.bid){ g.field='ask'; return renderMM(); }
    const b=parseFloat(g.bid), a=parseFloat(g.ask);
    if (!isFinite(b)||!isFinite(a)) return toast('Enter a bid and an ask');
    if (a<=b) return toast('Ask must be above bid');
    if (a-b>MAXSPREAD[r]) return toast(`Spread too wide (max ${MAXSPREAD[r]})`);
    const fair=mmFair(g.hand,r); let trade='';
    if (Math.random()<0.5){ if (g.sum>a){ g.pos--; g.cash+=a; trade=`informed bought @ ${a}`; } else if (g.sum<b){ g.pos++; g.cash-=b; trade=`informed sold @ ${b}`; } }
    else { if (Math.random()<.5){ g.pos--; g.cash+=a; trade=`noise bought @ ${a}`; } else { g.pos++; g.cash-=b; trade=`noise sold @ ${b}`; } }
    g.hist.push({bid:b, ask:a, mid:(a+b)/2, fair, trade});
    g.msg = `${trade || 'No trade'}. Fair value was ${fmt(fair,2)}, your mid ${fmt((a+b)/2,2)}.`;
    g.round++; g.bid=''; g.ask=''; g.field='bid';
    if (g.round>=4){ g.over=true; const h=store.get('mm',[]); h.push({d:today(), pnl:g.cash+g.pos*g.sum, err:g.hist.reduce((s,x)=>s+Math.abs(x.mid-x.fair),0)/4}); store.set('mm',h.slice(-200)); markActive(); }
    renderMM();
  }});
}

        <div class="row" style="gap:8px;margin-top:10px">${pr?`<button class="chip" data-pr="${pr.id}">Learn</button>`:''}${!m.fixed?`<button class="chip" data-one="${m.key}">Retry</button>`:''}${it.gid?`<button class="chip" data-sim="${m.key}">Similar</button>`:''}${!m.fixed?`<button class="chip" data-fix="${m.key}">Got it</button>`:''}</div></div>`; }).join('')
      : `<div class="card empty">${rvw.view==='session'?'No mistakes yet this session.':rvw.view==='open'?'Nothing to fix. 🎉':'Nothing fixed yet.'}</div>`}
    ${rvw.view==='fixed' && list.length ? `<button class="big ghost" id="clr">Clear fixed</button>`:''}`;
  body.querySelectorAll('[data-c]').forEach(b => b.onclick = () => { rvw.cat=b.dataset.c; renderReview(); });
  body.querySelectorAll('[data-pr]').forEach(b => b.onclick = () => { b.closest('.card').querySelector('.pslot').innerHTML = primerHTML(PRIMERS[b.dataset.pr]); b.remove(); });
  body.querySelectorAll('[data-fix]').forEach(b => b.onclick = () => { const m=mistakes.find(x=>x.key===b.dataset.fix); m.fixed=true; store.set('mistakes',mistakes); renderReview(); });
  body.querySelectorAll('[data-one]').forEach(b => b.onclick = () => startDrill([mistakes.find(x=>x.key===b.dataset.one)], false));
  body.querySelectorAll('[data-sim]').forEach(b => b.onclick = () => startDrill([mistakes.find(x=>x.key===b.dataset.sim)], true));
  const d=$('#drill'); if (d) d.onclick = () => startDrill(list.filter(m=>!m.fixed), false);
  const cl=$('#clr'); if (cl) cl.onclick = () => { mistakes = mistakes.filter(m=>!m.fixed); store.set('mistakes',mistakes); renderReview(); };
}
function startDrill(ms, similar){
  const q=[]; shuffle([...ms]).forEach(m => { const it=unsnap(m); if (!it) return; if (similar){ const g=GENS.find(x=>x.gid===it.gid); for (let i=0;i<5;i++){ const n=g&&makeGen(g); if (n) q.push({...n, simOf:m.key}); } } else { q.push({...it, retryKey:m.key}); const g=it.gid&&GENS.find(x=>x.gid===it.gid); if (g){ const n=makeGen(g); if (n) q.push({...n, simOf:m.key}); } } });
  rvw.drill={q, i:0, ok:0}; renderDrill();
}
function renderDrill(){
  const d=rvw.drill; if (d.i>=d.q.length){ kp=null; app.innerHTML = `<h1>Retry done</h1><div class="card" style="text-align:center"><div class="sprint-q">${d.ok}/${d.q.length}</div><p class="sub">Mistakes answered right twice move to Fixed.</p><button class="big" id="bk">Back to review</button></div>`; $('#bk').onclick=()=>{ rvw.drill=null; renderReview(); }; return; }
  const it=d.q[d.i];
  app.innerHTML = `<div class="row"><h1 class="grow">Retry</h1><span class="pill">${d.i+1}/${d.q.length}</span><button class="chip" id="stop" style="margin-left:8px">Stop</button></div><p class="sub">${it.retryKey?'The exact question you missed.':'A fresh one of the same kind.'}</p><div id="itm"></div>`;
  $('#stop').onclick = () => { rvw.drill=null; renderReview(); };
  renderItem($('#itm'), it, {done: res => {
    if (it.retryKey){ const m=mistakes.find(x=>x.key===it.retryKey); if (m) retryResult(m, res.ok); }
    else if (!res.ok) logMistake(it, res.given);
    if (!res.card){ bumpCat(it.cat,res.ok); bumpGen(it.gid,res.ok); }
    if (res.ok) d.ok++; d.i++; renderDrill();
  }});
}

/* ================= CARDS (SRS review) ================= */
let rv = {deck:store.get('lastDeck','all'), queue:null};
function counts(deck){ const now=Date.now(); let due=0,nw=0; for (const c of CARDS){ if (deck!=='all'&&c.deck!==deck) continue; const s=srs[c.id]; if (!s) nw++; else if (s.d<=now) due++; } return {due, nw:Math.min(nw, Math.max(0,settings.newPerDay-newToday()))}; }
function buildQueue(){ const now=Date.now(); const pool=CARDS.filter(c=>rv.deck==='all'||c.deck===rv.deck); const due=shuffle(pool.filter(c=>srs[c.id]&&srs[c.id].d<=now)); let fresh=pool.filter(c=>!srs[c.id]); if (rv.deck==='all') shuffle(fresh); fresh=fresh.slice(0,Math.max(0,settings.newPerDay-newToday())); rv.queue=due.concat(fresh); }
function renderCards(){
  if (!rv.queue) buildQueue();
  const decks=[{id:'all',title:'All'}].concat(DECKS);
  app.innerHTML = `<h1>Cards</h1><p class="sub">${CARDS.length} flashcards with spaced repetition. Due cards also appear in Train.</p>
    <div class="chips">${decks.map(d=>{const k=counts(d.id); return `<button class="chip ${rv.deck===d.id?'on':''}" data-deck="${d.id}">${esc(d.title)}<span class="n">${k.due+k.nw}</span></button>`;}).join('')}</div><div id="itm"></div>`;
  app.querySelectorAll('[data-deck]').forEach(b => b.onclick = () => { rv.deck=b.dataset.deck; store.set('lastDeck',rv.deck); rv.queue=null; renderCards(); });
  const c=rv.queue[0];
  if (!c){ kp=null; $('#itm').innerHTML = `<div class="card empty"><b style="color:var(--fg)">Done for now.</b><br>Nothing due here. Train never runs out.<button class="big" id="gotr">Go to Train</button></div>`; $('#gotr').onclick=()=>tab('train'); return; }
  renderItem($('#itm'), {type:'card', card:c, cat:c.cat}, {done: res => { const x=rv.queue.shift(); if (srs[x.id] && srs[x.id].i===0) rv.queue.splice(Math.min(3,rv.queue.length),0,x); renderCards(); }});
}

/* ================= PROGRESS ================= */
function streak(){ const set=new Set(store.get('days',[])); let n=0; const d=new Date(); if (!set.has(d.toISOString().slice(0,10))) d.setDate(d.getDate()-1); while (set.has(d.toISOString().slice(0,10))){ n++; d.setDate(d.getDate()-1); } return n; }
function spark(vals, label){ if (!vals.length) return ''; const max=Math.max(1,...vals.map(Math.abs)); const w=300/vals.length; return `<div class="card"><svg viewBox="0 0 300 90" width="100%" height="90" role="img" aria-label="${label}">${vals.map((v,i)=>{const h=Math.max(2,70*Math.abs(v)/max); return `<rect x="${i*w+3}" y="${80-h}" width="${Math.max(2,w-6)}" height="${h}" rx="3" fill="${v<0?'#ff6b6b':'#7aa2ff'}"/>`+(vals.length<=12?`<text x="${i*w+w/2}" y="${76-h}" font-size="10" fill="#9aa1ae" text-anchor="middle">${fmt(v,1)}</text>`:'');}).join('')}<line x1="0" y1="80.5" x2="300" y2="80.5" stroke="#2a2f3a"/></svg></div>`; }
function renderStats(){
  kp=null; renderStatsInner(); app.insertAdjacentHTML('beforeend', '<div id="morebox"></div>'); renderMore($('#morebox'));
}
function renderStatsInner(){
  const cs=store.get('cstat',{}), th=store.get('tests',{}), sp=store.get('sprints',[]), mm=store.get('mm',[]);
  const total=Object.values(cs).reduce((a,c)=>a+c.n,0);
  const seen=CARDS.filter(c=>srs[c.id]).length, due=CARDS.filter(c=>srs[c.id]&&srs[c.id].d<=Date.now()).length;
  const accRows = Object.entries(CATS).filter(([k])=>cs[k]).sort((a,b)=>(cs[a[0]].ok/cs[a[0]].n)-(cs[b[0]].ok/cs[b[0]].n)).map(([k,v])=>{const c=cs[k]; const p=Math.round(100*c.ok/c.n); return `<div class="list"><div class="li"><span>${v.t}</span><span class="mut">${c.ok}/${c.n} · ${p}%</span></div><div class="bar"><i style="width:${p}%;background:${p>=80?'var(--good)':p>=60?'var(--warn)':'var(--bad)'}"></i></div></div>`;}).join('');
  app.innerHTML = `<h1>Progress</h1><p class="sub">Stored in this browser only. Back it up from More.</p>
    <div class="stat"><div><b>${streak()}</b><span>day streak</span></div><div><b>${total}</b><span>questions answered</span></div><div><b>${due}</b><span>cards due</span></div></div>
    <h2>Accuracy by topic <span class="mut small">(weakest first)</span></h2>${accRows||'<p class="sub">Answer some questions in Train or Tests.</p>'}
    <h2>80 in 8</h2>${(th.oa80||[]).length?spark(th.oa80.slice(-20).map(x=>x.score),'80 in 8 scores'):'<p class="sub">No runs yet.</p>'}
    <h2>Zetamac sprint</h2>${sp.length?spark(sp.slice(-20).map(x=>x.score),'Sprint scores')+`<p class="sub">Best ${Math.max(...sp.map(s=>s.score))} · avg last 10 ${fmt(sp.slice(-10).reduce((a,s)=>a+s.score,0)/Math.min(10,sp.length),1)}</p>`:'<p class="sub">No runs yet.</p>'}
    <h2>Other tests</h2><div class="list">${['seq','prob','fpga'].map(k=>{const h=th[k]||[]; return `<div class="li"><span>${PRESETS[k].title}</span><span class="mut">${h.length?`best ${Math.max(...h.map(x=>x.score))}/${PRESETS[k].n} · last ${h[h.length-1].score} · ${h.length} runs`:'—'}</span></div>`;}).join('')}</div>
    <h2>Market making</h2>${mm.length?spark(mm.slice(-20).map(x=>+x.err.toFixed(2)),'Average quote error per game')+`<p class="sub">Bars: average distance of your mid from fair value per game (lower is better). ${mm.length} games, total P&L ${mm.reduce((a,g)=>a+g.pnl,0)}.</p>`:'<p class="sub">No games yet.</p>'}
    <h2>Cards</h2><p class="sub">${seen}/${CARDS.length} seen · ${CARDS.filter(c=>srs[c.id]&&srs[c.id].i>=21).length} mature</p>`;
}

/* ================= MORE ================= */
function renderMore(host){
  host.innerHTML = `<h1 style="margin-top:28px">Settings & backup</h1>
    <h2>Add your own card</h2><div class="card"><label>Front (supports <code>\`code\`</code>, <code>**bold**</code>, <code>\`\`\`</code> blocks)</label><textarea id="cq"></textarea><label>Back</label><textarea id="ca"></textarea><button class="big" id="addc">Add to "My cards"</button></div>
    <h2>Settings</h2><div class="card"><label>New cards per day (Cards tab)</label><input id="snew" type="number" inputmode="numeric" min="0" max="500" value="${settings.newPerDay}"><label>Zetamac sprint length</label><select id="ssec">${[60,120,180].map(s=>`<option ${s===settings.sprintSecs?'selected':''}>${s}</option>`).join('')}</select><label style="display:flex;gap:10px;align-items:center;color:var(--fg);font-size:15px"><input type="checkbox" id="sauto" style="width:auto" ${settings.autoNext?'checked':''}> Auto-advance after a correct answer</label><button class="big ghost" id="saves">Save</button></div>
    <h2>Backup</h2><div class="card"><p class="small mut" style="margin-top:0">Progress lives in this browser and can be cleared. Copy a backup now and then.</p><button class="big ghost" id="exp">Copy backup</button><label>Restore</label><textarea id="imp" placeholder="Paste backup here"></textarea><button class="big ghost" id="doimp">Restore</button></div>
    <h2>Install</h2><div class="card small">In Chrome on Android: <b>⋮ → Install app</b> (or Add to Home screen). Once installed it works offline. ${navigator.serviceWorker && navigator.serviceWorker.controller ? '<b style="color:var(--good)">Offline mode is active.</b>' : 'Offline mode not active on this page.'}</div>
    <p class="sub" style="margin-top:14px">${CARDS.length} cards · ${MCB.length} multiple-choice · ${GENS.length} problem generators.</p>`;
  $('#addc').onclick = () => { const q=$('#cq').value.trim(), a=$('#ca').value.trim(); if (!q||!a) return toast('Fill in both sides'); const custom=store.get('custom',[]); const c={id:hash('mine'+q+Date.now()), q, a}; custom.push(c); store.set('custom',custom); if (!DECKS.find(d=>d.id==='mine')) DECKS.push({id:'mine',title:'My cards',cat:'mine'}); CARDS.push({...c,deck:'mine',cat:'mine'}); rv.queue=null; $('#cq').value=''; $('#ca').value=''; toast('Card added'); };
  $('#saves').onclick = () => { settings.newPerDay=Math.max(0,+$('#snew').value||0); settings.sprintSecs=+$('#ssec').value; settings.autoNext=$('#sauto').checked; store.set('settings',settings); rv.queue=null; toast('Saved'); };
  $('#exp').onclick = async () => { const keys=['srs','custom','sprints','tests','mm','cstat','gstat','mistakes','revlog','days','settings','newday']; const data={}; keys.forEach(k=>data[k]=store.get(k,null)); const txt=JSON.stringify({edge:2,data}); try{ await navigator.clipboard.writeText(txt); toast('Backup copied'); }catch(e){ $('#imp').value=txt; $('#imp').select(); toast('Copy blocked: backup shown below'); } };
  $('#doimp').onclick = () => { try{ const o=JSON.parse($('#imp').value); if (!o.edge) throw 0; Object.entries(o.data).forEach(([k,v])=>{ if (v!==null) store.set(k,v); }); toast('Restored, reloading'); setTimeout(()=>location.reload(),600); }catch(e){ toast("That doesn't look like a backup"); } };
}

/* ================= tabs ================= */
let cur='train';
function tab(t){
  if (ts && t!=='tests'){ if (ts.tick) clearInterval(ts.tick); if (ts.kind==='test' && !ts.over){ /* leaving abandons the test */ clearInterval(window._tt); } ts=null; }
  cur=t; kp=null;
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on', b.dataset.tab===t));
  ({train:renderTrain, tests:renderTests, review:renderReview, cards:renderCards, stats:renderStats})[t]();
  window.scrollTo(0,0);
}
document.querySelectorAll('nav button').forEach(b => b.onclick = () => { if (b.dataset.tab==='cards') rv.queue=null; if (b.dataset.tab==='review') rvw.drill=null; tab(b.dataset.tab); });
if ('serviceWorker' in navigator && (location.protocol==='https:' || location.hostname==='localhost') && !location.hostname.endsWith('claude.ai') && window.top===window){ navigator.serviceWorker.register('sw.js').catch(()=>{}); }
window.__edge = {GENS, MCB, CARDS, check, makeGen, oaQ, fval, fstr, conceptOf, PRIMERS, CATS};
tab('train');
})();

</script>
